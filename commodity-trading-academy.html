    return { prompt: `Loading ${f(q, 0)} t at ${f(rate, 0)} t/day. Actual time ${f(used, 3)} days. Demurrage ${f(dem, 0)}/day, despatch at half demurrage. Despatch?`, answer: ans, unit: 'USD', tol: 1,
      formula: 'Despatch = (laytime − used) × demurrage ÷ 2', steps: [`Laytime = ${f(allowed, 3)}`, `Saved = ${f(allowed - used, 3)} days`, `× ${f(dem / 2, 0)} = ${f(ans)}`],
      mistakes: 'Using the full demurrage rate.', implication: 'Fast terminals can be a source of extra income for charterers.' };
  });
  ex('ex-freight-eff', 'logistics', 'Effective freight with congestion', (r) => {
    const fr = rr(r, 18, 55, 0.25), q = r.int(20, 60) * 1000, days = r.int(2, 15), dem = r.int(10, 30) * 1000;
    const ans = fr + days * dem / q;
    return { prompt: `Freight ${f(fr)}/t for ${f(q, 0)} t. Port congestion causes ${days} days of waiting at ${f(dem, 0)}/day demurrage for your account. Effective freight per t?`, answer: ans, unit: 'USD/t', tol: 0.01,
      formula: 'Effective = freight + (days × demurrage ÷ quantity)', steps: [`Demurrage = ${f(days * dem, 0)}`, `Per t = ${f(days * dem / q)}`, `Effective = ${f(ans)}`], mistakes: 'Forgetting to spread the lump-sum demurrage over tonnes.', implication: 'Congestion can turn the cheapest route into the most expensive.' };
  });
  ex('ex-storage', 'logistics', 'Storage and carrying cost', (r) => {
    const q = r.int(5, 40) * 1000, st = rr(r, 1.5, 5, 0.25), m = r.int(1, 6), val = rr(r, 220, 550, 1), rate = rr(r, 4, 10, 0.25);
    const ans = q * st * m + C.interest(q * val, rate, m * 30);
    return { prompt: `You store ${f(q, 0)} t worth ${f(val, 0)}/t for ${m} months. Storage costs ${f(st)}/t/month; financing ${f(rate)}% p.a. (30-day months, ACT/360). Total carrying cost?`, answer: ans, unit: 'USD', tol: 2,
      formula: 'Carry = qty × storage × months + value × rate × days/360', steps: [`Storage = ${f(q * st * m, 0)}`, `Financing = ${f(C.interest(q * val, rate, m * 30))}`, `Total = ${f(ans)}`], mistakes: 'Ignoring financing, which is often bigger than storage.', implication: `The forward price must exceed spot by ${f(ans / q)}/t to cover carry.` };
  });
  /* ------------------------------------------------------------ derivatives */
  ex('ex-fut-gold', 'derivatives', 'Gold futures P&L', (r) => {
    const side = r.pick(['long', 'short']), n = r.int(1, 12), e = rr(r, 1900, 2300, 0.1), x = e + rr(r, -60, 60, 0.1);
    const ans = C.futuresPnL(side, e, x, n, 100);
    return { prompt: `You are ${side} ${n} gold futures (100 oz, illustrative) from ${f(e, 1)}, closed at ${f(x, 1)}. P&L before fees (USD, negative for a loss)?`, answer: ans, unit: 'USD', tol: 0.5,
      formula: 'P&L = (exit − entry) × 100 × contracts × (±1)', steps: [`Change = ${f(x - e, 1)}`, `× 100 × ${n} × ${side === 'long' ? '+1' : '−1'} = ${f(ans)}`], mistakes: 'Getting the sign wrong for shorts.', implication: 'Futures P&L is paid daily via variation margin.' };
  });
  ex('ex-fut-wheat', 'derivatives', 'Wheat futures P&L in cents per bushel', (r) => {
    const side = r.pick(['long', 'short']), n = r.int(1, 20), e = rr(r, 500, 750, 0.25), x = e + rr(r, -40, 40, 0.25);
    const ans = C.futuresPnL(side, e / 100, x / 100, n, 5000);
    return { prompt: `${side === 'long' ? 'Bought' : 'Sold'} ${n} wheat futures (5,000 bu) at ${f(e, 2)} c/bu; closed at ${f(x, 2)} c/bu. P&L (USD)?`, answer: ans, unit: 'USD', tol: 0.5,
      formula: 'P&L = (exit − entry) ÷ 100 × 5,000 × contracts × (±1)', steps: [`Change = ${f(x - e, 2)} c = ${f((x - e) / 100, 4)} USD/bu`, `× 5,000 × ${n} ${side === 'short' ? '× −1' : ''} = ${f(ans)}`], mistakes: 'Forgetting to convert cents to dollars (100× error).', implication: 'One cent per bushel = 50 USD per contract.' };
  });
  ex('ex-fut-sugar', 'derivatives', 'Raw sugar futures P&L', (r) => {
    const side = r.pick(['long', 'short']), n = r.int(1, 25), e = rr(r, 15, 26, 0.01), x = e + rr(r, -1.5, 1.5, 0.01);
    const ans = C.futuresPnL(side, e / 100, x / 100, n, 112000);
    return { prompt: `${side === 'long' ? 'Long' : 'Short'} ${n} raw sugar futures (112,000 lb, illustrative) from ${f(e)} c/lb to ${f(x)} c/lb. P&L (USD)?`, answer: ans, unit: 'USD', tol: 0.5,
      formula: 'P&L = Δ(c/lb) ÷ 100 × 112,000 × contracts × (±1)', steps: [`Δ = ${f(x - e)} c/lb = ${f((x - e) * 1120)} USD per contract`, `× ${n} ${side === 'short' ? '× −1' : ''} = ${f(ans)}`], mistakes: 'Cents vs dollars confusion.', implication: 'One point (0.01 c/lb) = USD 11.20 per contract.' };
  });
  ex('ex-margin', 'derivatives', 'Margin call amount', (r) => {
    const n = r.int(1, 8), im = r.int(6, 15) * 1000, mm = Math.round(im * 0.9), loss = r.int(1, 6) * 1000 * n, dep = im * n + r.int(0, 3) * 1000;
    const eq = dep - loss, call = eq < mm * n ? im * n - eq : 0;
    return { prompt: `You deposit ${f(dep, 0)} and hold ${n} contracts with initial margin ${f(im, 0)} and maintenance ${f(mm, 0)} per contract. Losses so far: ${f(loss, 0)}. Margin call (restore to initial margin; 0 if none)?`, answer: call, unit: 'USD', tol: 0.5,
      formula: 'If equity < maintenance × n: call = initial × n − equity', steps: [`Equity = ${f(dep, 0)} − ${f(loss, 0)} = ${f(eq, 0)}`, `Maintenance req. = ${f(mm * n, 0)}; initial req. = ${f(im * n, 0)}`, call ? `Call = ${f(im * n, 0)} − ${f(eq, 0)} = ${f(call, 0)}` : 'Equity above maintenance → no call'],
      mistakes: 'Topping up only to maintenance margin.', implication: 'Hedgers need liquidity lines for margin calls even when the physical position gains.' };
  });
  ex('ex-leverage', 'derivatives', 'Effective leverage', (r) => {
    const n = r.int(1, 10), p = rr(r, 1900, 2300, 1), eq = r.int(5, 40) * 10000;
    const ans = n * 100 * p / eq;
    return { prompt: `An account with equity ${f(eq, 0)} holds ${n} gold futures (100 oz) at ${f(p, 0)}. Leverage (notional ÷ equity, ×)?`, answer: ans, unit: '×', tol: 0.05,
      formula: 'Leverage = contracts × multiplier × price ÷ equity', steps: [`Notional = ${f(n * 100 * p, 0)}`, `÷ ${f(eq, 0)} = ${f(ans)}×`], mistakes: 'Using margin instead of equity.', implication: `A 1% move changes equity by about ${f(ans)}%.` };
  });
  ex('ex-hedge', 'derivatives', 'Hedge result with basis change', (r) => {
    const q = r.int(2, 30) * 1000, s0 = rr(r, 220, 300, 0.5), b0 = rr(r, -20, 5, 0.5), ds = rr(r, -30, 10, 0.5), db = rr(r, -6, 6, 0.5);
    const f0 = s0 - b0, s1 = s0 + ds, f1 = s1 - (b0 + db);
    const h = C.hedgeOutcome({ qty: q, spot0: s0, spot1: s1, fut0: f0, fut1: f1 });
    return { prompt: `A merchant owns ${f(q, 0)} t of wheat bought at a cash price of ${f(s0)}/t and sells futures (tonne-equivalent) at ${f(f0)}. Later cash is ${f(s1)} and futures ${f(f1)}. Net result of physical + futures?`, answer: h.net, unit: 'USD', tol: 1,
      formula: 'Net = qty × [(S1 − S0) − (F1 − F0)] = qty × Δbasis', steps: [`Physical = ${f(h.physical)}`, `Futures = ${f(h.futures)}`, `Net = ${f(h.net)} (basis change ${f(h.basisChange)})`], mistakes: 'Thinking a hedge removes all risk.', implication: 'The hedge converted price risk into basis risk.' };
  });
  ex('ex-hedge-n', 'derivatives', 'Sugar futures contracts for a hedge', (r) => {
    const t = r.int(10, 60) * 1000, ratio = r.pick([0.8, 0.9, 1]);
    const lbT = C.convertMass(1, 't', 'lb'), ans = Math.round(t * lbT * ratio / 112000);
    return { prompt: `A refinery wants to hedge ${f(t, 0)} t of raw sugar purchases with futures of 112,000 lb each at a hedge ratio of ${ratio}. Number of contracts (nearest whole)?`, answer: ans, unit: 'contracts', tol: 0, dp: 0,
      formula: 'Contracts = tonnes × 2,204.62 × ratio ÷ 112,000', steps: [`${f(t, 0)} t = ${f(t * lbT, 0)} lb`, `× ${ratio} ÷ 112,000 = ${f(t * lbT * ratio / 112000, 2)} → ${ans}`], mistakes: 'Using 2,000 lb per tonne.', implication: 'One contract ≈ 50.8 t of sugar.' };
  });
  /* ------------------------------------------------------------ options */
  ex('ex-opt-tv', 'options', 'Intrinsic and time value', (r) => {
    const type = r.pick(['call', 'put']), F = rr(r, 1900, 2300, 1), K = Math.round((F + r.range(-80, 80)) / 10) * 10, prem = Math.max(5, Math.round(Math.abs(F - K) * 0.6 + r.range(10, 50)));
    const iv = type === 'call' ? Math.max(F - K, 0) : Math.max(K - F, 0), ans = prem - iv;
    return { prompt: `A gold ${type} with strike ${f(K, 0)} trades at a premium of ${f(prem, 0)} when futures are at ${f(F, 0)}. Time value?`, answer: ans, unit: 'USD/oz', tol: 0.01,
      formula: 'Time value = premium − intrinsic value', steps: [`Intrinsic = ${type === 'call' ? `max(${F} − ${K}, 0)` : `max(${K} − ${F}, 0)`} = ${f(iv, 0)}`, `Time value = ${f(prem, 0)} − ${f(iv, 0)} = ${f(ans, 0)}`], mistakes: 'Using F − K for puts.', implication: 'Time value decays to zero at expiry — the option buyer pays for it.' };
  });
  ex('ex-opt-bs', 'options', 'Black-76 call price', (r) => {
    const F = rr(r, 1900, 2300, 1), K = Math.round(F / 25) * 25 + r.pick([-50, -25, 0, 25, 50]), T = r.pick([30, 60, 90, 180]) / 365, vol = rr(r, 0.12, 0.28, 0.01), rate = rr(r, 0.02, 0.06, 0.005);
    const ans = C.black76(F, K, T, rate, vol, 'call').price;
    return { prompt: `Price a European call on gold futures with Black-76: F = ${f(F, 0)}, K = ${f(K, 0)}, T = ${f(T * 365, 0)} days (÷365), σ = ${f(vol * 100, 0)}%, r = ${f(rate * 100, 1)}%. (Use the Options tool or compute d1, d2.)`, answer: ans, unit: 'USD/oz', tol: 0.25,
      formula: 'C = e^(−rT) [F·N(d1) − K·N(d2)], d1 = [ln(F/K) + σ²T/2] / (σ√T), d2 = d1 − σ√T', steps: [`d1 = ${f(C.black76(F, K, T, rate, vol, 'call').d1, 4)}, d2 = ${f(C.black76(F, K, T, rate, vol, 'call').d2, 4)}`, `C = ${f(ans, 2)}`],
      mistakes: 'Using days instead of years for T; percent instead of decimals.', implication: 'Model price under strong simplifying assumptions; real markets have skews and jumps.' };
  });
  ex('ex-opt-delta', 'options', 'Delta-approximated option P&L', (r) => {
    const d = rr(r, 0.2, 0.8, 0.01), dF = rr(r, -40, 40, 1), n = r.int(1, 10);
    const ans = d * dF * n * 100;
    return { prompt: `You hold ${n} long gold call options (each on 100 oz futures) with delta ${f(d)}. Futures move ${dF >= 0 ? '+' : ''}${f(dF, 0)}. Approximate change in option position value (first-order)?`, answer: ans, unit: 'USD', tol: 1,
      formula: 'ΔV ≈ delta × ΔF × multiplier × contracts', steps: [`${f(d)} × ${f(dF, 0)} × 100 × ${n} = ${f(ans)}`], mistakes: 'Forgetting the multiplier.', implication: 'Large moves need gamma: delta changes as the price moves.' };
  });
  ex('ex-opt-be', 'options', 'Break-even at expiry for a put buyer', (r) => {
    const K = r.int(520, 760), prem = rr(r, 6, 30, 0.25);
    return { prompt: `A farmer buys a put on wheat futures with strike ${K} c/bu for a premium of ${f(prem)} c/bu. At what futures price at expiry does the farmer break even on the option alone?`, answer: K - prem, unit: 'c/bu', tol: 0.01,
      formula: 'Put break-even = strike − premium', steps: [`${K} − ${f(prem)} = ${f(K - prem)}`], mistakes: 'Adding the premium (that is for calls).', implication: 'Below this price, the put more than pays for itself as price insurance.' };
  });
  /* ------------------------------------------------------------ spreads */
  ex('ex-arb', 'spreads', 'Does the geographic arbitrage survive costs?', (r) => {
    const o = rr(r, 200, 280, 0.5), gap = rr(r, 20, 55, 0.5), d = o + gap, fr = rr(r, 15, 45, 0.5), hand = rr(r, 3, 9, 0.5), ins = rr(r, 0.08, 0.25, 0.01), duty = r.pick([0, 0, 2.5, 5]), rate = rr(r, 5, 9, 0.25), days = r.int(20, 60);
    const res = C.arbitrage({ originPrice: o, destPrice: d, freight: fr, insurancePct: ins, dutyPct: duty, handling: hand, financeRatePct: rate, days });
    return { prompt: `Origin FOB ${f(o)}/t; destination price ${f(d)}/t (same quality, same currency). Freight ${f(fr)}, insurance ${f(ins)}% on 110% CFR, duty ${duty}% on CIF, handling ${f(hand)}, financing ${f(rate)}% on CFR for ${days} days (ACT/360). Net margin per t after all costs?`, answer: res.marginPerT, unit: 'USD/t', tol: 0.05,
      formula: 'Delivered = FOB + freight + insurance + duty + handling + financing; margin = destination − delivered', steps: [`Insurance = ${f(res.insurance)}; duty = ${f(res.duty)}; financing = ${f(res.financing)}`, `Delivered = ${f(res.delivered)}`, `Margin = ${f(d)} − ${f(res.delivered)} = ${f(res.marginPerT)}`],
      mistakes: 'Calling the raw price gap (' + f(gap) + ') an arbitrage.', implication: res.marginPerT > 0 ? 'Positive after costs — now check execution risk, timing and counterparty.' : 'No arbitrage: the gap is explained by transfer costs.' };
  });
  ex('ex-calendar', 'spreads', 'Full-carry calendar spread', (r) => {
    const s = rr(r, 200, 300, 0.5), st = rr(r, 1.5, 4, 0.25), m = r.pick([2, 3, 4, 6]), rate = rr(r, 4, 9, 0.25), insr = rr(r, 0.05, 0.2, 0.01);
    const ans = st * m + s * (rate / 100 * m * 30 / 360) + s * insr / 100 * m / 12;
    return { prompt: `Grain spot ${f(s)}/t. Storage ${f(st)}/t/month, financing ${f(rate)}% p.a. (30-day months, /360), insurance ${f(insr)}% of value per year. Full-carry spread for ${m} months (USD/t)?`, answer: ans, unit: 'USD/t', tol: 0.05,
      formula: 'Full carry = storage × months + spot × rate × days/360 + spot × insurance × months/12', steps: [`Storage = ${f(st * m)}`, `Financing = ${f(s * rate / 100 * m * 30 / 360)}`, `Insurance = ${f(s * insr / 100 * m / 12)}`, `Total = ${f(ans)}`],
      mistakes: 'Leaving out financing.', implication: 'If the deferred contract trades above spot + full carry, cash-and-carry is attractive.' };
  });
  /* ------------------------------------------------------------ quant & risk */
  ex('ex-vol', 'quant', 'Annualise daily volatility', (r) => {
    const d = rr(r, 0.6, 2.8, 0.05);
    return { prompt: `Daily standard deviation of log returns is ${f(d)}%. Annualised volatility with 252 trading days?`, answer: d * Math.sqrt(252), unit: '%', tol: 0.05,
      formula: 'σ_annual = σ_daily × √252', steps: [`√252 = 15.875`, `${f(d)}% × 15.875 = ${f(d * Math.sqrt(252))}%`], mistakes: 'Multiplying by 252 instead of √252.', implication: 'Use annual vol for option pricing and risk comparisons.' };
  });
  ex('ex-var', 'quant', 'Parametric 1-day VaR', (r) => {
    const val = r.int(2, 30) * 1000000, s = rr(r, 0.8, 2.5, 0.05), c = r.pick([0.95, 0.99]);
    const z = C.invNorm(c), ans = z * s / 100 * val;
    return { prompt: `A position worth ${f(val, 0)} has daily return volatility of ${f(s)}% and zero mean. Parametric (normal) 1-day VaR at ${c * 100}%?`, answer: ans, unit: 'USD', tol: ans * 0.002,
      formula: 'VaR = z × σ × value', steps: [`z(${c * 100}%) = ${f(z, 4)}`, `VaR = ${f(z, 4)} × ${f(s)}% × ${f(val, 0)} = ${f(ans)}`], mistakes: 'Using z for a two-sided interval (1.96 for 95%).', implication: 'Fat tails mean real losses beyond VaR can be much larger — check Expected Shortfall and stress tests.' };
  });
  ex('ex-size', 'risk', 'Position size from a risk budget', (r) => {
    const eq = r.int(5, 50) * 100000, risk = r.pick([0.5, 1, 1.5, 2]), entry = rr(r, 1900, 2300, 1), stopD = r.int(10, 60);
    const ans = C.positionSize(eq, risk, entry, entry - stopD, 100);
    return { prompt: `Equity ${f(eq, 0)}; you risk ${risk}% per trade. Long gold futures (100 oz) entry ${f(entry, 0)}, stop ${f(entry - stopD, 0)}. Maximum whole contracts?`, answer: ans, unit: 'contracts', tol: 0, dp: 0,
      formula: 'Contracts = floor(equity × risk% ÷ (stop distance × multiplier))', steps: [`Budget = ${f(eq * risk / 100, 0)}`, `Per contract = ${stopD} × 100 = ${f(stopD * 100, 0)}`, `→ ${ans}`], mistakes: 'Rounding up.', implication: 'Gaps can still cause losses beyond the stop.' };
  });
  ex('ex-pvol', 'quant', 'Two-asset portfolio volatility', (r) => {
    const w = r.pick([0.3, 0.4, 0.5, 0.6]), v1 = rr(r, 0.12, 0.3, 0.01), v2 = rr(r, 0.12, 0.35, 0.01), rho = rr(r, -0.3, 0.8, 0.05);
    const ans = C.portfolioVol([w, 1 - w], [v1, v2], [[1, rho], [rho, 1]]) * 100;
    return { prompt: `Portfolio: ${w * 100}% gold (vol ${f(v1 * 100, 0)}%) and ${(1 - w) * 100}% wheat (vol ${f(v2 * 100, 0)}%), correlation ${f(rho)}. Portfolio volatility (%)?`, answer: ans, unit: '%', tol: 0.05,
      formula: 'σp = √(w1²σ1² + w2²σ2² + 2w1w2ρσ1σ2)', steps: [`= √(${f(w * w * v1 * v1, 5)} + ${f((1 - w) ** 2 * v2 * v2, 5)} + ${f(2 * w * (1 - w) * rho * v1 * v2, 5)})`, `= ${f(ans)}%`], mistakes: 'Averaging the volatilities (that assumes ρ = 1).', implication: `Diversification saves ${f((w * v1 + (1 - w) * v2) * 100 - ans)} points vs the weighted average.` };
  });
  ex('ex-el', 'risk', 'Expected loss on a receivable', (r) => {
    const ead = r.int(10, 80) * 100000, pd = rr(r, 0.5, 8, 0.1), lgd = r.pick([40, 50, 60, 75]);
    const ans = ead * pd / 100 * lgd / 100;
    return { prompt: `Open-account receivable ${f(ead, 0)}; probability of default ${f(pd, 1)}%; loss given default ${lgd}%. Expected loss?`, answer: ans, unit: 'USD', tol: 1,
      formula: 'EL = EAD × PD × LGD', steps: [`${f(ead, 0)} × ${f(pd, 1)}% × ${lgd}% = ${f(ans)}`], mistakes: 'Ignoring recovery (LGD).', implication: 'Compare EL with the price premium the buyer offers for credit terms, and with the cost of credit insurance or an LC.' };
  });
  ex('ex-stress', 'risk', 'Combined wheat stress test', (r) => {
    const q = 5000, price = rr(r, 240, 290, 0.5), fall = r.pick([5, 8, 10, 12]), fr = rr(r, 25, 40, 0.5), frUp = r.pick([10, 15, 25]), delay = r.int(5, 15), dem = r.int(8, 16) * 1000, ext = r.pick([30, 45, 60]), rate = rr(r, 6, 10, 0.25);
    const priceLoss = q * price * fall / 100, frLoss = q * fr * frUp / 100, demLoss = delay * dem, finLoss = C.interest(q * price, rate, ext), ans = priceLoss + frLoss + demLoss + finLoss;
    return { prompt: `Unhedged: 5,000 t wheat valued at ${f(price)}/t. Price falls ${fall}%; freight (${f(fr)}/t, for your account) rises ${frUp}%; vessel delay ${delay} days at ${f(dem, 0)}/day demurrage; buyer extends payment by ${ext} days on the cargo value at ${f(rate)}% p.a. (ACT/360). Combined additional cost/loss?`, answer: ans, unit: 'USD', tol: 5,
      formula: 'Loss = price fall + freight increase + demurrage + extra financing', steps: [`Price = ${f(priceLoss)}`, `Freight = ${f(frLoss)}`, `Demurrage = ${f(demLoss)}`, `Financing = ${f(finLoss)}`, `Total = ${f(ans)}`], mistakes: 'Looking at each shock separately, or forgetting financing on the extension.', implication: 'Risk events cluster; liquidity reserves must cover the combined case.' };
  });
})();

<script>
/* js/data/cases.js */
/* Practical cases — 10 per commodity. All companies, prices and events are SIMULATED.
 * Step types:  num    → numerical answer checked with tolerance, worked solution shown
 *              choice → decision with scored options; every option's consequence is revealed after answering */
(function () {
  const CTA = window.CTA, C = window.CALC;
  const f = (n, d = 2) => CTA.fmt.num(n, d);
  const CASES = (CTA.CASES = []);
  const kc = (o) => CASES.push(o);
  const FO = (kg, fin) => C.fineOunces(kg, 'kg', fin == null ? 0.9999 : fin);

  /* =========================================================== GOLD */
  (() => {
    const oz = FO(10), buy = oz * 2001, sell = oz * 2006, costs = buy * 0.0007, net = sell - buy - costs;
    kc({ id: 'gc1', commodity: 'gold', title: 'Buying physical gold for resale', brief: 'Buy ten kilobars from a refiner and resell to a jewellery manufacturer — is it worth it and how do you protect the margin?',
      context: 'Aurum Trading DMCC (fictional) can buy 10 × 1 kg 999.9 bars from an accredited refiner at spot + 1.00/oz, delivered to its vault. A jewellery manufacturer will buy them at spot + 6.00/oz in two weeks. Secure transport and insurance cost 0.07% of the purchase value. Spot today: 2,000/oz.',
      data: [['Bars', '10 × 1 kg, 999.9'], ['Buy price', 'spot + 1.00 /oz'], ['Sell price', 'spot + 6.00 /oz'], ['Spot (both dates, for this step)', '2,000'], ['Logistics & insurance', '0.07% of purchase value']],
      steps: [
        { type: 'num', q: 'Net profit if spot is unchanged at 2,000 on both dates (USD)?', ans: net, tol: 2, unit: 'USD', work: [`Fine oz = 10 × 32.1507 × 0.9999 = ${f(oz, 3)}`, `Purchase = ${f(oz, 3)} × 2,001 = ${f(buy)}`, `Sale = ${f(oz, 3)} × 2,006 = ${f(sell)}`, `Costs = 0.07% × purchase = ${f(costs)}`, `Net = ${f(net)}`] },
        { type: 'choice', q: 'Between purchase and resale (two weeks) the price can move. What do you do?', opts: [
          ['Sell ~3 gold futures (≈ 321 oz) when buying and buy them back when the jeweller prices', 100, 'Correct: you are long 321 oz for two weeks. A short futures hedge locks the spot level so the margin is the premium spread (5/oz) minus costs; the residual is basis and a ~0.5% size mismatch.'],
          ['Do nothing — gold usually rises', 20, 'Speculative. A 1% fall (≈20/oz) would cost ~6,400, five times the expected profit.'],
          ['Ask the jeweller to price on the purchase date (back-to-back pricing)', 90, 'Also excellent if the jeweller accepts: both legs fixed at the same spot removes price risk without futures. Check the jeweller\'s credit risk for two weeks.'],
          ['Buy 3 more futures to increase exposure', 0, 'This doubles your long position — the opposite of hedging.']] },
      ], solution: `The trade earns the premium spread of 5/oz on ${f(oz, 2)} fine oz = ${f(oz * 5)} less costs ${f(costs)} = ${f(net)}. It is small relative to the ~643,000 at risk, so price risk must be hedged (futures) or eliminated (back-to-back pricing).`, skills: ['gold', 'physical', 'derivatives'] });
  })();
  (() => {

        { type: 'choice', q: 'Decision?', opts: [['Decline or negotiate a bigger discount/extended payment terms — the discount does not cover carrying costs and price risk', 100, 'Correct.'], ['Accept — 12/t discount', 0, 'Carrying costs exceed it.'], ['Accept and hope prices rise', 10, 'Speculation, not procurement.']] }],

  (() => {

    kc({ id: 'stc6', commodity: 'steel', title: 'Assessing raw material price changes', brief: 'Ore +15%, coal +10%: what does it do to mill costs — and prices?',

      solution: `Costs +${f(d)}/t. Margins absorb part of it unless demand is strong.`, skills: ['steel', 'analysis'] });
  })();
  (() => {
    const allow = 4800 * 0.03 * 640 * 0.25 + 3500;
    kc({ id: 'stc7', commodity: 'steel', title: 'Managing a quality claim', brief: 'Rust on a share of bundles at discharge.',

      data: [['A', 'CFR 644, AD duty 18.5%'], ['B', 'CFR 657, no AD duty']],
      steps: [{ type: 'num', q: 'Duty-paid cost of A per t?', ans: a, tol: 0.05, unit: 'USD/t', work: ['644 × 1.185 = ' + f(a)] },
        { type: 'choice', q: 'Which origin and why?', opts: [['B: 657 vs A ' + f(a) + ' — and verify origin rules so B\'s material is not re-labelled A-origin (circumvention)', 100, 'Correct and compliance-aware.'], ['A — lower CFR', 0, 'Ignores the duty.'], ['Ship A via a third country to avoid duty', 0, 'This is circumvention and can be illegal.']] }],
      solution: 'Trade remedies are origin-specific. Origin documentation and anti-circumvention rules are critical.', skills: ['steel', 'finance'] });
  })();
  (() => {
    const d = C.dealPnL({ qty: 8000, buyTerm: 'FOB', buyPrice: 545, freight: 41, insurancePct: 0.15, inspection: 11000, dutyPct: 0, portCharges: 0, financeRatePct: 7.5, financeDays: 70, sellPrice: 618, commissionPct: 1, otherDealExp: 20000 });
    kc({ id: 'stc10', commodity: 'steel', title: 'Profit of an international steel trade', brief: 'FOB purchase from a mill, CFR sale to a distributor with commission.',
      context: 'Buy 8,000 t rebar FOB 545; freight 41/t; insurance 0.15% × 110% CFR; pre-shipment inspection 11,000; financing 7.5% for 70 days; sell CFR 618 with a 1% agent commission; other deal expenses 20,000.',
      data: [['Buy', 'FOB 545'], ['Sell', 'CFR 618, 1% commission'], ['Freight', '41'], ['Other', '11k + 20k']],
      steps: [{ type: 'num', q: 'Net profit (USD)?', ans: d.netProfit, tol: 5, unit: 'USD', work: [`Landed = ${f(d.landed.total, 0)}`, `Net revenue = ${f(d.netRevenue, 0)}`, `Net = ${f(d.netProfit, 0)}`] },
        { type: 'num', q: 'Annualised ROIC if 75% of working capital is bank-funded (%)?', ans: C.dealPnL(Object.assign({ qty: 8000, buyTerm: 'FOB', buyPrice: 545, freight: 41, insurancePct: 0.15, inspection: 11000, financeRatePct: 7.5, financeDays: 70, sellPrice: 618, commissionPct: 1, otherDealExp: 20000, bankFundedPct: 75 })).roicAnnual * 100, tol: 0.5, unit: '%', work: ['Equity = 25% of working capital (landed before financing)', 'ROIC = net / equity; × 365/70'] }],
      solution: `Net ${f(d.netProfit, 0)}; margin ${f(d.netMarginPct)}%.`, skills: ['steel', 'physical'] });
  })();

  CASES.forEach((c) => { c.steps.forEach((s, i) => { s.id = c.id + '-' + i; }); });
})();

<script>
/* js/data/markets.js */
/* Market data module — EVERYTHING HERE IS SIMULATED OR ILLUSTRATIVE.
 * - Contract specifications are illustrative teaching values modelled on commonly published designs.
 *   They are editable in Settings and must be verified against current exchange rulebooks before real use.
 * - Prices are produced by the documented model in CALC.simulateOHLC (GBM + scheduled regime changes/jumps).
 * - No live data feed is connected. See README "Live data" for what a real integration would require. */
(function () {
  const CTA = window.CTA, C = window.CALC;
  const M = (CTA.MARKET = {});

  /* pointValue = USD per 1.0 move in the quoted price. tick value = tick × pointValue. */
  M.SPECS_DEFAULT = {
    GC: { name: 'Gold futures (100 oz type)', commodity: 'gold', unit: 'USD/ozt', size: '100 troy oz', pointValue: 100, tick: 0.1, im: 12000, mm: 11000, fee: 2.5, spreadTicks: 2, slipTicks: 1, start: 2000, dp: 1, note: 'Modelled on widely published 100-oz gold futures designs.' },
    MGC: { name: 'Micro gold futures (10 oz type)', commodity: 'gold', unit: 'USD/ozt', size: '10 troy oz', pointValue: 10, tick: 0.1, im: 1200, mm: 1100, fee: 0.8, spreadTicks: 2, slipTicks: 1, start: 2000, dp: 1, note: 'Smaller contract for position sizing practice.' },
    ZW: { name: 'Wheat futures (5,000 bu type)', commodity: 'wheat', unit: 'US cents/bu', size: '5,000 bushels', pointValue: 50, tick: 0.25, im: 2200, mm: 2000, fee: 2.5, spreadTicks: 1, slipTicks: 1, start: 600, dp: 2, note: '1 cent/bu = USD 50 per contract; tick 1/4 cent = USD 12.50.' },
    SB: { name: 'Raw sugar futures (112,000 lb type)', commodity: 'sugar', unit: 'US cents/lb', size: '112,000 lb', pointValue: 1120, tick: 0.01, im: 1700, mm: 1550, fee: 2.5, spreadTicks: 1, slipTicks: 1, start: 19.5, dp: 2, note: '1 cent/lb = USD 1,120 per contract; tick 0.01 = USD 11.20.' },
    SW: { name: 'White sugar futures (50 t type)', commodity: 'sugar', unit: 'USD/t', size: '50 metric tons', pointValue: 50, tick: 0.1, im: 2000, mm: 1800, fee: 2.5, spreadTicks: 2, slipTicks: 1, start: 540, dp: 1, note: 'Tick 0.10 = USD 5.' },
    HRC: { name: 'Hot-rolled coil futures (20 short ton type)', commodity: 'steel', unit: 'USD/short ton', size: '20 short tons', pointValue: 20, tick: 1, im: 2600, mm: 2350, fee: 3, spreadTicks: 2, slipTicks: 1, start: 800, dp: 0, note: 'Regional benchmark; lower liquidity than gold. Large basis risk for other regions/products.' },
  };
  M.specs = () => {
    const o = CTA.clone(M.SPECS_DEFAULT);
    const ov = (CTA.state.settings.specs || {});
    Object.keys(ov).forEach((k) => { if (o[k]) Object.assign(o[k], ov[k]); });
    return o;
  };

  /* annualised drift/vol defaults used by the market board and datasets */
  M.PROFILE = {
    gold: { label: 'Gold', vol: 0.15, color: '#b8901f' }, wheat: { label: 'Wheat', vol: 0.3, color: '#c98a1d' },
    sugar: { label: 'Raw sugar', vol: 0.28, color: '#8a7f6e' }, steel: { label: 'HRC steel', vol: 0.25, color: '#5d7189' },
  };

  /* ------------------------------------------------ simulated market board (changes daily, deterministic per day) */
  M.board = function () {
    const day = Math.floor(Date.now() / 86400000);
    const items = [
      ['Gold spot', 'USD/ozt', 2000, 0.15, 1, 'gold'], ['Wheat futures', 'c/bu', 600, 0.30, 2, 'wheat'], ['Milling wheat FOB (Black Sea-type)', 'USD/t', 235, 0.25, 3, 'wheat'],
      ['Raw sugar futures', 'c/lb', 19.5, 0.28, 4, 'sugar'], ['White sugar futures', 'USD/t', 540, 0.24, 5, 'sugar'], ['HRC (regional benchmark-type)', 'USD/t', 640, 0.25, 6, 'steel'],
      ['Rebar export (FOB-type)', 'USD/t', 560, 0.22, 7, 'steel'], ['Iron ore 62% Fe-type', 'USD/t', 110, 0.32, 8, 'steel'], ['Supramax freight index-type', 'USD/day', 14000, 0.55, 9, 'freight'], ['EUR/USD', 'rate', 1.08, 0.08, 10, 'fx'],
    ];
    return items.map(([name, unit, start, vol, seed, com]) => {
      const path = C.simulateOHLC({ start, days: 60, vol, seed: day * 31 + seed * 7, drift: 0 }).map((d) => d.c);
      const last = path[path.length - 1], prev = path[path.length - 2];
      return { name, unit, com, last, chg: (last / prev - 1) * 100, hist: path };
    });
  };

  /* ------------------------------------------------ correlated datasets for the quant lab (500 trading days) */
  M.dataset = function (seed) {
    const r = C.rng(seed || 2024);
    const names = ['gold', 'wheat', 'sugar', 'steel'], start = [2000, 220, 430, 640], vol = [0.15, 0.3, 0.28, 0.25], mu = [0.04, 0.02, 0.0, 0.01];
    const corr = [[1, 0.12, 0.10, 0.08], [0.12, 1, 0.30, 0.15], [0.10, 0.30, 1, 0.12], [0.08, 0.15, 0.12, 1]];
    // Cholesky
    const n = 4, L = Array.from({ length: n }, () => new Array(n).fill(0));
    for (let i = 0; i < n; i++) for (let j = 0; j <= i; j++) { let s = 0; for (let k = 0; k < j; k++) s += L[i][k] * L[j][k]; L[i][j] = i === j ? Math.sqrt(corr[i][i] - s) : (corr[i][j] - s) / L[j][j]; }
    const dt = 1 / 252, days = 500, out = {}; names.forEach((nm, i) => { out[nm] = [start[i]]; });
    for (let t = 1; t < days; t++) {
      const z = names.map(() => r.normal()), e = names.map((_, i) => L[i].reduce((s, l, k) => s + l * z[k], 0));
      // occasional jumps (supply shocks) for agricultural series
      names.forEach((nm, i) => {
        let jump = 0; if ((nm === 'wheat' || nm === 'sugar') && r() < 0.006) jump = (r() < 0.6 ? 1 : -1) * r.range(0.04, 0.09);
        const p = out[nm][t - 1] * Math.exp((mu[i] - 0.5 * vol[i] * vol[i]) * dt + vol[i] * Math.sqrt(dt) * e[i] + jump);
        out[nm].push(p);
      });
    }
    return { names, series: out, units: { gold: 'USD/ozt', wheat: 'USD/t', sugar: 'USD/t (raw)', steel: 'USD/t (HRC)' }, trueCorr: corr };
  };

  /* ------------------------------------------------ futures scenarios (documented rules) */
  M.SCENARIOS = [
    { id: 'gold-up', title: 'Rising gold — falling real yields', inst: 'GC', days: 60, drift: 0.05, vol: 0.14, iv: 0.16, seed: 11, objective: 'Trade a trend driven by macro news; practise position sizing and trailing stops.',
      events: [{ day: 8, drift: 0.35, news: 'Inflation data surprise to the downside; markets price earlier rate cuts. Real yields fall.' }, { day: 22, jumpPct: 1.2, news: 'Central bank purchases reported higher than expected (simulated report).' }, { day: 40, drift: 0.1, vol: 0.18, news: 'Profit-taking as positioning becomes crowded; volatility rises.' }],
      debrief: 'Model rule: drift switches from +5% to +35% p.a. on day 8 then slows to +10% with higher vol on day 40. A trend-following long sized at 1% risk would have gained; adding late into the crowded phase increased drawdown risk.' },
    { id: 'gold-down', title: 'Falling gold — strong USD, hawkish policy', inst: 'GC', days: 60, drift: 0, vol: 0.15, iv: 0.17, seed: 23, objective: 'Recognise a regime change and manage a long position that goes wrong; consider shorts.',
      events: [{ day: 5, drift: -0.3, news: 'Central bank signals higher-for-longer rates; USD index rallies.' }, { day: 18, jumpPct: -1.8, news: 'Strong employment report; real yields jump.' }, { day: 35, drift: -0.05, news: 'Physical buying emerges in Asia at lower prices (simulated).' }],
      debrief: 'Model rule: drift −30% p.a. from day 5 with a −1.8% jump on day 18, then stabilises. Longs without stops suffered; shorts profited until physical demand slowed the decline.' },
    { id: 'wheat-shock', title: 'Wheat supply shock — drought in a major exporter', inst: 'ZW', days: 50, drift: 0, vol: 0.25, iv: 0.3, seed: 37, objective: 'Handle a gap and a volatility spike; see how options behave.',
      events: [{ day: 6, news: 'Weather models show prolonged dryness in a key exporter during grain fill.' }, { day: 12, jumpPct: 7, vol: 0.45, drift: 0.4, news: 'Government cuts crop estimate sharply; talk of export quotas.' }, { day: 30, jumpPct: -4, drift: -0.2, vol: 0.35, news: 'Rains arrive; export quota announced smaller than feared.' }],
      debrief: 'Model rule: +7% gap on day 12 with vol rising to 45%, then a −4% reversal on day 30. Shorts were hurt by the gap (stops slipped); long calls bought before day 12 benefited from both price and implied volatility.' },
    { id: 'sugar-surprise', title: 'Sugar production surprise — higher sugar mix', inst: 'SB', days: 50, drift: 0.02, vol: 0.26, iv: 0.28, seed: 41, objective: 'Interpret a fundamental report and trade it with defined risk.',
      events: [{ day: 10, jumpPct: -5, drift: -0.25, news: 'Industry data show mills maximising sugar over ethanol: sugar mix well above expectations.' }, { day: 28, drift: 0.05, news: 'Ethanol prices rise with gasoline; some mills may shift back toward ethanol.' }],
      debrief: 'Model rule: −5% jump on day 10 and negative drift until day 28. A pre-report position was a gamble; trading after the report with stops was more disciplined.' },
    { id: 'steel-demand', title: 'Steel demand change — infrastructure stimulus then destocking', inst: 'HRC', days: 60, drift: 0, vol: 0.22, iv: 0.25, seed: 53, objective: 'Experience a lower-liquidity contract with wider spreads and a demand cycle.',
      events: [{ day: 7, drift: 0.45, news: 'Large infrastructure programme announced; distributors restock.' }, { day: 30, drift: -0.35, vol: 0.28, news: 'Mills restart idle capacity; imports increase; distributors destock.' }],
      debrief: 'Model rule: drift +45% p.a. from day 7, reversing to −35% from day 30. Demand-driven rallies can reverse when supply responds. Wider spreads/slippage raise trading costs.' },
    { id: 'freight-spike', title: 'Unexpected freight cost increase', inst: 'ZW', days: 45, drift: 0, vol: 0.22, iv: 0.26, seed: 61, objective: 'Understand that higher freight can pressure exporters\' FOB/futures prices while raising importers\' CFR costs.',
      events: [{ day: 9, jumpPct: -2.5, drift: -0.15, news: 'Dry-bulk freight jumps 40% after a canal restriction; delivered prices to importers rise and demand for exporter FOB wheat weakens.' }, { day: 27, drift: 0.05, news: 'Freight normalises partially as vessels reposition.' }],
      debrief: 'Model rule: −2.5% jump and negative drift on day 9. For an exporter-referenced futures, freight spikes can be bearish (FOB must fall to stay competitive) even though importers pay more delivered.' },
    { id: 'fx-move', title: 'Currency movement — producer currency weakens', inst: 'SB', days: 45, drift: 0, vol: 0.24, iv: 0.27, seed: 71, objective: 'See how a weaker exporter currency can pressure USD-denominated prices.',
      events: [{ day: 6, drift: -0.3, news: 'The main exporter\'s currency falls 8% vs USD; producers accelerate USD-priced sales.' }, { day: 25, drift: 0, news: 'Currency stabilises.' }],
      debrief: 'Model rule: drift −30% p.a. between day 6 and 25. A weaker producer currency raises local-currency returns and often increases selling pressure.' },
    { id: 'vol-spike', title: 'Sudden volatility', inst: 'GC', days: 40, drift: 0, vol: 0.12, iv: 0.14, seed: 83, objective: 'Manage stops and margin in a market that suddenly swings both ways.',
      events: [{ day: 10, vol: 0.45, jumpPct: -2.5, news: 'Market-wide liquidation: investors sell liquid assets including gold to meet margin calls.' }, { day: 13, jumpPct: 3, news: 'Policy intervention; gold rebounds sharply.' }, { day: 25, vol: 0.18, news: 'Volatility subsides.' }],
      debrief: 'Model rule: vol jumps from 12% to 45% on day 10 with −2.5% then +3% gaps. Tight stops were triggered at bad prices; oversized positions faced margin calls.' },
    { id: 'expiry', title: 'Contract expiration and roll', inst: 'ZW', days: 40, drift: 0, vol: 0.2, iv: 0.24, seed: 97, expiryDay: 22, rollSpread: 12, objective: 'Roll an expiring position into the next contract month before last trading day.',
      events: [{ day: 15, news: 'Reminder: front-month last trading day is day 22. Open positions not closed or rolled will be closed at settlement (delivery not supported in this simulator).' }, { day: 22, news: 'Front month expired. Trading continues in the next contract month (12 c/bu contango).' }],
      debrief: 'Rule: on day 22 the front contract expires; the next month trades 12 c/bu higher (contango). Longs that roll pay the spread; shorts that roll gain it. Unrolled positions were closed at the expiry settlement.' },
    { id: 'margin-call', title: 'Margin call stress', inst: 'SB', days: 40, drift: -0.1, vol: 0.32, iv: 0.33, seed: 109, startCash: 30000, preload: [{ side: 'long', qty: 12 }], objective: 'You inherit an over-leveraged long. Manage the margin call: deposit, reduce or close?',
      events: [{ day: 3, jumpPct: -3, drift: -0.4, news: 'Large export programme announced by a major producer; prices drop.' }, { day: 18, drift: 0.1, news: 'Selling exhausts; prices stabilise.' }],
      debrief: 'Rule: −3% jump on day 3 with −40% drift until day 18. With 12 contracts on 30,000 equity, leverage was ~90×; a margin call was almost certain. Depositing more only works if the original thesis is still valid and size is reduced.' },
  ];

  /* ------------------------------------------------ value chain explorer data */
  M.CHAIN = [
    ['Production', { gold: 'Open-pit/underground mines; artisanal mining in some regions; recycling of jewellery and electronics.', wheat: 'Farmers plant in autumn (winter wheat) or spring; yields depend on weather and inputs.', sugar: 'Cane in tropics (ratoon cycles), beet in temperate zones.', steel: 'Iron ore and coking coal mining; scrap collection.' }],
    ['Collection', { gold: 'Doré bars shipped from mines; scrap collected by dealers.', wheat: 'Country elevators receive, grade and pool grain from many farms.', sugar: 'Cane delivered to mills within hours of cutting.', steel: 'Ore railed to ports; scrap yards sort and process scrap.' }],
    ['Processing', { gold: 'Refiners produce 995–999.9 bars and grain.', wheat: 'Cleaning/drying at elevators; milling into flour at destination.', sugar: 'Mills make raw or plantation white; refineries make refined sugar.', steel: 'BF-BOF or EAF → semis → rolled long/flat products.' }],
    ['Storage', { gold: 'High-security vaults; allocated/unallocated accounts.', wheat: 'Silos, aeration, fumigation, segregation by quality.', sugar: 'Bulk warehouses (raw), bagged warehouses (white).', steel: 'Covered yards, mill/port stocks, distributor inventory.' }],
    ['Transportation', { gold: 'Secure air freight and armoured logistics.', wheat: 'Truck/rail/barge to port; bulk carriers.', sugar: 'Bulk carriers (raw); containers/breakbulk (white).', steel: 'Breakbulk, containers, bulk for semis/scrap.' }],
    ['Trading', { gold: 'Bullion banks and dealers, exchanges, refiners.', wheat: 'Merchants, state tenders, futures + basis pricing.', sugar: 'Merchants, refiners; futures + premium pricing.', steel: 'Mills, traders, distributors; assessed price benchmarks.' }],
    ['Financing', { gold: 'Gold leasing, consignment, secured lending.', wheat: 'Pre-export finance, LCs, inventory finance.', sugar: 'Pre-export finance, LCs, borrowing bases.', steel: 'LCs, receivable finance, distributor credit lines.' }],
    ['Delivery', { gold: 'Vault-to-vault transfers, DvP.', wheat: 'Discharge at destination port, outturn surveys.', sugar: 'Discharge, outturn weights and quality analyses.', steel: 'Discharge, inspection against specs and MTCs.' }],
    ['Final consumption', { gold: 'Jewellery, investment, central banks, technology.', wheat: 'Bread, noodles, pasta (durum), biscuits, feed.', sugar: 'Food & beverage, households, industry.', steel: 'Construction, machinery, automotive, appliances, energy.' }],
  ];

<script>
/* js/data/documents.js */
/* Virtual document library — FICTIONAL, EDUCATIONAL documents. They are not valid legal, banking,
 * customs or shipping documents. Formats and requirements vary by jurisdiction, bank, carrier,
 * commodity and contract. Each render(deal) produces an annotated sample from a deal object. */
(function () {
  const CTA = window.CTA, C = window.CALC;
  const esc = CTA.esc, f = (n, d = 2) => CTA.fmt.num(n, d);
  const D = (CTA.DOCS = []);

  /* default sample deal (fictional) — the physical simulator produces deals with the same shape */

    ref: 'MCL-WHT-0425', commodity: 'wheat', product: 'Milling wheat, origin Romania (fictional sample)', spec: 'Protein min 12.5% (dry basis), moisture max 13.5%, test weight min 78 kg/hl, falling number min 250 s, foreign matter max 2%',
    qty: 30000, tolerance: '±10% at Seller\'s option', unit: 't', price: 261, currency: 'USD', incoterm: 'CFR', namedPlace: 'Alexandria, Egypt', buyIncoterm: 'FOB', buyPrice: 235, buyPlace: 'Constanța, Romania',
    seller: { name: 'Danubia Grain SRL', addr: '12 Fictional Quay, Constanța, Romania' }, trader: { name: 'Meridian Commodities Ltd', addr: '1 Sample Street, Geneva, Switzerland' }, buyer: { name: 'Nile Valley Milling Co.', addr: '45 Example Road, Alexandria, Egypt' },
    loadPort: 'Constanța, Romania', dischPort: 'Alexandria, Egypt', vessel: 'MV Sample Star', voyage: '0425', blNo: 'SSTR-CTA-0425', blDate: '2026-04-18', shipment: '10–25 April 2026', contractNo: 'MCL/S/2026/041', purchaseNo: 'MCL/P/2026/037',
    lcNo: 'LC-FFB-778812', issuingBank: 'First Fictional Bank, Alexandria', advisingBank: 'Harbour Trust Bank (fictional), Geneva', lcExpiry: '2026-05-20', payment: 'Irrevocable LC at sight, subject to UCP 600, confirmed by Harbour Trust Bank',
    inspector: 'Example Survey & Inspection SA (fictional)', insurer: 'Sample Marine Insurance Co. (fictional)', hs: '1001.99', packing: 'In bulk', marks: 'N/M (bulk)', freight: 26, insurancePct: 0.1, origin: 'Romania',
    actualQty: 30480, grossNet: 'Net', invoiceNo: 'MCL-INV-0425', date: '2026-04-19',
  };

  const hot = (n, v) => `<span class="hot" data-n="${n}" tabindex="0">${v}<sup>${n}</sup></span>`;
  const wm = '<div class="wm">FICTIONAL · EDUCATIONAL</div>';
  const head = (title, d, extra) => `${wm}<h3>${title}</h3><div class="row between" style="font-size:.84rem"><span>Ref: ${esc(d.ref)}</span><span>Date: ${esc(d.date)}</span>${extra || ''}</div>`;
  const kvt = (rows) => `<table>${rows.map(([k, v]) => `<tr><th style="width:34%">${k}</th><td>${v}</td></tr>`).join('')}</table>`;
  const val = (d) => d.actualQty * d.price;
  const doc = (o) => D.push(o);

  doc({ id: 'inquiry', name: 'Buyer inquiry', stage: 'Pre-contract', purpose: 'States what the buyer needs so sellers/traders can offer.', preparer: 'Buyer', receiver: 'Traders / suppliers', when: 'Start of the deal (step 1).',
    consistency: ['Request for quotation', 'Commercial offer'], mistakes: ['Vague quality spec', 'No delivery term or window', 'No payment method', 'Unverified buyer identity (fake inquiries are common)'],
    notes: ['Identify the buyer fully for KYC.', 'Quantity with tolerance and who has the option.', 'Full quality spec — what will be tested and where.', 'Delivery term with named place and Incoterms edition.', 'Shipment window drives logistics.', 'Payment method tells you the credit risk.'],
    render: (d) => `${head('Purchase Inquiry', d)}<p>From: ${hot(1, esc(d.buyer.name) + ', ' + esc(d.buyer.addr))}<br>To: ${esc(d.trader.name)}</p>${kvt([['Product', esc(d.product)], ['Quantity', hot(2, f(d.qty, 0) + ' ' + d.unit + ' ' + esc(d.tolerance))], ['Specification', hot(3, esc(d.spec))], ['Delivery', hot(4, esc(d.incoterm) + ' ' + esc(d.namedPlace) + ', Incoterms® 2020')], ['Shipment', hot(5, esc(d.shipment))], ['Payment', hot(6, esc(d.payment))]])}<p>Please send your best offer valid for 24 hours.</p>` });
  doc({ id: 'rfq', name: 'Request for quotation', stage: 'Pre-contract', purpose: 'Trader asks suppliers to quote on comparable terms.', preparer: 'Trader', receiver: 'Suppliers', when: 'Step 5.',
    consistency: ['Buyer inquiry (specs mirrored)', 'Supplier quotation'], mistakes: ['Asking different suppliers on different terms (offers not comparable)', 'Revealing the end buyer unnecessarily', 'Omitting inspection and document requirements'],
    notes: ['Ask all suppliers for the same basis (here FOB) to compare.', 'Specs mirror the buyer\'s needs plus a safety margin.', 'Validity time limits your price risk.', 'Documents the buyer/LC will require must be listed now.'],
    render: (d) => `${head('Request for Quotation', d)}<p>To: ${esc(d.seller.name)} &nbsp; From: ${esc(d.trader.name)}</p>${kvt([['Product & quantity', esc(d.product) + ', ' + f(d.qty, 0) + ' ' + d.unit + ' ' + esc(d.tolerance)], ['Basis', hot(1, esc(d.buyIncoterm) + ' ' + esc(d.buyPlace))], ['Specification', hot(2, esc(d.spec))], ['Offer validity requested', hot(3, '4 hours from receipt')], ['Documents', hot(4, 'Commercial invoice, B/L, quality/weight certificates by independent surveyor, certificate of origin, phytosanitary certificate')]])}` });
  doc({ id: 'quotation', name: 'Supplier quotation', stage: 'Pre-contract', purpose: 'Supplier\'s firm or indicative price and terms.', preparer: 'Supplier', receiver: 'Trader', when: 'Step 5–6.',
    consistency: ['RFQ', 'Comparative quotation sheet', 'Purchase contract'], mistakes: ['Treating "indicative" as firm', 'Ignoring the validity time', 'Missing conditions (subject to vessel, subject to financing)'],
    notes: ['Firm vs indicative: only a firm offer can be accepted.', 'Price basis must match RFQ basis.', 'Payment requested by supplier — check risk.', 'Validity: after this the supplier may re-price.'],
    render: (d) => `${head('Quotation', d)}<p>From ${esc(d.seller.name)} to ${esc(d.trader.name)}</p>${kvt([['Offer type', hot(1, 'FIRM')], ['Price', hot(2, d.currency + ' ' + f(d.buyPrice) + ' per t ' + esc(d.buyIncoterm) + ' ' + esc(d.buyPlace))], ['Quantity', f(d.qty, 0) + ' t ' + esc(d.tolerance)], ['Shipment', esc(d.shipment)], ['Payment', hot(3, 'CAD at sight or LC at sight')], ['Validity', hot(4, 'Until 17:00 CET today')]])}` });
  doc({ id: 'comparison', name: 'Comparative quotation sheet', stage: 'Pre-contract', purpose: 'Normalises supplier offers to a delivered, risk-adjusted basis.', preparer: 'Trader', receiver: 'Internal (trading manager, risk)', when: 'Step 6.',
    consistency: ['Supplier quotations', 'Deal calculator'], mistakes: ['Comparing FOB with CFR', 'Ignoring quality differences and payment terms', 'Ignoring supplier reliability'],
    notes: ['All offers converted to the same delivery point.', 'Quality adjustment in money terms.', 'Risk adjustment = probability × expected cost.', 'Decision based on adjusted cost, not headline price.'],
    render: (d) => { const rows = [['Danubia Grain SRL', d.buyPrice, d.freight, 0, 0.8], ['Steppe Export LLC (fictional)', d.buyPrice - 6, d.freight + 3, 2, 6.5], ['Prairie Ports Inc. (fictional)', d.buyPrice + 9, d.freight - 7, 0, 0.5]];
      return `${head('Comparative Quotation Sheet', d)}<table><thead><tr><th>Supplier</th><th class="r">FOB</th><th class="r">${hot(1, 'Freight')}</th><th class="r">${hot(2, 'Quality adj.')}</th><th class="r">${hot(3, 'Risk adj.')}</th><th class="r">${hot(4, 'Adjusted CFR')}</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${r[0]}</td><td class="r">${f(r[1])}</td><td class="r">${f(r[2])}</td><td class="r">${f(r[3])}</td><td class="r">${f(r[4])}</td><td class="r"><b>${f(r[1] + r[2] + r[3] + r[4])}</b></td></tr>`).join('')}</tbody></table>`; } });
  doc({ id: 'offer', name: 'Commercial offer', stage: 'Pre-contract', purpose: 'Trader\'s offer to the buyer.', preparer: 'Trader', receiver: 'Buyer', when: 'Step 9–13.',
    consistency: ['Buyer inquiry', 'Sales contract'], mistakes: ['Offering before securing supply', 'Missing validity', 'Terms that do not match the purchase side (back-to-back gaps)'],
    notes: ['Offer must be on the buyer\'s requested basis.', 'Price includes your margin over landed cost — check break-even.', 'Conditions protect you (e.g. subject to LC opening by a date).'],
    render: (d) => `${head('Commercial Offer', d)}<p>${esc(d.trader.name)} offers to ${esc(d.buyer.name)}:</p>${kvt([['Goods', esc(d.product)], ['Quantity', f(d.qty, 0) + ' t ' + esc(d.tolerance)], ['Price', hot(1, d.currency + ' ' + f(d.price) + ' per t ' + esc(d.incoterm) + ' ' + esc(d.namedPlace) + ' Incoterms® 2020')], ['Margin check', hot(2, 'Internal: landed cost and break-even calculated before quoting')], ['Conditions', hot(3, 'Subject to workable LC being opened within 5 banking days of contract; offer valid 24 h')]])}` });
  doc({ id: 'po', name: 'Purchase order', stage: 'Contract', purpose: 'Buyer\'s formal order (common in steel/distribution; bulk trades usually use full contracts).', preparer: 'Buyer', receiver: 'Seller', when: 'After agreement.',
    consistency: ['Offer', 'Sales contract', 'Pro forma invoice'], mistakes: ['PO terms conflicting with the contract (battle of the forms)', 'Missing specs/standard'],
    notes: ['Reference the agreed contract to avoid conflicting terms.', 'Delivery schedule for project buyers.'],
    render: (d) => `${head('Purchase Order', d)}${kvt([['Buyer', esc(d.buyer.name)], ['Seller', esc(d.trader.name)], ['Goods', esc(d.product)], ['Quantity', f(d.qty, 0) + ' t'], ['Price', d.currency + ' ' + f(d.price) + ' ' + esc(d.incoterm)], ['Governing terms', hot(1, 'As per Sales Contract ' + esc(d.contractNo) + '; in case of conflict the contract prevails')], ['Delivery schedule', hot(2, esc(d.shipment))]])}` });
  const contract = (side) => (d) => { const s = side === 'sale'; const sel = s ? d.trader : d.seller, buy = s ? d.buyer : d.trader;
    return `${head(s ? 'Sales Contract' : 'Purchase Contract', d, `<span>No. ${esc(s ? d.contractNo : d.purchaseNo)}</span>`)}${kvt([['Seller', esc(sel.name) + ', ' + esc(sel.addr)], ['Buyer', esc(buy.name) + ', ' + esc(buy.addr)], ['Goods', esc(d.product)], ['Quality', hot(1, esc(d.spec) + '. Quality & weight final at loading as per certificates of ' + esc(d.inspector))], ['Quantity', hot(2, f(d.qty, 0) + ' t ' + esc(d.tolerance))], ['Price', hot(3, d.currency + ' ' + f(s ? d.price : d.buyPrice) + ' per t ' + esc(s ? d.incoterm + ' ' + d.namedPlace : d.buyIncoterm + ' ' + d.buyPlace) + ', Incoterms® 2020')], ['Shipment', esc(d.shipment)], ['Laytime/demurrage', hot(4, s ? 'Discharge 6,000 t per WWD SHEX; demurrage as per charter party, max USD 15,000/day' : 'Load 8,000 t per WWD SHEX; demurrage/despatch as per charter party')], ['Payment', hot(5, s ? esc(d.payment) : 'Cash against documents at sight')], ['Documents', 'Invoice, full set clean on board B/L, quality & weight certificates, certificate of origin, phytosanitary certificate' + (s ? ', insurance not required (CFR)' : '')], ['Force majeure', 'Standard trade-association clause'], ['Law & disputes', hot(6, 'English law; arbitration under the rules of an agreed trade association (illustrative)')]])}`; };
  doc({ id: 'purchase-contract', name: 'Purchase contract', stage: 'Contract', purpose: 'Binding agreement with the supplier.', preparer: 'Trader / seller (negotiated)', receiver: 'Both parties', when: 'Step 15.',
    consistency: ['Sales contract (back-to-back)', 'Quotation', 'LC terms on the sale side'], mistakes: ['Tolerance or inspection terms different from the sale', 'Laytime terms not matching the charter', 'Different law/arbitration from the sale'],
    notes: ['Final-at-loading quality protects the seller; align with your sale.', 'Tolerance option must allow you to deliver within your sale tolerance.', 'Price basis FOB: you arrange freight.', 'Load-port laytime must match your charter party.', 'Your payment trigger vs. when you get paid → working capital.', 'Same law/forum on both sides simplifies chain disputes.'], render: contract('purchase') });
  doc({ id: 'sales-contract', name: 'Sales contract', stage: 'Contract', purpose: 'Binding agreement with the buyer.', preparer: 'Trader / buyer (negotiated)', receiver: 'Both parties', when: 'Step 14.',

  doc({ id: 'proforma', name: 'Pro forma invoice', stage: 'Pre-shipment', purpose: 'Preliminary invoice for LC application, import licence or advance payment.', preparer: 'Seller', receiver: 'Buyer (and its bank/authorities)', when: 'After contract, before shipment.',

  doc({ id: 'invoice', name: 'Commercial invoice', stage: 'Shipping & payment', purpose: 'Final demand for payment; customs valuation document.', preparer: 'Seller', receiver: 'Buyer (via banks under LC/CAD)', when: 'After loading (step 19).',

    render: (d) => `${head('Commercial Invoice', d, `<span>No. ${esc(d.invoiceNo)}</span>`)}<p>${hot(1, 'Seller: ' + esc(d.trader.name) + ' — Buyer: ' + esc(d.buyer.name))}</p><table><thead><tr><th>Description</th><th class="r">Quantity</th><th class="r">Unit price</th><th class="r">Amount</th></tr></thead><tbody><tr><td>${hot(2, esc(d.product))}<br><small>${esc(d.incoterm)} ${esc(d.namedPlace)} Incoterms® 2020 · LC ${esc(d.lcNo)}</small></td><td class="r">${hot(3, f(d.actualQty, 3) + ' t')}</td><td class="r">${d.currency} ${f(d.price)}</td><td class="r">${hot(4, d.currency + ' ' + f(val(d)))}</td></tr></tbody></table><p>${hot(5, 'Shipped per ' + esc(d.vessel) + ', B/L ' + esc(d.blNo) + ' dated ' + esc(d.blDate))}</p>` });

/* My Learning Path — roadmap, lesson reader with mastery checks, and the interactive tools embedded in lessons. */

  const CTA = window.CTA, C = window.CALC, fmt = CTA.fmt, esc = CTA.esc, P = () => CTA.progress;
  const f = (n, d = 2) => fmt.num(n, d);

  /* ------------------------------------------------ reusable calculator widget */
  CTA.ui.calcWidget = function (el, o) {
    const uid = 'cw' + Math.random().toString(36).slice(2, 7);
    el.innerHTML = `<div class="card soft"><div class="card-h"><h4 style="margin:0">${o.title}</h4>${o.tag || CTA.SIM}</div>${o.intro ? `<p class="muted" style="font-size:.88rem">${o.intro}</p>` : ''}
      <div class="form">${o.fields.map((fd) => CTA.ui.field(Object.assign({}, fd, { id: uid + '-' + fd.id, name: fd.id }))).join('')}</div><div class="cw-out" style="margin-top:12px"></div></div>`;
    const out = CTA.$('.cw-out', el);
    const run = () => { const v = CTA.ui.read(el); try { out.innerHTML = o.compute(v, out); if (o.after) o.after(v, out); } catch (e) { out.innerHTML = `<div class="note bad"><strong>Check the inputs</strong>${esc(e.message)}</div>`; } };
    el.addEventListener('input', run); el.addEventListener('change', run); run();
  };
  const rows = (pairs) => `<table><tbody>${pairs.map(([k, v, cls]) => `<tr class="${cls || ''}"><td>${k}</td><td class="r num">${v}</td></tr>`).join('')}</tbody></table>`;

  /* ------------------------------------------------ roadmap */
  function roadmap(el) {
    const p = P();
    el.innerHTML = `${CTA.pageHead('My Learning Path', 'Mastery-based progression: a lesson is complete only when you pass its check quiz (≥ 70%). Each stage unlocks the next. You can always review mastered lessons and repeat quizzes.', '', `<span class="badge info">Overall ${fmt.pct(p.overall(), 0)}</span>`)}
      ${CTA.state.settings.freeNav ? '<div class="note warn"><strong>Free navigation is ON</strong>All stages are open (Settings). Mastery is still recorded.</div>' : ''}
      ${CTA.STAGES.map((s, i) => { const ss = p.stageStatus(i), un = p.stageUnlocked(i);
        return `<div class="stage ${ss.mastered ? 'done' : un ? '' : 'locked'}"><div class="stage-h"><div class="stage-n">${s.n}</div><div style="flex:1;min-width:220px"><b>${esc(s.title)}</b><div class="muted" style="font-size:.86rem">${esc(s.desc)}</div></div><div style="width:160px">${CTA.ui.pbar(ss.pct)}<div class="muted" style="font-size:.78rem">${ss.done}/${ss.total} complete${ss.mastered ? ' · mastered' : un ? '' : ' · locked until stage ' + i + ' is mastered'}</div></div></div>

          ${(ss.acts || []).map(({ a, ok }) => `<a class="lesson-row ${ok ? 'done' : ''} ${un ? '' : 'locked'}" href="#/${a.go}"><span class="st">${ok ? '✓' : ''}</span><span>${esc(a.label)}</span><span class="meta">activity</span></a>`).join('')}</div>`; }).join('')}`;

  /* ------------------------------------------------ lesson reader */
  function lesson(el, id) {
    const l = CTA.L_INDEX[id];
    if (!l) { el.innerHTML = CTA.ui.empty('Lesson not found', 'This lesson does not exist.', '<a class="btn" href="#/path">Back to the path</a>'); return; }

      ${t ? `<h4 style="margin-top:10px">${t.code} — ${esc(t.name)} <span class="badge ${t.sea ? 'warn' : 'info'}">${t.sea ? 'Sea & inland waterway only' : 'Any mode'}</span></h4>${CTA.table(['Item', 'Allocation'], [['Delivery / risk transfer', t.risk], ['Main carriage paid by', t.carriage], ['Insurance', t.insurance], ['Export clearance', t.exp], ['Import clearance & duties', t.imp], ['Commodity notes', t.note]])}<a class="btn sm" href="#/finance/incoterms">Full comparison tool →</a>` : ''}</div>`;
      CTA.$$('[data-c]', el).forEach((b) => { b.onclick = () => { cur = b.dataset.c; draw(); }; }); };
    draw();
  };

  W.laytimeMini = (el) => CTA.ui.calcWidget(el, { title: 'Laytime, demurrage and despatch', fields: [{ id: 'q', label: 'Cargo (t)', value: 30000 }, { id: 'rate', label: 'Rate (t per day)', value: 6000 }, { id: 'used', label: 'Time used (days)', value: 7.25 }, { id: 'dem', label: 'Demurrage (USD/day)', value: 15000 }, { id: 'des', label: 'Despatch (USD/day)', value: 7500 }],
    compute: (v) => { const r = C.laytime({ qty: v.q, rateTPerDay: v.rate, timeUsedDays: v.used, demurragePerDay: v.dem, despatchPerDay: v.des });
      return rows([['Laytime allowed', f(r.allowed, 3) + ' days'], ['Time used − allowed', f(r.diff, 3) + ' days'], ['Demurrage due to owner', `<b class="${r.demurrage ? 'neg' : ''}">USD ${f(r.demurrage)}</b>`], ['Despatch due from owner', `<b class="${r.despatch ? 'pos' : ''}">USD ${f(r.despatch)}</b>`]]) + '<p class="muted" style="font-size:.84rem">Simplified: no laytime exceptions (weekends, weather, shifting) and no notice time. Real laytime statements apply the charter party clauses.</p>'; } });

  W.specTable = (el) => { const S = CTA.MARKET.specs();
    el.innerHTML = `${CTA.table(['Code', 'Contract', 'Quote unit', 'Size', 'Tick', 'Tick value (USD)', 'Initial / maint. margin (USD)', 'Note'], Object.entries(S).map(([k, s]) => [k, s.name, s.unit, s.size, s.tick, f(s.tick * s.pointValue), f(s.im, 0) + ' / ' + f(s.mm, 0), s.note]))}<p class="muted" style="font-size:.84rem">${CTA.ILLU} Illustrative values for training, editable in Settings. Margins are set by exchanges/brokers and change frequently.</p>`; };

  W.hedgeDemo = (el) => CTA.ui.calcWidget(el, { title: 'Hedge outcome with basis', fields: [{ id: 'q', label: 'Physical quantity (t)', value: 20000 }, { id: 's0', label: 'Cash price at start', value: 245 }, { id: 'f0', label: 'Futures at start (USD/t eq.)', value: 252 }, { id: 's1', label: 'Cash price at end', value: 223 }, { id: 'f1', label: 'Futures at end', value: 233 }, { id: 'hr', label: 'Hedge ratio', value: 1 }],
    compute: (v) => { const h = C.hedgeOutcome({ qty: v.q, spot0: v.s0, spot1: v.s1, fut0: v.f0, fut1: v.f1, hedgeRatio: v.hr });
      return rows([['Physical inventory P&L', `<span class="${fmt.cls(h.physical)}">${f(h.physical, 0)}</span>`], ['Short futures P&L', `<span class="${fmt.cls(h.futures)}">${f(h.futures, 0)}</span>`], ['Net hedged result', `<b class="${fmt.cls(h.net)}">${f(h.net, 0)}</b>`, 'total'], ['Basis start → end', f(h.basis0) + ' → ' + f(h.basis1) + ' (change ' + f(h.basisChange) + ')']]) + `<p class="muted" style="font-size:.85rem">With a 1:1 hedge the net result equals quantity × basis change. Unhedged, the loss would have been ${f(h.physical, 0)}.</p>`; } });

  W.optionPayoff = (el) => CTA.ui.calcWidget(el, { title: 'Option pricer (Black-76) and payoff at expiry', tag: CTA.ILLU, fields: [{ id: 'type', label: 'Type', type: 'select', value: 'call', options: ['call', 'put'] }, { id: 'side', label: 'Position', type: 'select', value: 'long', options: ['long', 'short'] }, { id: 'F', label: 'Futures price', value: 2000 }, { id: 'K', label: 'Strike', value: 2000 }, { id: 'days', label: 'Days to expiry', value: 60 }, { id: 'vol', label: 'Implied vol %', value: 16 }, { id: 'r', label: 'Interest rate %', value: 4 }],
    compute: (v, out) => { const o = C.black76(v.F, v.K, v.days / 365, v.r / 100, v.vol / 100, v.type); el._opt = { v, prem: o.price };
      return CTA.ui.kpis([{ label: 'Premium', value: f(o.price) }, { label: 'Intrinsic', value: f(o.intrinsic) }, { label: 'Time value', value: f(o.price - o.intrinsic) }, { label: 'Delta', value: f(o.delta, 3) }, { label: 'Gamma', value: f(o.gamma, 5) }, { label: 'Theta / day', value: f(o.theta, 3) }, { label: 'Vega / vol pt', value: f(o.vega, 3) }]) + `<div class="op-chart"></div><p class="muted" style="font-size:.84rem">Greeks shown for a long position. Break-even at expiry: ${v.type === 'call' ? f(v.K + o.price) : f(v.K - o.price)}.</p>`; },
    after: (v, out) => { const { prem } = el._opt; const xs = []; for (let i = 0; i <= 60; i++) xs.push(v.F * (0.8 + 0.4 * i / 60)); CTA.chart(CTA.$('.op-chart', out), { height: 200, zero: true, labels: xs.map((x) => f(x, 0)), series: [{ data: xs.map((x) => C.optionPayoff(v.type, v.side, v.K, prem, x)), label: 'P&L at expiry per unit', color: 'var(--c1)' }, { data: xs.map((x) => (v.side === 'long' ? 1 : -1) * (C.black76(x, v.K, v.days / 365, v.r / 100, v.vol / 100, v.type).price - prem)), label: 'Value today − premium', color: 'var(--c2)', dash: '5 4' }] }); } });

  W.carryCalc = (el) => CTA.ui.calcWidget(el, { title: 'Cost of carry and cash-and-carry check', fields: [{ id: 's', label: 'Spot (/t)', value: 230 }, { id: 'fwd', label: 'Deferred futures/forward (/t)', value: 241 }, { id: 'm', label: 'Months', value: 3 }, { id: 'st', label: 'Storage (/t/month)', value: 2.2 }, { id: 'r', label: 'Financing % p.a.', value: 7 }, { id: 'ins', label: 'Insurance % p.a.', value: 0.15 }],
    compute: (v) => { const carry = v.st * v.m + v.s * v.r / 100 * v.m * 30 / 360 + v.s * v.ins / 100 * v.m / 12; const spread = v.fwd - v.s;
      return rows([['Market spread (deferred − spot)', f(spread)], ['Full carry cost', f(carry)], ['Cash-and-carry result per t', `<b class="${fmt.cls(spread - carry)}">${f(spread - carry)}</b>`], ['Spread as % of full carry', fmt.pct(spread / carry * 100, 0)]]) + `<p class="muted" style="font-size:.84rem">${spread > carry ? 'Spread exceeds full carry: storing and selling forward pays (if storage and financing are actually available).' : spread < 0 ? 'Inverted (backwardation): the market pays you to sell stock now.' : 'Below full carry: storing does not pay unless you need the stock.'}</p>`; } });
})();

</script>
<script>
/* js/views/commodity.js */
/* Commodity masterclasses (Gold, Wheat, Sugar, Steel), the case player and the Commodity Encyclopedia. */
(function () {
  const CTA = window.CTA, C = window.CALC, fmt = CTA.fmt, esc = CTA.esc;
  const f = (n, d = 2) => fmt.num(n, d);

  const PROFILE = {
    gold: { name: 'Gold', sub: 'Precious metal · financial & physical', units: 'Troy ounce (31.1034768 g); fineness ‰; karat', bench: 'OTC spot (T+2), LBMA Gold Price auction, exchange futures (e.g. 100-oz contracts)', trade: 'Bars (Good Delivery ~400 oz, kilobars), coins; secure air freight; vaults', drivers: 'Real rates, USD, central banks, investment flows, jewellery demand, risk sentiment', instruments: 'Physical (allocated/unallocated), ETFs, futures, options, forwards, leases', risks: 'Fraud/AML, settlement, custody, price', lessons: ['g-basics', 'g-instruments', 'g-drivers', 'p-gold'], tools: ['goldCalc', 'goldDrivers', 'optionPayoff'] },
    wheat: { name: 'Wheat', sub: 'Agricultural · food grain', units: 'Metric ton; bushel (60 lb = 27.216 kg) for some futures; % protein, moisture; kg/hl', bench: 'Exchange futures (5,000-bu contracts and others), export FOB assessments, tender prices', trade: 'Bulk carriers from export terminals; state tenders; GAFTA-type contracts', drivers: 'Weather, crop conditions, stocks-to-use, export policy, freight, FX, feed-grain substitution', instruments: 'Physical forwards, futures, options, basis contracts', risks: 'Quality, weather, policy, basis, logistics', lessons: ['w-basics', 'w-markets', 'p-wheat'], tools: ['wheatQuality', 'sdBalance', 'hedgeDemo'] },
    sugar: { name: 'Sugar', sub: 'Agricultural · soft commodity', units: 'c/lb (raw futures), USD/t (white), polarisation °Z, ICUMSA colour', bench: 'Raw sugar futures (112,000 lb type), white sugar futures (50 t type), physical premiums', trade: 'Raw in bulk to refineries; white bagged/containers/bulk', drivers: 'Weather/monsoon, cane crush & sugar mix, ethanol & energy, BRL/INR, policy, white premium', instruments: 'Physical, futures, options, premium/discount pricing', risks: 'Policy, weather, quality/packaging, basis', lessons: ['s-basics', 's-markets', 'p-sugar'], tools: ['sugarConvert', 'offerCompare', 'carryCalc'] },
    steel: { name: 'Steel', sub: 'Industrial · non-uniform products', units: 'Metric ton (some benchmarks in short tons), mm dimensions, MPa grades', bench: 'Price assessments (PRAs), some exchange contracts (e.g. HRC, rebar, scrap) — limited coverage', trade: 'Breakbulk, containers, bulk for scrap/ore; distributors', drivers: 'Construction & manufacturing demand, ore/coal/scrap/energy costs, capacity, trade remedies', instruments: 'Physical contracts, regional futures/swaps where available', risks: 'Specification, certification, trade policy, basis, credit', lessons: ['st-basics', 'st-specs', 'st-markets', 'p-steel'], tools: ['steelWeight', 'specBuilder', 'millMargin'] },
  };

  /* ------------------------------------------------ case player */
  CTA.ui.casePlayer = function (el, cs, opts) {
    opts = opts || {};
    const results = [];
    let i = 0;
    const draw = () => {
      el.innerHTML = `<div class="card"><div class="card-h"><h3>${esc(cs.title)}</h3><span class="badge t-${cs.commodity}">${cs.commodity}</span></div>
        <p>${esc(cs.context)}</p>${CTA.table(['Input', 'Value'], cs.data)}<div class="muted" style="font-size:.8rem">All figures ${CTA.SIM}</div>
        <div class="steps" style="margin-top:10px">${cs.steps.map((_, k) => `<span class="${k < i ? 'done' : k === i ? 'cur' : ''}"></span>`).join('')}</div>
        <div class="case-steps"></div></div>`;
      const host = CTA.$('.case-steps', el);
      cs.steps.forEach((s, k) => { if (k > i) return; const div = document.createElement('div'); div.className = 'card soft'; host.appendChild(div); renderStep(div, s, k); });
    };
    const finish = () => {
      const score = results.reduce((a, b) => a + b, 0) / results.length;
      CTA.record.caseResult(cs.id, score);
      CTA.log(`Case "${cs.title}" completed — ${Math.round(score)}%`, 'case');
      const box = document.createElement('div');
      box.innerHTML = `<div class="note ${score >= 70 ? 'ok' : 'warn'}"><strong>Case score: ${Math.round(score)}%</strong>${score >= 70 ? 'Well handled.' : 'Review the explanations; try the case again later.'}</div><div class="card"><h4>Detailed solution</h4><p>${CTA.rich(cs.solution)}</p><div class="row"><button class="btn" data-a="again">Try again</button>${opts.onClose ? '<button class="btn primary" data-a="close">Back to cases</button>' : ''}</div></div>`;
      CTA.$('.case-steps', el).appendChild(box);
      CTA.$('[data-a=again]', box).onclick = () => { results.length = 0; i = 0; draw(); };
      const cl = CTA.$('[data-a=close]', box); if (cl) cl.onclick = opts.onClose;
    };
    const advance = (score) => { results[i] = score; i++; if (i < cs.steps.length) { const host = CTA.$('.case-steps', el); const div = document.createElement('div'); div.className = 'card soft'; host.appendChild(div); renderStep(div, cs.steps[i], i); CTA.$$('.steps span', el).forEach((sp, k) => { sp.className = k < i ? 'done' : k === i ? 'cur' : ''; }); div.scrollIntoView({ behavior: 'smooth', block: 'center' }); } else finish(); };
    function renderStep(div, s, k) {
      if (s.type === 'num') {
        div.innerHTML = `<p><b>Step ${k + 1}.</b> ${esc(s.q)}</p><div class="row"><input type="text" inputmode="decimal" style="max-width:200px" aria-label="Answer"><span class="muted">${esc(s.unit || '')}</span><button class="btn primary sm">Check</button><button class="btn sm ghost" data-a="skip">Show solution</button></div><div class="fb"></div>`;
        const go = (skip) => { const raw = CTA.$('input', div).value; const v = CTA.num(raw, NaN); if (!skip && isNaN(v)) { CTA.toast('Enter a number.', 'warn'); return; }
          const ok = !skip && C.within(v, s.ans, s.tol); CTA.record.exercise(s.id, ok);
          CTA.$('.fb', div).innerHTML = `<div class="note ${ok ? 'ok' : 'bad'}"><strong>${ok ? 'Correct' : skip ? 'Solution' : 'Not correct'} — answer ${f(s.ans, s.dp == null ? 2 : s.dp)} ${esc(s.unit || '')}</strong><ol style="margin:4px 0 0">${s.work.map((w) => `<li>${esc(w)}</li>`).join('')}</ol></div>`;
          CTA.$$('button', div).forEach((b) => b.remove()); CTA.$('input', div).disabled = true; advance(ok ? 100 : 0); };
        CTA.$('.btn.primary', div).onclick = () => go(false); CTA.$('[data-a=skip]', div).onclick = () => go(true);
      } else {
        div.innerHTML = `<p><b>Step ${k + 1}. Decision.</b> ${esc(s.q)}</p>${CTA.shuffleIdx(s.opts.length).map((j) => `<label class="choice"><input type="radio" name="${s.id}" value="${j}"><span class="ch-t">${esc(s.opts[j][0])}</span></label>`).join('')}<button class="btn primary sm">Decide</button><div class="fb"></div>`;
        CTA.$$('.choice input', div).forEach((r) => r.addEventListener('change', () => CTA.$$('.choice', div).forEach((c) => c.classList.toggle('sel', CTA.$('input', c).checked))));
        CTA.$('.btn.primary', div).onclick = () => { const sel = CTA.$('input:checked', div); if (!sel) { CTA.toast('Choose an option.', 'warn'); return; } const j = +sel.value; const o = s.opts[j];
          CTA.$('.fb', div).innerHTML = `<div class="note ${o[1] >= 70 ? 'ok' : o[1] >= 40 ? 'warn' : 'bad'}"><strong>Your decision scores ${o[1]}/100</strong>${esc(o[2])}</div><details open><summary>How the alternatives compare</summary><ul>${s.opts.map((x, m) => `<li class="${m === j ? '' : 'muted'}"><b>${esc(x[0])}</b> — ${x[1]}/100: ${esc(x[2])}</li>`).join('')}</ul></details>`;
          CTA.$$('input', div).forEach((x) => { x.disabled = true; }); CTA.$('.btn.primary', div).remove(); advance(o[1]); };
      }
    }
    draw();
  };

  /* ------------------------------------------------ commodity page */
  function commodityPage(key) {
    return { title: PROFILE[key].name + ' Trading', accent: key, desc: PROFILE[key].name + ' masterclass: lessons, cases, tools.', render(el, r) {
      const pf = PROFILE[key], tab = r.parts[0] || 'overview';
      const cases = CTA.CASES.filter((c) => c.commodity === key);
      el.innerHTML = `${CTA.pageHead(pf.name + ' Trading Masterclass', pf.sub + '. Learn the product, the market, the physical trade and the financial instruments — then practise on ' + cases.length + ' cases and a full simulated deal.', key, `<a class="btn primary" href="#/physical/workflow?c=${key}">Run a ${pf.name.toLowerCase()} deal →</a>`)}
        ${CTA.tabs([['overview', 'Overview'], ['lessons', 'Lessons'], ['cases', `Practical cases (${cases.length})`], ['tools', 'Tools'], ['instruments', 'Instruments & specs']], tab, key)}<div id="cbody"></div>`;
      const body = CTA.$('#cbody', el);
      if (tab === 'overview') {
        const ls = pf.lessons.map((id) => CTA.L_INDEX[id]).filter(Boolean);
        const done = ls.filter((l) => CTA.progress.lessonDone(l.id)).length;
        const cs = cases.map((c) => CTA.state.cases[c.id]).filter(Boolean);
        body.innerHTML = `<div class="grid side"><div><div class="card"><h3>Market profile</h3><dl class="kv-list"><dt>Units</dt><dd>${esc(pf.units)}</dd><dt>Benchmarks</dt><dd>${esc(pf.bench)}</dd><dt>How it trades</dt><dd>${esc(pf.trade)}</dd><dt>Key drivers</dt><dd>${esc(pf.drivers)}</dd><dt>Instruments</dt><dd>${esc(pf.instruments)}</dd><dt>Distinctive risks</dt><dd>${esc(pf.risks)}</dd></dl></div>
          <div class="card"><h3>Physical vs financial in ${pf.name.toLowerCase()}</h3>${CTA.table(['', 'Physical trading', 'Financial trading'], [['What you do', 'Buy/sell actual ' + pf.name.toLowerCase() + ', arrange logistics, inspection, documents, finance', 'Take or hedge price exposure via futures, options, swaps or funds'], ['Profit source', 'Differentials, logistics optimisation, quality/form transformation', 'Price moves (speculation) or risk reduction (hedging)'], ['Main risks', esc(pf.risks), 'Price, leverage/margin, liquidity, basis vs the physical'], ['Where they meet', 'Physical traders hedge price with financial instruments and earn the basis', 'Futures converge to physical through delivery/arbitrage (where it exists)']])}</div></div>
          <div><div class="card"><h3>Your progress</h3>${CTA.ui.kpis([{ label: 'Lessons mastered', value: done + ' / ' + ls.length }, { label: 'Cases completed', value: cs.length + ' / ' + cases.length }, { label: 'Avg. case score', value: cs.length ? fmt.pct(cs.reduce((a, b) => a + b.best, 0) / cs.length, 0) : '—' }, { label: 'Deal simulated', value: CTA.progress.simDone(key) ? 'Yes' : 'Not yet', cls: CTA.progress.simDone(key) ? 'pos' : '' }])}
            <a class="btn" href="#/${key}/lessons">Lessons</a> <a class="btn" href="#/${key}/cases">Cases</a></div>
            <div class="card"><h3>Research sources</h3><ul>${CTA.MARKET.SOURCES.filter((s) => s.com.includes(key)).slice(0, 7).map((s) => `<li><a href="${s.url}" target="_blank" rel="noopener">${esc(s.name)}</a> <span class="muted" style="font-size:.8rem">— ${esc(s.type)}</span></li>`).join('')}</ul><a class="btn sm" href="#/global/research">All sources & how to use them</a></div></div></div>`;
      } else if (tab === 'lessons') {
        const ids = pf.lessons;
        body.innerHTML = ids.map((id) => { const l = CTA.L_INDEX[id]; if (!l) return ''; const d = CTA.progress.lessonDone(id), un = CTA.progress.lessonUnlocked(id);
          return `<a class="lesson-row ${d ? 'done' : ''} ${un ? '' : 'locked'}" href="#/path/lesson/${id}" style="background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:6px"><span class="st">${d ? '✓' : ''}</span><span><b>${esc(l.title)}</b><br><small>${esc(l.summary)}</small></span><span class="meta">Stage ${CTA.progress.stageOf(id) + 1} · ${l.mins} min${un ? '' : ' · 🔒'}</span></a>`; }).join('') +
          '<p class="muted" style="margin-top:10px">Shared disciplines that apply to this commodity — trade finance, Incoterms, logistics, hedging, analysis and risk — are in stages 5–8 of the learning path.</p>';
      } else if (tab === 'cases') {
        const id = r.parts[1];
        const cs = id && cases.find((c) => c.id === id);
        if (cs) { CTA.ui.casePlayer(body, cs, { onClose: () => CTA.go(key + '/cases') }); return; }
        body.innerHTML = `<p class="muted">Each case has numerical inputs, calculations, decisions and a detailed solution. Scores count toward Performance Analytics. Best score is kept.</p><div class="grid c2">${cases.map((c, k) => { const res = CTA.state.cases[c.id];
          return `<a class="card" style="text-decoration:none;color:inherit;margin:0" href="#/${key}/cases/${c.id}"><div class="row between"><b>${k + 1}. ${esc(c.title)}</b>${res ? `<span class="badge ${res.best >= 70 ? 'ok' : 'warn'}">best ${Math.round(res.best)}%</span>` : '<span class="badge">new</span>'}</div><p class="muted" style="margin:4px 0 0;font-size:.88rem">${esc(c.brief)}</p><small>${c.steps.length} steps · ${c.steps.filter((s) => s.type === 'num').length} calculations</small></a>`; }).join('')}</div>`;
      } else if (tab === 'tools') {
        body.innerHTML = pf.tools.map((w) => `<div data-widget="${w}" style="margin-bottom:14px"></div>`).join('');
      } else {
        const S = CTA.MARKET.specs(); const mine = Object.entries(S).filter(([, s]) => s.commodity === key);
        body.innerHTML = `<div class="card"><h3>Exchange-traded instruments in the simulator ${CTA.ILLU}</h3>${mine.length ? CTA.table(['Code', 'Contract', 'Quote', 'Size', 'Tick / value', 'Margin (IM/MM)'], mine.map(([k, s]) => [k, s.name, s.unit, s.size, s.tick + ' / USD ' + f(s.tick * s.pointValue), f(s.im, 0) + ' / ' + f(s.mm, 0)])) : '<p>No contract configured.</p>'}<p class="muted">Specs are illustrative and editable in Settings. Verify current specifications with the exchange.</p><a class="btn primary" href="#/futures/trade">Open the futures desk →</a></div>
          ${key === 'steel' ? CTA.callout('warn', 'Steel hedging', 'Steel hedging opportunities vary by product, region, benchmark and liquidity. A rebar buyer in one region hedging with an HRC contract from another region carries large basis risk.') : ''}
          <div class="card"><h3>Unit conversions for ${pf.name.toLowerCase()}</h3>${key === 'gold' ? CTA.table(['From', 'To'], [['1 troy oz', '31.1034768 g'], ['1 kg', f(C.convertMass(1, 'kg', 'ozt'), 4) + ' troy oz'], ['1 troy oz', f(C.convertMass(1, 'ozt', 'oz'), 5) + ' avoirdupois oz'], ['1 tola (South Asia, common definition)', '≈ 11.66 g — check contract definition']]) : key === 'wheat' ? CTA.table(['From', 'To'], [['1 t', f(C.convertMass(1, 't', 'bu_wheat'), 4) + ' bu'], ['1 bu', '27.2155 kg'], ['100 c/bu', 'USD ' + f(C.centsPerBuToUsdPerT(100)) + '/t'], ['5,000 bu contract', f(C.convertMass(5000, 'bu_wheat', 't'), 2) + ' t']]) : key === 'sugar' ? CTA.table(['From', 'To'], [['1 c/lb', 'USD ' + f(C.centsPerLbToUsdPerT(1), 4) + '/t'], ['112,000 lb contract', f(C.convertMass(112000, 'lb', 't'), 2) + ' t'], ['1 t', f(C.convertMass(1, 't', 'lb'), 2) + ' lb']]) : CTA.table(['From', 'To'], [['1 short ton', '0.90718 t'], ['USD 1/short ton', 'USD ' + f(C.usdPerStToUsdPerT(1), 5) + '/t'], ['1 long ton', '1.01605 t'], ['20 short ton contract', f(C.convertMass(20, 'st', 't'), 3) + ' t']])}</div>`;
      }
    } };
  }
  ['gold', 'wheat', 'sugar', 'steel'].forEach((k) => CTA.route(k, commodityPage(k)));

  /* ------------------------------------------------ encyclopedia */
  CTA.route('encyclopedia', { title: 'Commodity Encyclopedia', desc: 'Profiles, comparisons and unit conversion.', render(el) {
    el.innerHTML = `${CTA.pageHead('Commodity Encyclopedia', 'Reference profiles of the four core commodities, how they compare, and a universal unit converter.')}
      <div class="grid c4">${Object.entries(PROFILE).map(([k, p]) => `<a class="card" style="text-decoration:none;color:inherit;border-top:4px solid var(--${k})" href="#/${k}"><span class="badge t-${k}">${p.name}</span><p style="margin:6px 0"><b>${esc(p.sub)}</b></p><p class="muted" style="font-size:.86rem">${esc(p.drivers)}</p></a>`).join('')}</div>
      <div class="card"><h3>Side-by-side comparison</h3>${CTA.table(['Dimension', 'Gold', 'Wheat', 'Sugar', 'Steel'], [

    compute: (v) => { const r = C.convertMass(v.v, v.from, v.to); return `<p style="font-size:1.1rem"><b>${f(v.v, 4)} ${esc(C.UNIT_LABELS[v.from])} = ${f(r, 6)} ${esc(C.UNIT_LABELS[v.to])}</b></p>${v.price ? `<p>Price ${f(v.price, 4)} per ${esc(v.from)} = <b>${f(C.convertPricePerUnit(v.price, v.from, v.to), 4)} per ${esc(v.to)}</b></p>` : ''}<p class="muted" style="font-size:.84rem">Internally all masses convert through kilograms. Troy and avoirdupois ounces are different units; short (2,000 lb), long (2,240 lb) and metric tons (1,000 kg) differ.</p>`; } });

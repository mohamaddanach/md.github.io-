<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commodity Trading Academy</title>
<meta name="description" content="Interactive virtual training environment for physical and financial commodity trading: gold, wheat, sugar and steel. All data simulated for education.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Commodity Trading Academy — styles
 * Navy shell, charcoal trading workspaces, white/light-grey learning content.
 * Accents: gold, wheat amber, sugar neutral, steel blue-grey. Green = profit, red = loss/risk.
 */
:root {
  --navy: #0f2747; --navy-2: #163560; --navy-3: #1e4478; --navy-ink: #c9d6ea;
  --char: #1b2027; --char-2: #232a33; --char-3: #2e3742; --char-line: #3a4552; --char-ink: #dde4ee; --char-ink-2: #9aa7b8;
  --bg: #f2f4f8; --panel: #ffffff; --panel-2: #f7f8fb; --line: #dde2ea; --line-2: #e9edf3;
  --ink: #17202e; --ink-2: #47556b; --ink-3: #7a879b;
  --pos: #18884f; --pos-soft: #e3f4ea; --neg: #c93535; --neg-soft: #fbe7e7; --warn: #a76a00; --warn-soft: #fff4dc; --info: #1e5fae; --info-soft: #e8f0fb;
  --gold: #b8901f; --gold-soft: #f8f0d8; --wheat: #c98a1d; --wheat-soft: #fbf0dc; --sugar: #8a7f6e; --sugar-soft: #f3f0ea; --steel: #5d7189; --steel-soft: #e8edf3;
  --c1: #1e5fae; --c2: #c98a1d; --c3: #7a4fb0; --c4: #18884f; --c5: #c93535; --c6: #5d7189;
  --radius: 10px; --shadow: 0 1px 2px rgba(15, 39, 71, .06), 0 3px 12px rgba(15, 39, 71, .06);
  --font: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --side-w: 248px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; }
a { color: var(--info); }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5em; color: var(--ink); }
h1 { font-size: 1.55rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.06rem; } h4 { font-size: .98rem; }
p { margin: 0 0 .8em; }
ul, ol { margin: 0 0 .8em; padding-inline-start: 1.3em; }
li { margin-bottom: .25em; }
code, .mono { font-family: var(--mono); font-size: .9em; }
small, .muted { color: var(--ink-3); }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.pos { color: var(--pos) !important; } .neg { color: var(--neg) !important; }
hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

/* ---------------------------------------------------------------- shell */
#app { display: flex; min-height: 100vh; }
.sidebar { position: fixed; inset: 0 auto 0 0; width: var(--side-w); background: var(--navy); color: var(--navy-ink); display: flex; flex-direction: column; z-index: 40; transition: width .15s; }
.sidebar .logo { display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px; border-bottom: 1px solid rgba(255,255,255,.08); }
.sidebar .mark { flex: none; width: 38px; height: 38px; border-radius: 8px; background: linear-gradient(135deg, var(--gold), #e2c25a); color: var(--navy); font-weight: 800; display: grid; place-items: center; font-size: .82rem; letter-spacing: .04em; }
.sidebar .txt { font-size: .82rem; line-height: 1.2; color: #fff; }
.sidebar nav { flex: 1; overflow-y: auto; padding: 8px 8px 20px; }
.nav-gl { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: #8aa0c2; margin: 12px 10px 4px; }
.nav-link { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 7px; color: var(--navy-ink); text-decoration: none; font-size: .9rem; border-left: 3px solid transparent; }
.nav-link .ic { flex: none; width: 20px; text-align: center; font-size: .95rem; opacity: .9; }
.nav-link:hover { background: var(--navy-2); color: #fff; }
.nav-link.active { background: var(--navy-3); color: #fff; font-weight: 600; border-left-color: #fff; }
.nav-link.acc-gold .ic { color: #e2c25a; } .nav-link.acc-wheat .ic { color: #f0b54d; } .nav-link.acc-sugar .ic { color: #e6ddcd; } .nav-link.acc-steel .ic { color: #a9bcd2; }
.side-foot { padding: 8px; border-top: 1px solid rgba(255,255,255,.08); }
.collapse-btn { width: 100%; background: var(--navy-2); color: var(--navy-ink); border: 0; border-radius: 6px; padding: 6px; cursor: pointer; font: inherit; }
.shell { flex: 1; margin-left: var(--side-w); min-width: 0; display: flex; flex-direction: column; transition: margin .15s; }
body.side-collapsed { --side-w: 62px; }
body.side-collapsed .sidebar .txt, body.side-collapsed .nav-link .lb, body.side-collapsed .nav-gl { display: none; }
body.side-collapsed .nav-link { justify-content: center; padding: 8px 0; }
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 9px 20px; background: #fff; border-bottom: 1px solid var(--line); }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font-size: 1.1rem; cursor: pointer; }
.crumb { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search { position: relative; flex: 1; max-width: 460px; margin-left: auto; }
.search input { width: 100%; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); font: inherit; font-size: .9rem; }
.gresults { position: absolute; top: 40px; left: 0; right: 0; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(15,39,71,.18); max-height: 70vh; overflow-y: auto; z-index: 60; }
.gr { display: block; padding: 8px 12px; border-bottom: 1px solid var(--line-2); text-decoration: none; color: var(--ink); }
.gr:hover { background: var(--panel-2); }
.gr .k { display: inline-block; font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; background: var(--info-soft); color: var(--info); border-radius: 4px; padding: 0 5px; margin-right: 6px; }
.gr small { display: block; color: var(--ink-3); }
.top-stats { display: flex; gap: 14px; font-size: .84rem; color: var(--ink-2); white-space: nowrap; align-items: center; }
.sim-banner { background: var(--warn-soft); color: #6b4a00; font-size: .8rem; padding: 5px 20px; border-bottom: 1px solid #f0dfb5; }
.main { padding: 20px 24px 70px; max-width: 1320px; width: 100%; }
@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); width: 260px; transition: transform .2s; }
  body.nav-open .sidebar { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.4); }
  body.side-collapsed .sidebar .txt, body.side-collapsed .nav-link .lb, body.side-collapsed .nav-gl { display: initial; }
  .shell, body.side-collapsed .shell { margin-left: 0; }
  .menu-btn { display: block; }
  .top-stats { display: none; }
  .main { padding: 14px 16px 60px; }
  .topbar { padding: 8px 12px; gap: 8px; }
  .crumb { display: none; }
}

/* ---------------------------------------------------------------- page elements */
.page-head { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 3px solid var(--navy); }
.page-head .lede { color: var(--ink-2); margin: 0; max-width: 820px; }
.page-head.accent-gold { border-color: var(--gold); } .page-head.accent-wheat { border-color: var(--wheat); } .page-head.accent-sugar { border-color: var(--sugar); } .page-head.accent-steel { border-color: var(--steel); } .page-head.accent-char { border-color: var(--char-3); }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabs a { padding: 8px 14px; text-decoration: none; color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -1px; font-size: .92rem; white-space: nowrap; }
.tabs a:hover { color: var(--ink); background: var(--panel-2); }
.tabs a.on { color: var(--navy); border-bottom-color: var(--navy); font-weight: 600; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 16px; min-width: 0; }
.card.soft { background: var(--panel-2); box-shadow: none; }
.card > h3:first-child, .card > h2:first-child { margin-top: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.card-h h3 { margin: 0; }
.grid { display: grid; gap: 14px; }
.grid.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.side { grid-template-columns: minmax(0, 1fr) 360px; }
@media (max-width: 1100px) { .grid.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid.side { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .grid.c2, .grid.c3, .grid.c4 { grid-template-columns: 1fr; } }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: 10px; }
.note { border-radius: 8px; padding: 10px 14px; margin: 10px 0; border-left: 4px solid var(--info); background: var(--info-soft); }
.note.ok { border-color: var(--pos); background: var(--pos-soft); }
.note.warn { border-color: var(--warn); background: var(--warn-soft); }
.note.bad { border-color: var(--neg); background: var(--neg-soft); }
.note > :last-child { margin-bottom: 0; }
.note strong:first-child { display: block; margin-bottom: 2px; }
.badge { display: inline-block; font-size: .72rem; padding: 1px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; font-weight: 600; }
.badge.ok { background: var(--pos-soft); color: var(--pos); border-color: #bfe3cd; }
.badge.bad { background: var(--neg-soft); color: var(--neg); border-color: #f1c3c3; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: #efd9a6; }
.badge.info { background: var(--info-soft); color: var(--info); border-color: #c5d8f2; }
.badge.t-gold { background: var(--gold-soft); color: #7d5f0c; border-color: #ead9a4; }
.badge.t-wheat { background: var(--wheat-soft); color: #8a5a0c; border-color: #efd5a8; }
.badge.t-sugar { background: var(--sugar-soft); color: #5e5444; border-color: #ddd5c6; }
.badge.t-steel { background: var(--steel-soft); color: #3e5068; border-color: #cbd5e1; }
.sim-tag { display: inline-block; font-size: .62rem; font-weight: 700; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; background: #fff1cc; color: #7a5300; border: 1px solid #f0d58a; vertical-align: middle; }
.sim-tag.illu { background: #ece7ff; color: #4b3a8f; border-color: #d3c9f5; }
.sim-tag.hist { background: #e2f0ff; color: #164f8f; border-color: #bcd6f2; }

/* buttons & forms */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: .9rem; cursor: pointer; text-decoration: none; line-height: 1.3; }
.btn:hover { background: var(--panel-2); border-color: #c8d0dc; }
.btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
.btn.primary:hover { background: var(--navy-3); }
.btn.ok { background: var(--pos); color: #fff; border-color: var(--pos); }
.btn.danger { background: var(--neg); color: #fff; border-color: var(--neg); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 4px 10px; font-size: .82rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 5px 12px; cursor: pointer; font: inherit; font-size: .85rem; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--navy); color: #fff; }
.seg.sm button { padding: 2px 9px; font-size: .76rem; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 14px; }
.form.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form .full { grid-column: 1 / -1; }
.field label { display: block; font-size: .8rem; font-weight: 600; color: var(--ink-2); margin-bottom: 3px; }
.field .help { font-size: .76rem; color: var(--ink-3); margin-top: 2px; }
.field.included input { background: repeating-linear-gradient(45deg, var(--panel-2), var(--panel-2) 6px, #eef1f6 6px, #eef1f6 12px); color: var(--ink-3); }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea { width: 100%; padding: 7px 10px; border: 1px solid #cfd6e0; border-radius: 7px; background: #fff; color: var(--ink); font: inherit; font-size: .92rem; }
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus, .btn:focus-visible, a:focus-visible, .term:focus { outline: 2px solid var(--info); outline-offset: 1px; }
input:disabled { background: var(--panel-2); color: var(--ink-3); }
.check { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.check:hover { background: var(--panel-2); }
.check input { margin-top: 4px; }

/* tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; margin: 8px 0 12px; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: top; }
th { background: var(--panel-2); font-weight: 600; color: var(--ink-2); font-size: .8rem; white-space: nowrap; }
tbody tr:hover { background: #fafbfd; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 700; border-top: 2px solid var(--line); background: var(--panel-2); }
tr.sel td { background: var(--info-soft); }
.num { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: .88em; }

/* KPIs & progress */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; min-width: 0; }
.kpi .kl { font-size: .74rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.kpi .kv { font-size: 1.22rem; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .ks { font-size: .76rem; color: var(--ink-3); }
.kpi.pos .kv { color: var(--pos); } .kpi.neg .kv { color: var(--neg); } .kpi.warn .kv { color: var(--warn); }
.pbar { display: inline-block; width: 100%; height: 8px; background: var(--line-2); border-radius: 6px; overflow: hidden; vertical-align: middle; }
.pbar b { display: block; height: 100%; background: var(--pos); border-radius: 6px; }
.pbar.sm { width: 70px; height: 6px; }
.pbar.gold b { background: var(--gold); } .pbar.wheat b { background: var(--wheat); } .pbar.sugar b { background: var(--sugar); } .pbar.steel b { background: var(--steel); } .pbar.info b { background: var(--info); }
.empty { text-align: center; padding: 30px 16px; }
.empty-ic { font-size: 2rem; color: var(--ink-3); }

/* ---------------------------------------------------------------- dark trading workspace */
.ws { background: var(--char); color: var(--char-ink); border-radius: var(--radius); padding: 14px; border: 1px solid #12161b; }
.ws h3, .ws h4 { color: #fff; }
.ws .muted, .ws small { color: var(--char-ink-2); }
.ws .card, .ws .kpi { background: var(--char-2); border-color: var(--char-line); box-shadow: none; color: var(--char-ink); }
.ws .kpi .kl { color: var(--char-ink-2); }
.ws .kpi.pos .kv, .ws .pos { color: #45d18a !important; } .ws .kpi.neg .kv, .ws .neg { color: #ff7b7b !important; }
.ws table { color: var(--char-ink); }
.ws th { background: var(--char-3); color: var(--char-ink-2); }
.ws td, .ws th { border-color: var(--char-line); }
.ws tbody tr:hover { background: var(--char-3); }
.ws .table-wrap { border-color: var(--char-line); }
.ws input, .ws select { background: var(--char-3); color: #fff; border-color: var(--char-line); }
.ws .field label { color: var(--char-ink-2); }
.ws .btn { background: var(--char-3); color: var(--char-ink); border-color: var(--char-line); }
.ws .btn:hover { background: #3a4552; }
.ws .btn.primary { background: #2f6fc4; border-color: #2f6fc4; color: #fff; }
.ws .btn.ok { background: #1f9d5c; border-color: #1f9d5c; color: #fff; }
.ws .btn.danger { background: #c93535; border-color: #c93535; color: #fff; }
.ws .note { background: var(--char-3); color: var(--char-ink); }
.ws .chart svg .grid { stroke: #343e4a; } .ws .chart svg .ax { fill: #9aa7b8; }
.ws .chart .legend { color: var(--char-ink-2); }
.ws .tabs a { color: var(--char-ink-2); } .ws .tabs { border-color: var(--char-line); } .ws .tabs a.on { color: #fff; border-color: #fff; }
.ws .seg { border-color: var(--char-line); } .ws .seg button { background: var(--char-3); color: var(--char-ink-2); } .ws .seg button.on { background: #2f6fc4; color: #fff; }
.ticker { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.tick { flex: none; min-width: 150px; background: var(--char-2); border: 1px solid var(--char-line); border-radius: 8px; padding: 8px 10px; color: var(--char-ink); }
.tick b { display: block; font-size: 1.05rem; font-variant-numeric: tabular-nums; color: #fff; }
.tick .spark { width: 100%; height: 26px; }
.news { max-height: 260px; overflow-y: auto; font-size: .86rem; }
.news div { padding: 6px 0; border-bottom: 1px dashed var(--char-line); }
.news .d { color: var(--char-ink-2); font-family: var(--mono); font-size: .78rem; margin-right: 6px; }

/* ---------------------------------------------------------------- charts */
.chart { width: 100%; }
.chart-wrap { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart svg .grid { stroke: #e7ebf1; stroke-width: 1; }
.chart svg .zero { stroke: #9aa5b5; stroke-width: 1; }
.chart svg .ax { font-size: 11px; fill: #7a879b; font-family: var(--font); }
.chart svg .xh { stroke: #8895a8; stroke-dasharray: 3 3; }
.chart .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .78rem; color: var(--ink-2); margin-bottom: 4px; }
.chart .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.chart-tip { position: absolute; top: 6px; background: rgba(15, 39, 71, .92); color: #fff; font-size: .76rem; padding: 6px 8px; border-radius: 6px; pointer-events: none; width: 160px; font-family: var(--mono); }
.spark { width: 100px; height: 28px; }

/* ---------------------------------------------------------------- learning */
.lesson { max-width: 900px; }
.lesson-body h2 { margin-top: 1.4em; padding-top: .4em; border-top: 1px solid var(--line); }
.lesson-body h3 { margin-top: 1.2em; }
.concept { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 12px 0; background: #fff; }
.concept-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.concept-h h4 { margin: 0; color: var(--navy); }
.concept .mistake, .solution .mistake { background: var(--neg-soft); border-radius: 6px; padding: 6px 10px; }
.numbox { background: var(--panel-2); border: 1px dashed #c9d2de; border-radius: 6px; padding: 8px 10px; margin: 0 0 .8em; font-size: .92rem; }
.numbox > b { margin-right: 6px; }
.term { border-bottom: 1px dotted var(--info); cursor: help; color: inherit; }
.tip { position: absolute; z-index: 100; background: var(--navy); color: #fff; font-size: .82rem; line-height: 1.4; padding: 8px 10px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25); pointer-events: none; }
.coll { border: 1px solid var(--line); border-radius: 9px; margin: 8px 0; background: #fff; }
.coll-h { padding: 10px 14px; cursor: pointer; font-weight: 600; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.coll-h::after { content: '▸'; color: var(--ink-3); transition: transform .15s; }
.coll.open .coll-h::after { transform: rotate(90deg); }
.coll-b { display: none; padding: 0 14px 12px; }
.coll.open .coll-b { display: block; }
.stage { border: 1px solid var(--line); border-radius: 10px; background: #fff; margin-bottom: 12px; overflow: hidden; }
.stage-h { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--panel-2); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.stage-n { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--navy); color: #fff; }
.stage.locked .stage-n { background: #a8b3c3; } .stage.done .stage-n { background: var(--pos); }

<!-- engine -->
<script>
/* js/calc.js */
/* Commodity Trading Academy — calculation library
 * Pure functions only (no DOM). Loaded by the browser as window.CALC and by Node
 * (tests/calc.test.js) through module.exports.
 *
 * Internal conventions
 *  - Mass is held in kilograms internally; display units are converted at the edges.
 *  - "t" always means metric ton (1,000 kg). Short ton = "st", long ton = "lt".
 *  - "ozt" is the troy ounce (31.1034768 g). "oz" is the avoirdupois ounce (28.349523125 g).
 *  - Money amounts are plain numbers in the currency the caller chose; FX rates are
 *    expressed as "units of currency per 1 USD".
 *  - Interest uses simple interest with a configurable day-count basis (default ACT/360).
 */
(function (root) {
  'use strict';
  const C = {};

  /* ------------------------------------------------------------------ units */
  const KG = {
    g: 0.001,
    kg: 1,
    t: 1000,
    ozt: 0.0311034768,
    oz: 0.028349523125,
    lb: 0.45359237,
    st: 907.18474,
    lt: 1016.0469088,
    bu_wheat: 60 * 0.45359237, // a bushel of wheat is defined by weight: 60 lb
  };
  C.UNITS = KG;
  C.UNIT_LABELS = {
    g: 'gram (g)', kg: 'kilogram (kg)', t: 'metric ton (t)', ozt: 'troy ounce (ozt)', oz: 'avoirdupois ounce (oz)',
    lb: 'pound (lb)', st: 'short ton (2,000 lb)', lt: 'long ton (2,240 lb)', bu_wheat: 'bushel of wheat (60 lb)',
  };
  C.convertMass = function (value, from, to) {
    if (!(from in KG) || !(to in KG)) throw new Error('Unknown unit ' + from + '/' + to);
    return (Number(value) * KG[from]) / KG[to];
  };
  /* price per unit conversion: a price per "from" unit expressed per "to" unit */
  C.convertPricePerUnit = function (price, fromUnit, toUnit) {
    return (Number(price) * KG[toUnit]) / KG[fromUnit];
  };
  C.centsPerLbToUsdPerT = (c) => C.convertPricePerUnit(c / 100, 'lb', 't');
  C.usdPerTToCentsPerLb = (p) => C.convertPricePerUnit(p, 't', 'lb') * 100;
  C.centsPerBuToUsdPerT = (c) => C.convertPricePerUnit(c / 100, 'bu_wheat', 't');
  C.usdPerTToCentsPerBu = (p) => C.convertPricePerUnit(p, 't', 'bu_wheat') * 100;
  C.usdPerStToUsdPerT = (p) => C.convertPricePerUnit(p, 'st', 't');

  /* ------------------------------------------------------------------- gold */
  C.karatToFineness = (k) => Number(k) / 24;
  /* fine troy ounces contained in a gross weight at a given fineness (0-1) */
  C.fineOunces = function (grossWeight, unit, fineness) {
    return C.convertMass(grossWeight, unit, 'ozt') * Number(fineness);
  };
  C.goldValue = function ({ grossWeight, unit = 'g', fineness = 0.9999, spotPerOzt, premiumPerOzt = 0 }) {
    const fine = C.fineOunces(grossWeight, unit, fineness);
    return { fineOz: fine, value: fine * (Number(spotPerOzt) + Number(premiumPerOzt)) };
  };

  /* ------------------------------------------------------------------ steel */
  C.STEEL_DENSITY = 7850; // kg/m3, typical carbon steel (approximation)
  /* theoretical rebar mass per metre: pi/4 * d^2 * density ; d in mm -> kg/m (≈ d²/162.2) */
  C.rebarKgPerM = (dMm) => (Math.PI / 4) * Math.pow(dMm / 1000, 2) * C.STEEL_DENSITY;
  /* plate / sheet: thickness mm, width mm, length mm -> kg */
  C.plateKg = (tMm, wMm, lMm) => (tMm / 1000) * (wMm / 1000) * (lMm / 1000) * C.STEEL_DENSITY;

  /* ------------------------------------------------------------------ grain */
  /* water-removal shrink: % of weight lost when drying from m0 to m1 (wet basis) */
  C.moistureShrinkPct = (m0, m1) => (m0 <= m1 ? 0 : ((m0 - m1) / (100 - m1)) * 100);
  C.dryWeight = (w, m0, m1) => w * (1 - C.moistureShrinkPct(m0, m1) / 100);

  /* ------------------------------------------------------------------ sugar */
  C.whitePremium = (whiteUsdPerT, rawCentsPerLb) => whiteUsdPerT - C.centsPerLbToUsdPerT(rawCentsPerLb);
  /* simplified refining margin per tonne of white sugar */
  C.refiningMargin = function ({ whiteUsdPerT, rawCentsPerLb, rawPerWhite = 1.06, refiningCostPerT = 0, freightRawPerT = 0 }) {
    const raw = C.centsPerLbToUsdPerT(rawCentsPerLb);
    return whiteUsdPerT - (raw + freightRawPerT) * rawPerWhite - refiningCostPerT;
  };

  /* -------------------------------------------------------------------- fx */
  C.fx = function (amount, from, to, rates) {
    if (from === to) return Number(amount);
    const rf = rates[from], rt = rates[to];
    if (!rf || !rt) throw new Error('Missing FX rate ' + from + '/' + to);
    return (Number(amount) / rf) * rt;
  };

  /* -------------------------------------------------------------- generic */
  C.round = (n, d = 2) => { const f = Math.pow(10, d); return Math.round((Number(n) + Number.EPSILON) * f) / f; };
  C.pctChange = (a, b) => (a === 0 ? NaN : ((b - a) / a) * 100);
  C.interest = (principal, annualRatePct, days, basis = 360) => (Number(principal) * Number(annualRatePct) / 100 * Number(days)) / basis;
  C.within = (value, expected, tolAbs, tolRel) => {
    const diff = Math.abs(Number(value) - Number(expected));
    return diff <= (tolAbs || 0) || (tolRel != null && diff <= Math.abs(expected) * tolRel);
  };

  /* --------------------------------------------------------- landed cost
   * Every cost line is declared once with a unit:
   *   per_t  : amount per metric ton x quantity
   *   lump   : flat amount for the shipment
   * Items that the purchase Incoterm already includes in the price are excluded
   * (they are listed in `included`) so the same cost cannot be counted twice.
   */
  C.INCOTERM_INCLUDES = {
    EXW: [],
    FCA: ['inlandOrigin', 'exportCharges'],
    FAS: ['inlandOrigin', 'exportCharges'],
    FOB: ['inlandOrigin', 'exportCharges', 'loading'],
    CFR: ['inlandOrigin', 'exportCharges', 'loading', 'freight'],
    CIF: ['inlandOrigin', 'exportCharges', 'loading', 'freight', 'insurance'],
    CPT: ['inlandOrigin', 'exportCharges', 'loading', 'freight'],
    CIP: ['inlandOrigin', 'exportCharges', 'loading', 'freight', 'insurance'],
    DAP: ['inlandOrigin', 'exportCharges', 'loading', 'freight', 'insurance', 'portCharges', 'inlandDest'],
    DPU: ['inlandOrigin', 'exportCharges', 'loading', 'freight', 'insurance', 'portCharges', 'inlandDest', 'unloading'],
    DDP: ['inlandOrigin', 'exportCharges', 'loading', 'freight', 'insurance', 'portCharges', 'inlandDest', 'unloading', 'duty'],
  };
  C.COST_LINES = [
    ['inlandOrigin', 'Inland transport at origin', 'per_t'],
    ['loading', 'Loading / FOBbing expenses', 'per_t'],
    ['exportCharges', 'Export charges & origin fees', 'per_t'],
    ['freight', 'Ocean freight', 'per_t'],
    ['insurance', 'Cargo insurance', 'calc'],
    ['inspection', 'Inspection, sampling & analysis', 'lump'],
    ['duty', 'Import duty', 'calc'],
    ['otherTaxes', 'Other non-recoverable import taxes', 'calc'],
    ['portCharges', 'Destination port charges', 'per_t'],
    ['unloading', 'Discharge / unloading', 'per_t'],
    ['inlandDest', 'Inland transport at destination', 'per_t'],
    ['otherCosts', 'Other deal costs', 'lump'],
    ['financing', 'Financing cost (purchase to collection)', 'calc'],
  ];

  C.landedCost = function (i) {
    const q = Number(i.qty) || 0;
    const inc = C.INCOTERM_INCLUDES[i.buyTerm || 'FOB'] || [];
    const has = (k) => !inc.includes(k);
    const v = (k) => (has(k) ? Number(i[k]) || 0 : 0);
    const goods = q * (Number(i.buyPrice) || 0);
    const lines = {};
    lines.inlandOrigin = v('inlandOrigin') * q;
    lines.loading = v('loading') * q;
    lines.exportCharges = v('exportCharges') * q;
    lines.freight = v('freight') * q;
    const insuredBase = goods + (has('freight') ? lines.freight : 0) + lines.loading + lines.inlandOrigin + lines.exportCharges;
    const insuredValue = insuredBase * (1 + (Number(i.insuredUpliftPct == null ? 10 : i.insuredUpliftPct) / 100));
    lines.insurance = has('insurance') ? insuredValue * (Number(i.insurancePct) || 0) / 100 : 0;
    lines.inspection = Number(i.inspection) || 0;
    // customs value: CIF basis by default (FOB basis is used in some jurisdictions)
    const fobValue = goods + lines.inlandOrigin + lines.loading + lines.exportCharges;
    const cifValue = goods + lines.inlandOrigin + lines.loading + lines.exportCharges + lines.freight + lines.insurance;
    // when the purchase term already includes freight/insurance the goods price is itself a CFR/CIF value
    const customsValue = i.dutyBase === 'FOB' ? fobValue : cifValue;
    lines.duty = has('duty') ? customsValue * (Number(i.dutyPct) || 0) / 100 : 0;
    lines.otherTaxes = has('duty') ? (customsValue + lines.duty) * (Number(i.otherTaxesPct) || 0) / 100 : 0;
    lines.portCharges = v('portCharges') * q;
    lines.unloading = v('unloading') * q;
    lines.inlandDest = v('inlandDest') * q;
    lines.otherCosts = Number(i.otherCosts) || 0;
    const beforeFin = goods + Object.values(lines).reduce((a, b) => a + b, 0);
    const finBase = i.financeBase === 'goods' ? goods : beforeFin;
    lines.financing = C.interest(finBase * ((i.financedPct == null ? 100 : Number(i.financedPct)) / 100), Number(i.financeRatePct) || 0, Number(i.financeDays) || 0, i.dayBasis || 360);
    const total = beforeFin + lines.financing;
    return {
      qty: q, goods, lines, included: inc, insuredValue, customsValue, fobValue, cifValue,
      totalBeforeFinancing: beforeFin, total, perT: q ? total / q : 0, perTBeforeFinancing: q ? beforeFin / q : 0,
    };
  };

  /* ------------------------------------------------------------- deal P&L
   * net sales revenue - total landed cost - selling expenses - extra financing - other = net profit
   */
  C.dealPnL = function (i) {
    const lc = C.landedCost(i);
    const qSold = i.qtySold != null ? Number(i.qtySold) : lc.qty;
    const gross = qSold * (Number(i.sellPrice) || 0);
    const commission = gross * (Number(i.commissionPct) || 0) / 100;
    const discounts = gross * (Number(i.discountPct) || 0) / 100;
    const netRevenue = gross - commission - discounts;
    const sellingExp = (Number(i.sellingPerT) || 0) * qSold + (Number(i.sellingLump) || 0);
    const extraFin = Number(i.extraFinancing) || 0;
    const other = Number(i.otherDealExp) || 0;
    const grossMargin = netRevenue - lc.totalBeforeFinancing;
    const netProfit = netRevenue - lc.total - sellingExp - extraFin - other;
    const fixedOut = lc.total + sellingExp + extraFin + other;
    const pctTake = ((Number(i.commissionPct) || 0) + (Number(i.discountPct) || 0)) / 100;
    const breakEven = qSold > 0 && pctTake < 1 ? fixedOut / (qSold * (1 - pctTake)) : NaN;
    // working capital: cash paid before the buyer pays, less buyer advance and supplier credit
    const advance = gross * (Number(i.buyerAdvancePct) || 0) / 100;
    const supplierCredit = lc.goods * (Number(i.supplierCreditPct) || 0) / 100;
    const wc = Math.max(0, lc.totalBeforeFinancing - advance - supplierCredit);
    const bankFunded = wc * (Number(i.bankFundedPct) || 0) / 100;
    const equity = wc - bankFunded;
    const cycleDays = Number(i.financeDays) || 0;
    const roic = equity > 0 ? netProfit / equity : NaN;
    const roicAnnual = equity > 0 && cycleDays > 0 ? roic * 365 / cycleDays : NaN;
    // stress: buyer default -> resale at a discount; plus adverse costs
    const resaleDiscount = Number(i.stressResaleDiscountPct) || 0;
    const adverseExtra = (Number(i.stressFreightPct) || 0) / 100 * lc.lines.freight + (Number(i.stressDelayDays) || 0) * (Number(i.demurragePerDay) || 0);
    const defaultLoss = lc.total + adverseExtra - qSold * (Number(i.sellPrice) || 0) * (1 - resaleDiscount / 100) + sellingExp + other;
    const stressProfit = netRevenue * (1 - (Number(i.stressPricePct) || 0) / 100) - lc.total - adverseExtra - sellingExp - extraFin - other;
    return {
      landed: lc, qtySold: qSold, grossRevenue: gross, commission, discounts, netRevenue, sellingExp, extraFin, other,
      grossMargin, grossMarginPct: netRevenue ? grossMargin / netRevenue * 100 : NaN,
      netProfit, netMarginPct: netRevenue ? netProfit / netRevenue * 100 : NaN,
      perTSell: Number(i.sellPrice) || 0, perTCost: lc.perT, profitPerT: qSold ? netProfit / qSold : 0,
      breakEven, workingCapital: wc, bankFunded, equity, roic, roicAnnual,
      maxLossBuyerDefault: Math.max(0, defaultLoss), stressProfit,
      maxPotentialLoss: Math.max(0, -stressProfit, defaultLoss),
    };
  };

  /* ---------------------------------------------------- futures & margin */
  C.tickValue = (tickSize, multiplier) => tickSize * multiplier;
  C.futuresPnL = (side, entry, exit, contracts, multiplier) => (side === 'long' ? 1 : -1) * (exit - entry) * contracts * multiplier;
  C.notional = (price, contracts, multiplier) => price * contracts * multiplier;
  C.leverage = (notional, equity) => (equity > 0 ? notional / equity : Infinity);
  /* fill price including half-spread and slippage, in price units */
  C.fillPrice = (mid, side, spreadTicks, slippageTicks, tick) => {
    const adj = (spreadTicks / 2 + slippageTicks) * tick;
    return side === 'buy' ? mid + adj : mid - adj;
  };
  C.marginStatus = (equity, initialReq, maintReq) => {
    if (equity < maintReq) return { call: true, deficit: initialReq - equity }; // restore to initial margin
    return { call: false, deficit: 0, free: equity - initialReq };
  };
  C.riskPerTrade = (entry, stop, contracts, multiplier) => Math.abs(entry - stop) * contracts * multiplier;
  C.positionSize = (equity, riskPct, entry, stop, multiplier) => {
    const perContract = Math.abs(entry - stop) * multiplier;
    return perContract > 0 ? Math.floor((equity * riskPct / 100) / perContract) : 0;
  };

  /* ------------------------------------------------------ normal & options */
  C.normCdf = function (x) {
    // W. J. Cody style rational approximation via erf (|err| < 1.2e-7)
    const t = 1 / (1 + 0.5 * Math.abs(x) / Math.SQRT2);
    const y = 1 - t * Math.exp(-(x * x) / 2 - 1.26551223 + t * (1.00002368 + t * (0.37409196 + t * (0.09678418 + t * (-0.18628806 +
      t * (0.27886807 + t * (-1.13520398 + t * (1.48851587 + t * (-0.82215223 + t * 0.17087277)))))))));
    return x >= 0 ? (1 + y) / 2 : (1 - y) / 2;
  };
  C.normPdf = (x) => Math.exp(-x * x / 2) / Math.sqrt(2 * Math.PI);
  /* Black-76 for European options on futures. T in years, r and sigma decimals. */
  C.black76 = function (F, K, T, r, sigma, type) {
    const df = Math.exp(-r * T);
    if (T <= 0 || sigma <= 0) {
      const iv = type === 'call' ? Math.max(F - K, 0) : Math.max(K - F, 0);
      return { price: iv * (T <= 0 ? 1 : df), delta: type === 'call' ? (F > K ? 1 : 0) : (F < K ? -1 : 0), gamma: 0, vega: 0, theta: 0, intrinsic: iv, timeValue: 0 };
    }
    const sT = sigma * Math.sqrt(T);
    const d1 = (Math.log(F / K) + 0.5 * sigma * sigma * T) / sT;
    const d2 = d1 - sT;
    let price, delta;
    if (type === 'call') { price = df * (F * C.normCdf(d1) - K * C.normCdf(d2)); delta = df * C.normCdf(d1); }
    else { price = df * (K * C.normCdf(-d2) - F * C.normCdf(-d1)); delta = -df * C.normCdf(-d1); }
    const gamma = df * C.normPdf(d1) / (F * sT);
    const vega = df * F * C.normPdf(d1) * Math.sqrt(T) / 100; // per 1 volatility point
    const thetaYr = -df * F * C.normPdf(d1) * sigma / (2 * Math.sqrt(T)) + r * price;
    const intrinsic = type === 'call' ? Math.max(F - K, 0) : Math.max(K - F, 0);
    return { price, delta, gamma, vega, theta: thetaYr / 365, intrinsic, timeValue: price - intrinsic * df, d1, d2 };
  };
  C.optionPayoff = (type, side, K, premium, F) => {

      const STOP = ['offer', 'ask', 'bid', 'roll', 'tick', 'carry', 'support', 'resistance', 'forward', 'stocks', 'premium', 'spot', 'options', 'option', 'delta', 'gamma', 'theta', 'vega', 'pol', 'cane', 'beet', 'duty', 'tariff', 'hedge', 'strike', 'multiplier', 'tolerance', 'volume', 'purity', 'custody', 'scrap', 'slab', 'bloom', 'billet', 'futures', 'exchange', 'inventory', 'basis', 'benchmark', 'swap'];
      CTA.GLOSSARY.forEach((g) => [g.term, ...g.alias].forEach((k) => { if (k.length >= 3 && !/[()]/.test(k) && !STOP.includes(k.toLowerCase())) keys.push(k); }));
      keys.sort((a, b) => b.length - a.length);
      const escRx = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      CTA._termRx = new RegExp('(^|[^A-Za-z0-9])(' + keys.map(escRx).join('|') + ')(?![A-Za-z0-9])', 'i');
    }
    const seen = new Set(); let count = 0; const limit = max || 60;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: (n) => (n.parentElement.closest('.term,a,button,label,input,select,textarea,h1,h2,h3,h4,.quiz,.kpi,.chart,svg,.doc,code,th') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT) });
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const node of nodes) {
      if (count >= limit) break;
      let text = node.nodeValue; let m; const frag = document.createDocumentFragment(); let changed = false; let guard = 0;
      while (count < limit && (m = CTA._termRx.exec(text)) && guard++ < 20) {
        const word = m[2], key = word.toLowerCase(), g = CTA.glossaryIndex[key];
        const isAcronym = word.length <= 4 && word === word.toUpperCase();
        const start = m.index + m[1].length;
        if (!g || seen.has(g.term) || (isAcronym && !Object.values(CTA.glossaryIndex).some((x) => [x.term, ...x.alias].includes(word)))) { frag.appendChild(document.createTextNode(text.slice(0, start + word.length))); text = text.slice(start + word.length); continue; }
        seen.add(g.term); count++; changed = true;
        frag.appendChild(document.createTextNode(text.slice(0, start)));
        const sp = document.createElement('span'); sp.className = 'term'; sp.tabIndex = 0; sp.dataset.term = key; sp.textContent = word; frag.appendChild(sp);
        text = text.slice(start + word.length);
      }
      if (changed) { frag.appendChild(document.createTextNode(text)); node.parentNode.replaceChild(frag, node); }
    }
  };

  CTA.initSearch = function () {
    const inp = CTA.$('#gsearch'), box = CTA.$('#gresults');
    let idx = null;
    const run = () => {
      const q = inp.value.trim().toLowerCase();
      if (q.length < 2) { box.classList.add('hidden'); return; }
      idx = idx || CTA.searchIndex();
      const words = q.split(/\s+/);
      const hits = idx.map((it) => {
        const t = it.t.toLowerCase(), s = (it.s || '').toLowerCase();
        if (!words.every((w) => t.includes(w) || s.includes(w))) return null;
        return { it, score: (t.startsWith(q) ? 5 : 0) + (t.includes(q) ? 3 : 0) + (it.k === 'Section' ? 2 : 0) + (it.k === 'Lesson' ? 1 : 0) };
      }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 14);
      box.innerHTML = hits.length ? hits.map(({ it }) => `<a href="#/${it.go}" class="gr"><span class="k">${it.k}</span><b>${esc(it.t)}</b><small>${esc((it.s || '').slice(0, 110))}</small></a>`).join('') : '<div class="gr muted">No results. Try another word, or browse the Glossary.</div>';
      box.classList.remove('hidden');
    };
    inp.addEventListener('input', run);
    inp.addEventListener('focus', run);
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const a = CTA.$('a.gr', box); if (a) { location.hash = a.getAttribute('href'); box.classList.add('hidden'); inp.blur(); } } if (e.key === 'Escape') { box.classList.add('hidden'); inp.blur(); } });
    document.addEventListener('click', (e) => { if (!e.target.closest('.search')) box.classList.add('hidden'); else if (e.target.closest('a.gr')) { box.classList.add('hidden'); inp.value = ''; } });
  };

  /* ============================================================ study time */

  /* ============================================================ UI widgets */
  CTA.ui = {};
  /* Multiple-choice quiz. opts: {compact, exam, onDone(result), shuffle, title} */
  CTA.ui.quiz = function (el, qids, opts) {
    opts = opts || {};
    const qs = qids.map((id) => CTA.Q_INDEX && CTA.Q_INDEX[id.trim()]).filter(Boolean);
    if (!qs.length) { el.innerHTML = '<p class="muted">No questions available.</p>'; return; }
    const answered = {};
    const pfx = 'qz' + Math.random().toString(36).slice(2, 8);
    el.innerHTML = `<div class="quiz ${opts.compact ? 'compact' : ''}">${opts.title ? `<h4>${opts.title}</h4>` : opts.compact ? '<div class="quiz-tag">Check your understanding</div>' : ''}
      ${qs.map((q, qi) => `<div class="q" data-q="${q.id}"><p class="q-text"><b>${qs.length > 1 ? qi + 1 + '. ' : ''}</b>${CTA.rich(q.q)}</p>
        <div class="opts">${CTA.shuffleIdx(q.o.length).map((oi) => `<label class="opt" data-oi="${oi}"><input type="radio" name="${pfx}-${q.id}" value="${oi}"> <span>${CTA.rich(q.o[oi])}</span></label>`).join('')}</div>
        ${opts.exam ? '' : `<div class="row"><button class="btn sm primary chk" type="button">Check answer</button></div>`}
        <div class="q-fb"></div></div>`).join('')}

      <div class="quiz-summary"></div></div>`;
    const show = (qEl, q, chosen) => {
      const ok = chosen === q.a;
      CTA.$$('.opt', qEl).forEach((l) => { const i = +l.dataset.oi; l.classList.toggle('right', i === q.a); l.classList.toggle('wrong', i === chosen && !ok); CTA.$('input', l).disabled = true; });
      CTA.$('.q-fb', qEl).innerHTML = `<div class="note ${ok ? 'ok' : 'bad'}"><strong>${ok ? 'Correct.' : 'Not quite.'}</strong>${CTA.rich(q.e)}</div>`;
      const b = CTA.$('.chk', qEl); if (b) b.remove();
    };
    CTA.$$('.q', el).forEach((qEl) => {
      const q = CTA.Q_INDEX[qEl.dataset.q];
      const b = CTA.$('.chk', qEl);
      if (b) b.onclick = () => {
        const sel = CTA.$('input:checked', qEl);
        if (!sel) { CTA.toast('Choose an answer first.', 'warn'); return; }
        const chosen = +sel.value; const ok = chosen === q.a;
        answered[q.id] = ok; CTA.record.answer(q.id, ok); show(qEl, q, chosen);
        if (Object.keys(answered).length === qs.length) finish();
      };
    });
    function finish() {
      const correct = Object.values(answered).filter(Boolean).length;
      const res = { correct, total: qs.length, pct: correct / qs.length * 100, answers: answered };
      if (!opts.compact || qs.length > 1) CTA.$('.quiz-summary', el).innerHTML = `<div class="note ${res.pct >= 70 ? 'ok' : 'warn'}"><strong>Score: ${correct}/${qs.length} (${Math.round(res.pct)}%)</strong>${res.pct >= 70 ? 'Mastery threshold (70%) reached.' : 'Below the 70% mastery threshold — review the explanations and try again.'}</div>`;
      if (opts.onDone) opts.onDone(res);
    }
    const sub = CTA.$('.submit', el);
    if (sub) sub.onclick = () => {
      const missing = CTA.$$('.q', el).filter((qEl) => !CTA.$('input:checked', qEl));
      if (missing.length && !confirm(missing.length + ' question(s) unanswered. Submit anyway? Unanswered questions count as wrong.')) return;
      CTA.$$('.q', el).forEach((qEl) => {
        const q = CTA.Q_INDEX[qEl.dataset.q]; const sel = CTA.$('input:checked', qEl);

        answered[q.id] = ok; CTA.record.answer(q.id, ok); show(qEl, q, chosen);
      });
      sub.remove(); finish();
    };
  };

  /* Numeric exercise widget. ex = {id, title, topic, gen(rng) -> {prompt, answer, unit, tol, tolRel, formula, steps, mistakes, implication}} */
  CTA.ui.exercise = function (el, ex, opts) {
    opts = opts || {};
    let seed = opts.seed || 1;
    const draw = () => {
      const inst = ex.gen(C.rng(seed));
      el.innerHTML = `<div class="exercise">
        <div class="ex-h"><span class="badge t-${ex.topic}">${ex.topicLabel || ex.topic}</span><h4>${esc(ex.title)}</h4></div>
        <div class="ex-prompt">${CTA.rich(inst.prompt)}</div>
        <div class="row ex-input"><label class="sr" for="${ex.id}-in">Your answer</label><input id="${ex.id}-in" type="text" inputmode="decimal" placeholder="Your answer" style="max-width:220px"><span class="unit">${esc(inst.unit || '')}</span>
          <button class="btn primary sm" type="button" data-a="check">Check</button><button class="btn sm" type="button" data-a="show">Show solution</button>${opts.noNew ? '' : '<button class="btn sm ghost" type="button" data-a="new">New numbers</button>'}</div>
        <div class="ex-fb"></div></div>`;
      const fb = CTA.$('.ex-fb', el);
      const sol = () => `<div class="solution"><p><b>Formula.</b> ${CTA.rich(inst.formula)}</p><div><b>Working.</b><ol>${inst.steps.map((s) => `<li>${CTA.rich(s)}</li>`).join('')}</ol></div>
        <p><b>Answer:</b> <span class="mono">${fmt.num(inst.answer, inst.dp == null ? 2 : inst.dp)} ${esc(inst.unit || '')}</span> <span class="muted">(accepted within ±${inst.tolRel ? (inst.tolRel * 100) + '%' : fmt.num(inst.tol, inst.dp == null ? 2 : inst.dp)})</span></p>
        ${inst.mistakes ? `<p class="mistake"><b>Common mistakes.</b> ${CTA.rich(inst.mistakes)}</p>` : ''}
        ${inst.implication ? `<p><b>Commercial implication.</b> ${CTA.rich(inst.implication)}</p>` : ''}</div>`;
      CTA.$('[data-a=check]', el).onclick = () => {
        const raw = CTA.$('input', el).value.trim();
        if (!raw) { CTA.toast('Enter a number first.', 'warn'); return; }
        const v = CTA.num(raw.replace(/[%$€£]/g, ''), NaN);
        if (isNaN(v)) { fb.innerHTML = '<div class="note warn"><strong>That is not a number.</strong>Type digits only, e.g. 1234.5 (commas allowed).</div>'; return; }
        const ok = C.within(v, inst.answer, inst.tol, inst.tolRel);
        CTA.record.exercise(ex.id, ok);
        let hint = '';
        if (!ok && inst.diagnose) hint = inst.diagnose(v) || '';
        fb.innerHTML = `<div class="note ${ok ? 'ok' : 'bad'}"><strong>${ok ? 'Correct.' : 'Not correct — your answer: ' + fmt.num(v, inst.dp == null ? 2 : inst.dp)}</strong>${hint ? CTA.rich(hint) : ''}</div>` + sol();
        if (opts.onResult) opts.onResult(ok);
      };
      CTA.$('[data-a=show]', el).onclick = () => { fb.innerHTML = '<div class="note warn"><strong>Solution shown.</strong>Recorded as an attempt without a correct answer. Try "New numbers" to practise again.</div>' + sol(); CTA.record.exercise(ex.id, false); if (opts.onResult) opts.onResult(false); };
      const nb = CTA.$('[data-a=new]', el); if (nb) nb.onclick = () => { seed = Math.floor(Math.random() * 1e9); draw(); };
    };
    draw();
  };

    if (f.type === 'select') input = `<select id="${id}" name="${f.name || id}">${f.options.map((o) => { const [val, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
    else if (f.type === 'textarea') input = `<textarea id="${id}" name="${f.name || id}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
    else input = `<input id="${id}" name="${f.name || id}" type="${f.type || 'number'}" ${f.step ? `step="${f.step}"` : 'step="any"'} ${f.min != null ? `min="${f.min}"` : ''} value="${esc(v)}" ${f.disabled ? 'disabled' : ''} placeholder="${esc(f.ph || '')}">`;
    return `<div class="field ${f.cls || ''}">${lab}${input}${f.help ? `<div class="help">${f.help}</div>` : ''}</div>`;
  };
  CTA.ui.read = (root, names) => {
    const o = {};
    CTA.$$('input,select,textarea', root).forEach((i) => {
      const k = i.name || i.id; if (!k || (names && !names.includes(k))) return;
      if (i.type === 'checkbox') o[k] = i.checked;
      else if (i.type === 'number') o[k] = i.value === '' ? 0 : parseFloat(i.value);
      else o[k] = i.value;
    });
    return o;
  };
  CTA.ui.kpis = (items) => `<div class="kpis">${items.map((k) => `<div class="kpi ${k.cls || ''}"><div class="kl">${k.label}${k.term ? ' ' + CTA.term(k.term, 'ⓘ') : ''}</div><div class="kv">${k.value}</div>${k.sub ? `<div class="ks">${k.sub}</div>` : ''}</div>`).join('')}</div>`;
  CTA.ui.empty = (title, text, action) => `<div class="empty"><div class="empty-ic">○</div><h3>${title}</h3><p class="muted">${text}</p>${action || ''}</div>`;
  CTA.ui.pbar = (pct, cls) => `<i class="pbar ${cls || ''}"><b style="width:${Math.max(0, Math.min(100, pct))}%"></b></i>`;

  /* ============================================================ charts (SVG) */
  /* opts: {series:[{type:'line'|'area'|'bars'|'candles', data:[...], color, label, width, dash}], height, labels:[x labels],
            yFmt, hlines:[{y,color,label,dash}], markers:[{i,y,color,label,shape}], yMin, yMax, zero:true } */
  CTA.chart = function (el, opts) {
    const W = 800, H = opts.height || 260, padL = 58, padR = 14, padT = 14, padB = opts.labels ? 26 : 12;
    const series = opts.series.filter((s) => s.data && s.data.length);
    const n = Math.max(...series.map((s) => s.data.length), 2);
    let lo = Infinity, hi = -Infinity;
    series.forEach((s) => s.data.forEach((d) => {
      if (d == null) return;
      if (s.type === 'candles') { lo = Math.min(lo, d.l); hi = Math.max(hi, d.h); } else { lo = Math.min(lo, d); hi = Math.max(hi, d); }
    }));
    (opts.hlines || []).forEach((h) => { lo = Math.min(lo, h.y); hi = Math.max(hi, h.y); });
    if (opts.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (opts.yMin != null) lo = opts.yMin; if (opts.yMax != null) hi = opts.yMax;
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    if (hi === lo) { hi += 1; lo -= 1; }
    const span = hi - lo; if (opts.yMin == null) lo -= span * 0.05; if (opts.yMax == null) hi += span * 0.05;
    const x = (i) => padL + (n === 1 ? 0 : (i / (n - 1)) * (W - padL - padR));
    const y = (v) => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
    const yf = opts.yFmt || ((v) => fmt.num(v, Math.abs(hi - lo) < 5 ? 2 : Math.abs(hi - lo) < 200 ? 1 : 0));
    let g = '';
    for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4; g += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${padL - 6}" y="${y(v) + 4}" class="ax" text-anchor="end">${yf(v)}</text>`; }
    if (opts.labels) { const step = Math.ceil(n / 8); opts.labels.forEach((l, i) => { if (i % step === 0) g += `<text x="${x(i)}" y="${H - 6}" class="ax" text-anchor="middle">${esc(l)}</text>`; }); }
    if (opts.zero && lo < 0 && hi > 0) g += `<line x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}" class="zero"/>`;
    const bw = Math.max(1, (W - padL - padR) / n * 0.62);
    series.forEach((s) => {
      const col = s.color || 'var(--c1)';
      if (s.type === 'candles') {
        s.data.forEach((d, i) => { if (!d) return; const up = d.c >= d.o; const c = up ? 'var(--pos)' : 'var(--neg)';
          g += `<line x1="${x(i)}" x2="${x(i)}" y1="${y(d.h)}" y2="${y(d.l)}" stroke="${c}" stroke-width="1"/><rect x="${x(i) - bw / 2}" y="${y(Math.max(d.o, d.c))}" width="${bw}" height="${Math.max(1, Math.abs(y(d.o) - y(d.c)))}" fill="${c}"/>`; });
      } else if (s.type === 'bars') {
        s.data.forEach((v, i) => { if (v == null) return; const c = s.colorFn ? s.colorFn(v, i) : col; g += `<rect x="${x(i) - bw / 2}" y="${Math.min(y(v), y(Math.max(lo, 0)))}" width="${bw}" height="${Math.abs(y(v) - y(Math.max(lo, 0)))}" fill="${c}" opacity="${s.opacity || 0.85}"/>`; });
      } else {
        let d = ''; let started = false;
        s.data.forEach((v, i) => { if (v == null || !isFinite(v)) { started = false; return; } d += (started ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; started = true; });
        if (s.type === 'area') { const first = s.data.findIndex((v) => v != null); const last = s.data.length - 1; g += `<path d="${d} L${x(last)} ${y(Math.max(lo, 0))} L${x(first)} ${y(Math.max(lo, 0))} Z" fill="${col}" opacity=".15"/>`; }
        g += `<path d="${d}" fill="none" stroke="${col}" stroke-width="${s.width || 1.8}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''} stroke-linejoin="round"/>`;
      }
    });
    (opts.hlines || []).forEach((h) => { g += `<line x1="${padL}" x2="${W - padR}" y1="${y(h.y)}" y2="${y(h.y)}" stroke="${h.color || 'var(--ink-3)'}" stroke-dasharray="${h.dash || '4 4'}"/>${h.label ? `<text x="${W - padR - 4}" y="${y(h.y) - 4}" class="ax hl" text-anchor="end" fill="${h.color || 'var(--ink-3)'}">${esc(h.label)}</text>` : ''}`; });
    (opts.markers || []).forEach((m) => { g += `<g><circle cx="${x(m.i)}" cy="${y(m.y)}" r="5" fill="${m.color || 'var(--c2)'}" stroke="#fff" stroke-width="1.5"/>${m.label ? `<text x="${x(m.i)}" y="${y(m.y) - 9}" class="ax mk" text-anchor="middle">${esc(m.label)}</text>` : ''}</g>`; });
    const legend = series.filter((s) => s.label).map((s) => `<span><i style="background:${s.type === 'candles' ? 'var(--pos)' : s.color || 'var(--c1)'}"></i>${esc(s.label)}</span>`).join('');
    el.innerHTML = `<div class="chart">${legend ? `<div class="legend">${legend}</div>` : ''}<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(opts.aria || 'Chart')}">${g}<line class="xh hidden" y1="${padT}" y2="${H - padB}"/></svg><div class="chart-tip hidden"></div></div></div>`;
    const svg = CTA.$('svg', el), tip = CTA.$('.chart-tip', el), xh = CTA.$('.xh', el);
    svg.addEventListener('mousemove', (ev) => {
      const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) / r.width * W;
      const i = Math.max(0, Math.min(n - 1, Math.round((px - padL) / (W - padL - padR) * (n - 1))));
      xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.classList.remove('hidden');
      const rows = series.map((s) => { const d = s.data[i]; if (d == null) return ''; return s.type === 'candles' ? `O ${yf(d.o)} H ${yf(d.h)} L ${yf(d.l)} C ${yf(d.c)}` : `${esc(s.label || '')} ${yf(d)}`; }).filter(Boolean);
      tip.innerHTML = `<b>${opts.labels ? esc(opts.labels[i]) : '#' + i}</b><br>${rows.join('<br>')}`;
      tip.classList.remove('hidden');
      const left = (x(i) / W) * r.width; tip.style.left = Math.min(r.width - 170, Math.max(0, left + 10)) + 'px';
    });
    svg.addEventListener('mouseleave', () => { tip.classList.add('hidden'); xh.classList.add('hidden'); });
  };
  CTA.sparkline = (data, color) => {
    if (!data || data.length < 2) return '';
    const lo = Math.min(...data), hi = Math.max(...data), W = 100, H = 28;
    const d = data.map((v, i) => `${i ? 'L' : 'M'}${(i / (data.length - 1) * W).toFixed(1)} ${(H - 2 - (v - lo) / ((hi - lo) || 1) * (H - 4)).toFixed(1)}`).join(' ');
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="${color || 'currentColor'}" stroke-width="1.6"/></svg>`;
  };

  /* download helper */
  CTA.download = (name, text, type) => {
    const blob = new Blob([text], { type: type || 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };

  /* journal helper used by simulators */
  CTA.journalAdd = function (entry) {
    if (!CTA.state.settings.autoJournal && entry.auto) return;
    CTA.state.journal.unshift(Object.assign({ id: CTA.uid('j'), ts: Date.now(), date: CTA.today(), tags: [] }, entry));
    CTA.save();
  };

  /* boot */
  CTA.start = function () {
    CTA.Q_INDEX = {}; (CTA.QUESTIONS || []).forEach((q) => { CTA.Q_INDEX[q.id] = q; });
    CTA.EX_INDEX = {}; (CTA.EXERCISES || []).forEach((e) => { CTA.EX_INDEX[e.id] = e; });
    CTA.L_INDEX = {}; (CTA.LESSONS || []).forEach((l) => { CTA.L_INDEX[l.id] = l; });
    CTA.glossaryIndex = {}; (CTA.GLOSSARY || []).forEach((g) => { CTA.glossaryIndex[g.term.toLowerCase()] = g; (g.alias || []).forEach((a) => { CTA.glossaryIndex[a.toLowerCase()] = g; }); });
    CTA.buildShell();
    CTA.render();
  };
})();

</script>
<script>
/* js/progress.js */
/* Commodity Trading Academy — learning path & mastery engine
 * Mastery-based progression: a lesson counts as complete only when its check quiz is passed
 * (>= 70%). A stage is mastered when all its lessons (and activities) are complete; the next
 * stage unlocks when the previous one is mastered (unless "free navigation" is enabled).
 */
(function () {
  'use strict';
  const CTA = window.CTA;
  CTA.TOPICS = {
    foundations: 'Business foundations', accounting: 'Accounting', markets: 'Global markets', gold: 'Gold', wheat: 'Wheat', sugar: 'Sugar', steel: 'Steel',
    physical: 'Physical trading', finance: 'Trade finance', incoterms: 'Incoterms', documents: 'Documents', logistics: 'Logistics & shipping', derivatives: 'Futures & hedging',
    options: 'Options', spreads: 'Spreads & arbitrage', analysis: 'Market analysis', quant: 'Quantitative methods', risk: 'Risk management', negotiation: 'Negotiation',
  };
  CTA.STAGES = [
    { n: 1, title: 'Business & commodity foundations', desc: 'What commodities are, who trades them, the instruments, price formation, deal economics, risk types and the accounting every trader must read.', lessons: ['f-commodity', 'f-participants', 'f-instruments', 'f-pricing', 'f-economics', 'f-risk', 'f-accounting'] },
    { n: 2, title: 'Market structures & price formation', desc: 'The value chain from mine or farm to end user, trade flows, macro drivers, logistics-driven price differences and how to tell a temporary move from a structural change.', lessons: ['m-valuechain', 'm-flows', 'm-macro', 'm-logistics-prices', 'm-shocks'] },
    { n: 3, title: 'Gold, wheat, sugar & steel fundamentals', desc: 'Product knowledge for the four commodities: specifications, units, supply chains, instruments and the drivers specific to each market.', lessons: ['g-basics', 'g-instruments', 'g-drivers', 'w-basics', 'w-markets', 's-basics', 's-markets', 'st-basics', 'st-specs', 'st-markets'] },
    { n: 4, title: 'Physical commodity trading', desc: 'The 25-step physical deal workflow and how it differs for bullion, grain, sugar and steel.', lessons: ['p-workflow', 'p-gold', 'p-wheat', 'p-sugar', 'p-steel'] },
    { n: 5, title: 'Trade finance, contracts & logistics', desc: 'Contracts and documents, payment methods, letters of credit under UCP 600, Incoterms 2020, shipping and cargo operations.', lessons: ['t-contracts', 't-payments', 't-lc', 't-incoterms', 'l-shipping', 'l-operations'] },
    { n: 6, title: 'Futures, options & hedging', desc: 'Exchange contract mechanics, margin, hedging and basis risk, options and Greeks, spreads and arbitrage.', lessons: ['d-futures', 'd-hedging', 'd-options', 'd-spreads'] },
    { n: 7, title: 'Market analysis & quantitative methods', desc: 'Supply-and-demand balances, technical indicators as descriptive tools, statistics of returns, VaR, Expected Shortfall and their limits.', lessons: ['a-fundamental', 'a-technical', 'a-quant', 'a-risk-models'] },
    { n: 8, title: 'Risk management & negotiation', desc: 'Risk frameworks, limits, stress testing, residual risk of hedges and commercial negotiation of complete deals.', lessons: ['r-framework', 'r-limits', 'n-negotiation'] },
    { n: 9, title: 'Full commercial deal simulations', desc: 'Run complete physical deals in each commodity, negotiate a contract and operate the trading company.', lessons: [], activities: [
      { id: 'sim-gold', label: 'Complete a physical gold deal in the Physical Trading Simulator', test: () => CTA.progress.simDone('gold'), go: 'physical/workflow' },
      { id: 'sim-wheat', label: 'Complete a physical wheat deal', test: () => CTA.progress.simDone('wheat'), go: 'physical/workflow' },
      { id: 'sim-sugar', label: 'Complete a physical sugar deal', test: () => CTA.progress.simDone('sugar'), go: 'physical/workflow' },
      { id: 'sim-steel', label: 'Complete a physical steel deal', test: () => CTA.progress.simDone('steel'), go: 'physical/workflow' },
      { id: 'nego', label: 'Close at least one negotiation in the Deal Room', test: () => (CTA.state.negotiations || []).some((n) => n.outcome === 'agreed'), go: 'dealroom' },
      { id: 'company', label: 'Operate the trading company for 6 simulated months', test: () => !!(CTA.state.company && CTA.state.company.month >= 6), go: 'physical/company' },
    ] },
    { n: 10, title: 'Final professional trading assessment', desc: 'Pass the eleven subject examinations and the full commodity trading case examination.', lessons: [], activities: [
      { id: 'exams', label: 'Pass all 11 subject examinations (70%+)', test: () => CTA.progress.examsPassed() >= 11, go: 'exams' },
      { id: 'final', label: 'Pass the full commodity trading case (exam 12)', test: () => CTA.progress.examPassed('final-case'), go: 'exams/final-case' },
    ] },
  ];

  const P = (CTA.progress = {});
  P.lessonDone = (id) => !!(CTA.state.lessons[id] && CTA.state.lessons[id].done);
  P.simDone = (com) => (CTA.state.physical.completed || []).some((d) => d.commodity === com);
  P.examPassed = (id) => !!(CTA.state.exams[id] && CTA.state.exams[id].passed);
  P.examsPassed = () => Object.keys(CTA.state.exams).filter((k) => k !== 'final-case' && CTA.state.exams[k].passed).length;
  P.stageOf = (lessonId) => CTA.STAGES.findIndex((s) => s.lessons.includes(lessonId));
  P.stageStatus = function (i) {
    const s = CTA.STAGES[i];
    const ld = s.lessons.filter(P.lessonDone).length;
    const acts = (s.activities || []).map((a) => ({ a, ok: !!a.test() }));
    const ad = acts.filter((x) => x.ok).length;
    const total = s.lessons.length + acts.length;
    const done = ld + ad;
    return { lessonsDone: ld, lessonsTotal: s.lessons.length, acts, done, total, pct: total ? done / total * 100 : 0, mastered: total > 0 && done === total };
  };
  P.stageUnlocked = function (i) {
    if (i === 0 || CTA.state.settings.freeNav) return true;
    return P.stageStatus(i - 1).mastered;
  };
  P.lessonUnlocked = (id) => { const i = P.stageOf(id); return i < 0 || P.stageUnlocked(i); };
  P.overall = function () {
    let done = 0, total = 0;
    CTA.STAGES.forEach((_, i) => { const s = P.stageStatus(i); done += s.done; total += s.total; });
    return total ? done / total * 100 : 0;
  };
  P.nextLesson = function () {
    for (let i = 0; i < CTA.STAGES.length; i++) {
      if (!P.stageUnlocked(i)) return null;
      const id = CTA.STAGES[i].lessons.find((l) => !P.lessonDone(l));
      if (id) return CTA.L_INDEX[id];
    }
    return null;
  };
  P.currentStage = function () {
    for (let i = 0; i < CTA.STAGES.length; i++) if (!P.stageStatus(i).mastered) return i;
    return CTA.STAGES.length - 1;
  };
  P.completeLesson = function (id, pct) {
    const l = CTA.state.lessons[id] || { visits: 0 };
    const was = l.done;
    l.best = Math.max(l.best || 0, pct); l.done = l.done || pct >= 70; l.ts = Date.now();
    CTA.state.lessons[id] = l; CTA.save();
    if (l.done && !was) {
      CTA.log('Mastered lesson: ' + ((CTA.L_INDEX[id] || {}).title || id), 'lesson');
      const si = P.stageOf(id);
      if (si >= 0 && P.stageStatus(si).mastered) { CTA.toast(`Stage ${si + 1} mastered — stage ${si + 2} unlocked.`, 'ok'); CTA.log(`Stage ${si + 1} mastered`, 'stage'); }
    }
    CTA.updateTopStats();
    return l.done;
  };
  /* accuracy by topic across quiz questions and numeric exercises */
  P.topicStats = function () {
    const t = {};
    Object.keys(CTA.TOPICS).forEach((k) => { t[k] = { qc: 0, qn: 0, ec: 0, en: 0 }; });
    Object.entries(CTA.state.answers).forEach(([id, a]) => { const q = CTA.Q_INDEX[id]; if (!q || !t[q.t]) return; t[q.t].qn += a.n; t[q.t].qc += a.c; });
    Object.entries(CTA.state.exercises).forEach(([id, a]) => { const e = CTA.EX_INDEX[id]; if (!e || !t[e.topic]) return; t[e.topic].en += a.n; t[e.topic].ec += a.c; });
    Object.values(t).forEach((x) => { x.n = x.qn + x.en; x.c = x.qc + x.ec; x.acc = x.n ? x.c / x.n * 100 : null; });
    return t;
  };
  P.weakTopics = function () {
    const ts = P.topicStats();
    return Object.entries(ts).filter(([, x]) => x.n >= 3 && x.acc < 65).sort((a, b) => a[1].acc - b[1].acc).map(([k, x]) => ({ topic: k, label: CTA.TOPICS[k], acc: x.acc, n: x.n }));
  };
})();

</script>

<script>
/* js/data/glossary.js */
/* Glossary — definitions are educational summaries. Legal or exchange definitions may differ; check the governing contract or rulebook. */
(function () {
  const G = [
    // ---------------- general / foundations
    ['Commodity', 'Foundations', 'A raw or primary product that is largely interchangeable with other units of the same grade, so it can be bought and sold on standard terms (e.g. wheat of a given class, gold of a given fineness).'],
    ['Fungibility', 'Foundations', 'The property of being interchangeable unit-for-unit within the same specification. It is what makes standard contracts and exchange trading possible.'],
    ['Physical trading', 'Foundations', 'Buying and selling the actual goods, with delivery, logistics, documents, quality and payment obligations.'],
    ['Financial exposure', 'Foundations', 'Gaining or hedging price exposure through instruments (futures, options, swaps, ETFs) without necessarily handling the goods.'],
    ['Spot', 'Foundations', 'Trading for immediate or near-immediate delivery, at the current market price (the spot price).', ['spot market', 'spot price']],
    ['Forward contract', 'Foundations', 'A private (OTC) agreement to buy or sell a quantity at an agreed price on a future date. Customisable but carries counterparty risk.', ['forward']],
    ['Futures contract', 'Derivatives', 'A standardised, exchange-traded agreement to buy or sell a defined quantity and quality at a future date, cleared through a clearing house with daily margining.', ['futures']],
    ['Option', 'Derivatives', 'A contract giving the buyer the right, but not the obligation, to buy (call) or sell (put) an underlying at the strike price, in exchange for a premium.', ['options']],
    ['Swap', 'Derivatives', 'An OTC agreement to exchange cash flows, e.g. pay a fixed commodity price and receive the floating average price, settled in cash.'],
    ['OTC', 'Foundations', 'Over-the-counter: trades agreed bilaterally between counterparties rather than on an exchange. Flexible terms, but counterparty credit risk unless collateralised or cleared.', ['over-the-counter']],
    ['Exchange', 'Foundations', 'A regulated marketplace that lists standardised contracts, publishes prices and (with its clearing house) guarantees performance of trades.', ['commodity exchange']],
    ['Clearing house', 'Derivatives', 'The central counterparty that becomes buyer to every seller and seller to every buyer, collecting margin to manage default risk.'],
    ['Physical delivery', 'Derivatives', 'Settlement of a contract by transferring the actual commodity (or a warehouse receipt / delivery instrument) at expiry.'],
    ['Cash settlement', 'Derivatives', 'Settlement of a contract by paying the price difference in money, with no transfer of goods.'],
    ['Bid', 'Foundations', 'The highest price a buyer is currently willing to pay.'],
    ['Ask', 'Foundations', 'The lowest price a seller is currently willing to accept. Also called the offer.', ['offer']],
    ['Bid-ask spread', 'Foundations', 'The difference between the ask and the bid. A cost of trading and a gauge of liquidity.', ['spread (bid-ask)']],
    ['Liquidity', 'Foundations', 'How easily a position can be bought or sold quickly in size without moving the price much.'],
    ['Volume', 'Foundations', 'The number of contracts or units traded in a period.'],
    ['Open interest', 'Derivatives', 'The number of futures or options contracts outstanding (not yet closed or delivered).'],
    ['Price discovery', 'Foundations', 'The process by which buyers and sellers, through their bids and offers, establish a market price that reflects available information.'],
    ['Supply and demand', 'Foundations', 'The interaction between how much producers will sell and buyers will purchase at each price; imbalances move prices and inventories.'],
    ['Inventory', 'Foundations', 'Stocks of a commodity held by producers, traders, processors, consumers or governments. Low inventories make prices more sensitive to shocks.', ['stocks']],
    ['Production cost', 'Foundations', 'What it costs a producer to grow, mine or make a unit; the cost curve shapes long-run price floors.'],
    ['Cost curve', 'Foundations', 'Producers ranked from lowest to highest unit cost. The marginal (highest-cost needed) producer influences the long-run price.'],
    ['Working capital', 'Finance', 'Short-term assets minus short-term liabilities. For a trader: the cash tied up in inventory and receivables, less what suppliers finance.'],
    ['Gross margin', 'Finance', 'Revenue minus the direct cost of goods sold (here: net sales revenue minus landed cost before financing).'],
    ['Net profit', 'Finance', 'Profit after all costs, including financing, selling and overheads attributable to the deal.'],
    ['Return on capital', 'Finance', 'Profit divided by the capital employed to earn it. For deals, often annualised to compare deals of different durations.', ['ROIC', 'return on invested capital']],
    ['Break-even price', 'Finance', 'The selling price per unit at which net profit is exactly zero after all costs.'],
    ['Landed cost', 'Physical', 'The total cost of getting goods to the destination point: purchase price plus all logistics, insurance, inspection, duties, port and financing costs.'],
    ['Counterparty risk', 'Risk', 'The risk that the other party to a contract does not perform — fails to deliver, pay, or honour the terms.'],
    ['Credit risk', 'Risk', 'The risk of loss because a buyer or borrower fails to pay amounts owed.'],

<script>

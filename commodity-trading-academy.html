  L.push({ id: 'f-economics', track: 'foundations', title: 'Deal economics — freight, insurance, financing, margins and return on capital', mins: 40,
    summary: 'Freight, insurance, financing, working capital, gross margin, net profit and return on capital — and why profit per tonne alone is misleading.',
    objectives: ['Build up a deal cost stack without double counting', 'Calculate margins and return on capital', 'Understand working-capital needs'],
    body: `
${K({ t: 'Freight costs', simple: 'Freight is the price of moving the goods — by ship, rail, barge or truck.',
  pro: 'Bulk freight is quoted per metric ton for a voyage (or as a daily time-charter hire); container freight per box. Freight volatility can be extreme and is linked to vessel supply, fuel costs, port congestion and route disruptions. The Incoterm decides who pays and who bears freight-rate risk.',
  why: 'Freight can be 5–20% of delivered value for grains and sugar, so it often decides which origin wins.',
  ex: 'Two wheat origins are 10/t apart FOB; freight to Egypt differs by 15/t, reversing the ranking.',
  num: 'FOB 230 + freight 28 = CFR 258/t. If freight jumps to 40, CFR becomes 270/t.',
  mistake: 'Comparing FOB prices from different origins without adding freight to the same destination.', q: 'k-frt' })}
${K({ t: 'Insurance', simple: 'Cargo insurance pays if the goods are lost or damaged in transit.',
  pro: 'Marine cargo insurance is usually written on Institute Cargo Clauses (A, B or C) with insured value commonly 110% of CIF value. Premiums are a small % of value, but cover terms (exclusions, war/strikes, warehouse-to-warehouse) matter more than price. Trade credit insurance and political-risk insurance are different products.',
  why: 'An uninsured loss on one cargo can exceed a year of trading margins.',
  ex: 'A CIF seller buys ICC (C) cover; the buyer, wanting broader cover, adds ICC (A) for its own account.',
  num: 'Cargo value 5,000,000 CIF; insured 110% = 5,500,000; premium 0.08% = 4,400.',
  mistake: 'Assuming CFR includes insurance, or leaving a gap between seller and buyer cover.', q: 'fe4' })}
${K({ t: 'Financing', simple: 'Traders usually borrow to pay for cargoes until the buyer pays. Interest is a cost of the deal.',
  pro: 'Transactional finance (LC-backed loans, receivables discounting, inventory/borrowing base facilities) lends a percentage of collateral value (advance rate). The cost = interest rate × amount × days/360 (typical money-market day count), plus fees. Longer payment terms and delays directly raise financing cost.',
  why: 'Financing cost scales with time: a 30-day delay on a large cargo is a real loss.',
  ex: 'A trader finances 90% of a 6,000,000 cargo at 7% for 75 days.',
  num: '6,000,000 × 90% × 7% × 75/360 = 78,750.',
  mistake: 'Counting financing in both the landed cost and again in overheads (double counting).', q: 'k-fin' })}
${K({ t: 'Working capital', simple: 'Working capital is the money stuck in the deal: cargo you paid for and invoices your buyers have not paid yet.',
  pro: 'Working capital need = inventory + receivables − payables (supplier credit). It depends on the timing gap between paying suppliers and collecting from buyers. Fast growth, long buyer terms, delays and higher prices all increase it.',
  why: 'Trading companies fail from running out of cash more often than from losing money on paper.',
  ex: 'Paying a supplier at loading and getting paid 60 days after arrival creates a ~90-day gap.',
  num: 'Monthly volume 3 cargoes × 6,000,000; 90-day gap → about 18,000,000 tied up at any time.',
  mistake: 'Accepting long payment terms to win a sale without checking the funding impact.', q: 'fe3' })}
${K({ t: 'Gross margin', simple: 'Gross margin = sales minus the direct cost of the goods sold.',
  pro: 'In this academy: gross margin = net sales revenue − landed cost before financing. It measures the commercial spread captured by the deal. Express it in total, per tonne and as % of revenue.',
  why: 'Gross margin shows whether the trade idea works before funding and overheads.',
  ex: 'Sell 300/t, landed cost before financing 285.81/t → gross margin 14.19/t (4.7%).',
  mistake: 'Calling the difference between buying and selling price "margin" while ignoring logistics.', q: 'k-gm' })}
${K({ t: 'Net profit', simple: 'Net profit is what is left after every cost of the deal.',
  pro: 'Net transaction profit = net sales revenue − total landed cost (incl. financing during the cycle) − selling expenses not already included − extra financing − other deal costs. Each cost must appear only once.',
  why: 'Only net profit pays salaries and builds equity.',
  ex: 'Gross margin 141,920; financing 28,580; selling commission 0 → net 113,340.',
  num: 'Buy 10,000 t at 250 FOB, freight 30/t, insurance 0.1% of 110% CFR, inspection 5,000, port 5/t, financing 6% for 60 days, sell 300/t → net profit 113,339.20 (try it in the Deal Calculator).',
  mistake: 'Leaving out small items (inspection, bank fees, port dues) that add up to the whole margin.', q: 'fe1' })}
${K({ t: 'Return on capital', simple: 'Return on capital tells you how much profit the deal makes for each unit of money tied up.',
  pro: 'ROIC = net profit ÷ equity employed (working capital not funded by banks or suppliers). Annualise by × 365 ÷ cycle days to compare deals. Capital is scarce: traders allocate it to deals with the best risk-adjusted annualised returns.',
  why: 'A small-margin, fast-turning deal can beat a high-margin slow one.',
  num: 'Profit 113,339; working capital 2,858,080; bank funds 80% → equity 571,616; ROIC 19.8% for 60 days ≈ 120% annualised (illustrative).',
  mistake: 'Comparing deals by total profit without considering capital tied up and duration.', q: 'fe2' })}
<div data-widget="dealMini"></div>
` });

  L.push({ id: 'f-risk', track: 'foundations', title: 'Risk types — counterparty, credit, market and operational', mins: 25,
    summary: 'The four core risk families of a trading business and how they show up in real deals.',
    objectives: ['Identify risk types in deal situations', 'Distinguish credit from counterparty performance risk', 'Recognise operational risk triggers'],
    body: `
${K({ t: 'Counterparty risk', simple: 'The risk that the other side does not do what it promised — deliver, pay, perform on time or to spec.',
  pro: 'Counterparty risk includes performance risk (non-delivery, wash-out when prices move against the counterparty), pre-settlement risk (replacement cost of a defaulted forward) and settlement risk (paying before receiving). Exposure grows when prices move in your favour, because the counterparty then has an incentive to default.',
  why: 'Your contract is worthless if the counterparty cannot or will not perform.',
  ex: 'You bought sugar forward at 500; the market rises to 560; the seller "finds a problem" and does not ship. Replacing the cargo costs 60/t.',
  mistake: 'Measuring exposure only by the invoice amount rather than by replacement cost.', q: 'k-cpty' })}
${K({ t: 'Credit risk', simple: 'The risk that a buyer does not pay what it owes.',
  pro: 'Credit risk depends on probability of default, exposure at default and loss given default. Mitigants: payment security (LC, advance payment, documentary collection), credit insurance, guarantees, credit limits, diversification and monitoring of payment behaviour.',
  why: 'One unpaid cargo can be larger than a year\'s margin.',
  ex: 'A buyer on 90-day open account delays payment by 45 days, then files for insolvency.',
  mistake: 'Granting credit because a buyer is large and well known, without financial analysis.', q: 'fr1' })}
${K({ t: 'Market risk', simple: 'The risk of losing money because prices, spreads, currencies or interest rates move.',
  pro: 'Includes flat-price risk, basis/spread risk, currency risk, interest-rate risk and volatility risk (options). Measured by position (tonnes, ounces), sensitivities (delta), VaR and stress tests; controlled by limits and hedging.',
  why: 'Unhedged positions in volatile commodities can generate losses quickly.',
  ex: 'A trader holds 20,000 t of unsold sugar; prices fall 8% in a week.',
  mistake: 'Believing a fully hedged position has no market risk — basis risk remains.', q: 'fr3' })}
${K({ t: 'Operational risk', simple: 'The risk of losses from mistakes, failed systems, fraud or external events.',
  pro: 'In physical trading: wrong documents, missed laytime notices, incorrect specs in contracts, warehouse fraud, cyber payment fraud (fake bank details), sanctions breaches, mis-booked trades. Controls: segregation of duties, four-eyes checks, standard contract templates, reconciliations, KYC.',
  why: 'Operational failures can turn a profitable deal into a loss or a legal problem.',
  ex: 'An email from a "supplier" changes bank details; the payment goes to a fraudster.',
  mistake: 'Treating paperwork as administration rather than risk control.', q: 'fr2' })}
${CTA.callout('warn', 'Risk interacts', 'Risks compound: a price fall (market risk) makes a buyer reluctant to take delivery (counterparty risk), who then raises quality claims (operational/legal risk) and delays payment (credit and liquidity risk). The Risk Management Center lets you stress these together.')}
` });

  L.push({ id: 'f-accounting', track: 'foundations', title: 'Accounting for commodity trading — reading the statements', mins: 50,
    summary: 'Income statement, balance sheet, cash flow, trading P&L, inventory, AP/AR and working-capital reports — and how a profitable trader can still run out of cash.',
    objectives: ['Read the three main statements of a trading company', 'Understand trading P&L, MTM and inventory reports', 'Explain profit vs cash with numbers'],
    body: `
<p>Every trading decision ends up in the accounts. You need to read them as a trader (what is our exposure and liquidity?) and as a credit analyst (can this counterparty pay?). The figures below are for a <b>fictional</b> company, <b>Meridian Commodities Ltd</b> ${SIM}.</p>
<h2>1. Income statement (profit and loss)</h2>
${K({ t: 'Income statement', simple: 'Shows sales, costs and profit over a period — when goods were delivered, not when cash moved.',
  pro: 'For traders, revenue is large and margins thin, so the key lines are gross margin (trading result), operating expenses, finance costs and taxes. Revenue alone says little; a 2% gross margin is normal. Watch finance costs relative to gross margin and whether results depend on unrealised MTM gains.',
  why: 'Tells you whether the business model earns money over time.',
  mistake: 'Judging a trader by revenue size.', q: 'fa1' })}
${CTA.table(['Meridian Commodities — Income statement, year 1', 'USD'], [
  ['Revenue (cargo sales)', '412,600,000'], ['Cost of goods sold (purchases + logistics)', '(401,200,000)'], ['<b>Gross margin</b>', '<b>11,400,000</b> (2.8%)'],
  ['Unrealised MTM on open positions (net)', '650,000'], ['Operating expenses (staff, offices, systems)', '(5,100,000)'], ['Finance costs (trade finance interest & fees)', '(3,900,000)'],
  ['<b>Profit before tax</b>', '<b>3,050,000</b>'], ['Tax', '(610,000)'], ['<b>Net profit</b>', '<b>2,440,000</b>'],
])}
<h2>2. Balance sheet</h2>
${K({ t: 'Balance sheet', simple: 'A snapshot of what the company owns (assets), owes (liabilities) and the owners\' stake (equity).',
  pro: 'Trading balance sheets are dominated by current assets (inventories, receivables, derivative assets, margin deposits) funded by short-term bank lines and payables. Key ratios: equity/total assets, current ratio, net debt to equity, and how much of inventory is "readily marketable" (hedged, liquid).',
  why: 'Shows whether the company can absorb losses and how dependent it is on short-term funding.',
  mistake: 'Ignoring that most debt is short-term and must be rolled over by banks.', q: 'k-bs' })}
${CTA.table(['Meridian — Balance sheet at year end', 'USD', 'Liabilities & equity', 'USD'], [
  ['Cash', '4,200,000', 'Trade payables', '18,600,000'], ['Trade receivables', '41,300,000', 'Short-term bank lines', '52,800,000'], ['Inventories (at market, hedged)', '38,900,000', 'Derivative liabilities', '1,900,000'],
  ['Margin deposits with brokers', '3,100,000', 'Other liabilities', '2,100,000'], ['Derivative assets', '2,400,000', '<b>Equity</b>', '<b>16,500,000</b>'], ['Fixed assets', '2,000,000', '', ''],
  ['<b>Total assets</b>', '<b>91,900,000</b>', '<b>Total liabilities & equity</b>', '<b>91,900,000</b>'],
])}
<p>Equity is only 18% of assets: losses of 16.5m would wipe it out. Banks fund most of the receivables and inventory, so lender confidence is critical.</p>
<h2>3. Cash flow statement</h2>
${K({ t: 'Cash flow statement', simple: 'Explains how cash changed: from operations, investments and financing.',
  pro: 'Operating cash flow = profit adjusted for non-cash items (MTM) and changes in working capital. For growing traders, OCF is often negative because inventory and receivables grow faster than payables; the gap is financed by bank borrowing (financing cash flow).',
  why: 'Reveals whether profits are turning into cash, or being absorbed by working capital.',
  mistake: 'Celebrating profit while operating cash flow is deeply negative.', q: 'fa3' })}
${CTA.table(['Meridian — Cash flow statement, year 1', 'USD'], [
  ['Net profit', '2,440,000'], ['Less unrealised MTM gains (non-cash)', '(650,000)'], ['Increase in inventories', '(14,200,000)'], ['Increase in receivables', '(17,900,000)'], ['Increase in payables', '6,300,000'],
  ['<b>Operating cash flow</b>', '<b>(24,010,000)</b>'], ['Capex', '(400,000)'], ['Net bank borrowing', '24,800,000'], ['<b>Change in cash</b>', '<b>390,000</b>'],
])}
<h2>4. Trading P&L, inventory, AP/AR and working-capital reports</h2>
${K({ t: 'Trading P&L report', simple: 'An internal daily report showing profit or loss by book, commodity and deal — including open positions valued at today\'s prices.',
  pro: 'Splits realised vs unrealised, physical vs derivatives, and explains daily changes (price, basis, FX, new deals, cost accruals). Physical and hedge results are shown together so the desk sees net economic exposure.',
  why: 'It is how management sees risk and performance every day.', mistake: 'Looking at the physical book and the hedge book separately and panicking about a loss that is offset.', q: 'k-tpl' })}
${CTA.table(['Desk', 'Physical MTM', 'Hedge MTM', 'Net', 'Realised YTD'], [['Wheat', '−420,000', '+395,000', '−25,000', '1,840,000'], ['Sugar', '+310,000', '−298,000', '+12,000', '960,000'], ['Steel', '+85,000', '0 (unhedged)', '+85,000', '410,000'], ['Gold', '−60,000', '+58,500', '−1,500', '230,000']])}
${K({ t: 'Inventory report', simple: 'Lists the stock you own: where it is, how much, what quality, its cost and its market value, and whether it is hedged or pledged to a bank.',
  pro: 'Inventory may be valued at cost/NRV or at fair value (common for commodity traders under applicable standards). The report should reconcile physical quantities (warehouse receipts, surveys) to the books, show pledges and ageing, and flag quality or location issues.',
  why: 'Inventory is often pledged as collateral; mismatches are a classic fraud and loss source.', mistake: 'Trusting book quantities without independent warehouse confirmations.', q: 'k-inv' })}
${CTA.table(['Location', 'Commodity', 'Qty', 'Cost/unit', 'Market/unit', 'Hedged', 'Pledged to'], [['Constanța silo (fict.)', 'Milling wheat 12.5%', '18,000 t', '238', '231', '100%', 'Bank A'], ['Santos warehouse (fict.)', 'Raw sugar VHP', '12,500 t', '452', '461', '90%', 'Bank B'], ['Antwerp yard (fict.)', 'Rebar B500B 12–25 mm', '3,200 t', '585', '598', '0%', '—'], ['Zurich vault (fict.)', 'Gold 1 kg bars 999.9', '120 kg', '63,900/kg', '64,350/kg', '100%', '—']])}
${K({ t: 'Accounts payable, receivable and working capital reports', simple: 'AR shows who owes you and how overdue; AP shows whom you owe and when; the working-capital report adds inventory and shows the cash tied up.',
  pro: 'AR ageing (current, 1–30, 31–60, 60+ days) flags credit deterioration. AP schedules show upcoming cash needs. Working-capital reports translate both into days (DSO, DIO, DPO) and the cash conversion cycle; treasury uses them to size bank lines.',
  why: 'Overdue receivables and large upcoming payables are early warnings of a liquidity squeeze.', mistake: 'Ignoring a buyer who pays later each month.', q: 'fa4' })}

<h2>Seasonality and production cycles</h2>
<p><b>Wheat</b>: Northern Hemisphere winter wheat is planted in autumn and harvested in early-to-mid summer; spring wheat is planted in spring and harvested late summer. Southern Hemisphere (Australia, Argentina) harvests around November–January. Fresh harvest supply often pressures nearby prices in the harvest window, while pre-harvest periods are sensitive to weather news.</p>
<p><b>Sugar</b>: Brazil Centre-South cane is crushed roughly April–November; India and Thailand crush roughly October/November to April; EU beet campaigns run autumn to early winter. Cane is a semi-perennial crop (multiple ratoon harvests from one planting), so area responds slowly to prices.</p>
<p><b>Steel</b>: production is continuous, but demand is seasonal with construction (lower in cold winters or monsoon seasons in some regions; holiday periods such as Lunar New Year affect Chinese demand).</p>
<p><b>Gold</b>: mine supply is steady; demand shows seasonal jewellery patterns (festival and wedding seasons in India, Lunar New Year in China).</p>
<h2>Weather risk</h2>
<ul><li><b>Drought</b> during critical growth stages cuts yields (wheat grain fill, cane growth).</li><li><b>Excess rain at harvest</b> damages quality (sprouting in wheat → low falling number) and interrupts cane crushing.</li><li><b>Frost</b> can damage wheat at heading and cane.</li><li><b>Climate patterns</b> such as El Niño / La Niña shift rainfall probabilities across Australia, South and Southeast Asia and South America — useful for scenario thinking, not certainties.</li></ul>
<h2>Inventory cycles</h2>
<p>High prices encourage production and ration demand → stocks build → prices fall → production is cut → stocks draw → prices rise. Cycle length depends on how fast supply responds: one season for annual crops, several years for mines, cane and steel capacity.</p>

<h2>Currency effects</h2>
<p>Most internationally traded commodities are priced in US dollars. Two effects follow: (1) a stronger USD makes commodities more expensive in other currencies, which can reduce demand, and (2) producers with local-currency costs earn more local currency when their currency weakens, which can encourage exports.</p>
<div class="numbox"><b>Numbers</b> ${SIM}<div>Wheat CFR Alexandria 280 USD/t. At 30 EGP/USD the local cost is 8,400 EGP/t; at 48 EGP/USD it is 13,440 EGP/t — a 60% increase with no change in the USD price.</div></div>
<h2>Interest rates</h2>
<p>Rates affect commodities through: the cost of carrying inventory (financing), the shape of forward curves (higher rates → wider full-carry contango), the opportunity cost of holding non-yielding assets like gold, the USD exchange rate and economic activity (demand).</p>
<h2>Geopolitics and policy</h2>
<ul>
<li><b>Import duties and tariffs</b> raise landed costs and redirect flows. Duty is usually a % of customs value (CIF in many jurisdictions; some use FOB-type valuation).</li>
<li><b>Export restrictions</b> (bans, quotas, taxes, minimum export prices) reduce available world supply, raise world prices and depress domestic prices in the restricting country. ${HIST} Examples: Russia\'s 2010 grain export ban after drought; India\'s May 2022 wheat export restrictions; India\'s 2022 move of sugar exports into a "restricted" category.</li>
<li><b>Government stockpiles and subsidies</b> can absorb or release supply and support production.</li>
<li><b>Trade remedies</b> (anti-dumping, countervailing duties, safeguards) are especially common in steel. ${HIST} The US imposed 25% Section 232 tariffs on many steel imports in 2018; the EU introduced steel safeguard measures in 2018–2019.</li>
</ul>
<h2>Sanctions and trade compliance</h2>
<p>Sanctions regimes (for example UN, EU, UK, US) restrict dealings with designated countries, entities, individuals, vessels and goods. Obligations can extend to entities owned or controlled by designated parties. A professional trader:</p>
<ol><li>Screens counterparties, beneficial owners, banks, vessels and ports against applicable lists.</li><li>Checks goods and destinations for export controls.</li><li>Watches red flags: unusual routing, ship-to-ship transfers, AIS gaps on vessels, last-minute changes of buyer or destination, payment from third parties.</li><li>Escalates to compliance and documents decisions.</li></ol>
${CTA.callout('bad', 'Important', 'This is an educational overview, not legal advice. Sanctions rules change frequently and differ by jurisdiction. Real decisions require qualified compliance and legal counsel.')}

    body: `
<h2>Benchmarks</h2>
<p>Physical contracts are often priced against a benchmark: an exchange futures price (gold, grains, raw and white sugar), an over-the-counter reference price (e.g. the LBMA Gold Price auction) or an assessment published by a price reporting agency (common for steel products and freight). The physical price = benchmark ± differential for quality, location and timing.</p>
<h2>Regional price differences</h2>
<p>The difference between two regions is bounded by the cost of moving goods between them. If destination price − origin price &gt; full transfer cost, traders ship until the gap narrows; if it is lower, flows stop or reverse. Transfer cost includes freight, insurance, duties, handling, financing for the voyage, quality adjustments and currency costs.</p>
<div data-widget="miniArb"></div>
<h2>Freight markets and bottlenecks</h2>
<p>Dry-bulk freight is set by vessel supply versus cargo demand, fuel prices, route lengths and congestion. Canal restrictions or diversions lengthen voyages, effectively removing ship capacity. Port congestion leaves ships waiting (demurrage) and can raise freight rates for whole regions.</p>
<h2>Warehousing</h2>
<p>Storage provides time arbitrage: if the forward price exceeds spot by more than storage, insurance and financing, holding stock is profitable (cash-and-carry). Warehouse receipts can be financed — and are a known fraud vector (duplicate or fake receipts), so collateral managers and inspections are used.</p>
` });

<h2>Shocks</h2>
<p><b>Supply shocks</b>: droughts, floods, mine accidents, strikes, wars, export bans. <b>Demand shocks</b>: recessions, stimulus programmes, sudden policy changes, pandemics. The price impact depends on inventories, elasticity, expectations and how long the shock lasts.</p>
<h2>Substitution</h2>
<p>When one commodity becomes expensive, users switch where possible: feed wheat ↔ corn/barley; cane ↔ beet sugar (and sweeteners like HFCS in some markets); scrap ↔ pig iron/DRI in EAFs; gold jewellery buyers shift to lighter pieces or lower karats. Substitution caps price spikes at the margin.</p>
<h2>Temporary or structural? A checklist</h2>
<ol><li><b>Duration</b>: will the cause last beyond one season/production cycle?</li><li><b>Capacity</b>: has productive capacity been added or removed permanently?</li><li><b>Policy</b>: is the policy change institutionalised (laws, long-term programmes) or a short emergency measure?</li><li><b>Technology/demand trends</b>: is demand changing because of technology or regulation (e.g. EAF shift in steel)?</li><li><b>Inventories</b>: are stocks rebuilding as expected after the shock?</li><li><b>Forward curve</b>: is the whole curve moving (structural) or only the front (temporary tightness)?</li><li><b>Cost curve</b>: has the marginal cost of supply changed?</li></ol>

` });

<h2>From ore to bar</h2>
<p>Gold is mined from hard-rock deposits (open-pit or underground) and alluvial deposits. Ore grades are measured in grams per tonne; many mines process ore with only a few grams of gold per tonne. Processing (crushing, grinding, leaching, smelting) produces <b>doré</b> — an alloy typically containing gold with silver and other metals — which is shipped to a <b>refiner</b>. Refiners produce high-purity bars and grain. Secondary supply comes from <b>recycling</b> of jewellery and, to a smaller extent, electronics; recycling rises when prices are high or when households need cash.</p>

${T(['Expression', 'Meaning', 'Gold content'], [['999.9 ("four nines")', 'Parts per thousand', '99.99%'], ['995.0', 'Minimum for large LBMA Good Delivery gold bars', '99.50%'], ['24 karat', '24/24', '≈ 99.9%+'], ['22 karat', '22/24', '91.67%'], ['18 karat', '18/24', '75.0%'], ['14 karat', '14/24', '58.33%']])}

<h2>Main drivers</h2>
${T(['Driver', 'Typical relationship', 'Caveat'], [
  ['US dollar', 'Stronger USD tends to weigh on gold (priced in USD)', 'Both can rise together in stress'],
  ['Real interest rates', 'Higher real yields raise the opportunity cost of holding gold', 'The relationship has weakened at times, e.g. when central-bank buying was strong'],
  ['Inflation expectations', 'Higher expected inflation can support gold as a store of value', 'Over short periods correlation is unstable'],
  ['Central bank policy & purchases', 'Official sector buying adds demand; policy affects rates and USD', 'Purchases are reported with lags'],
  ['Geopolitical risk', 'Safe-haven buying in uncertainty', 'Liquidity squeezes can force selling'],
  ['Investor positioning', 'Crowded long positions can amplify falls', 'Positioning data are partial'],
  ['Physical demand (jewellery)', 'Price-sensitive; supports dips in key markets', 'Seasonal'],
])}
<h2>Why gold can fall during geopolitical or financial stress</h2>
<ol><li><b>Liquidity needs</b>: investors facing margin calls sell what they can — gold is liquid. ${HIST} autumn 2008 and March 2020 saw sharp temporary declines.</li><li><b>USD strength</b>: crises often trigger flight to the USD.</li><li><b>Rising real rates</b>: if a crisis brings policy tightening.</li><li><b>Priced in</b>: if the risk was already anticipated, the event can trigger "sell the news".</li><li><b>Positioning</b>: crowded longs unwind.</li></ol>
<h2>Forward curve, lease rates and basis</h2>
<p>Gold is held in large above-ground stocks, so its forward price normally reflects <b>cost of carry</b>: forward ≈ spot × (1 + (interest rate − lease rate) × t) (plus storage/insurance in some calculations). The <b>lease rate</b> is what borrowers pay to borrow physical gold; when it spikes, physical metal is scarce and forwards can fall below full carry, occasionally into backwardation. The <b>futures basis</b> (futures − spot) therefore embeds rates, lease rates and location/logistics (e.g. differences between London and New York during transport disruptions).</p>
<div class="numbox"><b>Numbers</b> ${SIM}<div>Spot 2,000; USD rate 5%; lease rate 1%; 90 days: fair forward ≈ 2,000 × (1 + 4% × 90/360) = 2,020. If futures trade at 2,032, a cash-and-carry (buy spot, sell futures, finance) earns about 12/oz before costs — if financing, storage and delivery logistics allow.</div></div>
<h2>Regional premiums and discounts</h2>
<p>Local prices = international benchmark (converted to local currency) ± premium. Premiums rise with strong local demand, import restrictions or logistics problems; discounts appear when local demand is weak, duties change, or there is excess local supply. Premiums also differ by product: small bars and coins carry fabrication and distribution costs.</p>
<div data-widget="goldDrivers"></div>
` });

  L.push({ id: 'w-basics', track: 'wheat', title: 'Wheat — classes, quality, crop cycle, storage and milling', mins: 45,

    objectives: ['Explain how quality affects price and contract acceptance', 'Calculate moisture shrink and protein adjustments', 'Describe the grain logistics chain'],
    body: `
<h2>Varieties and classes</h2>
<p>Wheat classes combine growing season (winter vs spring), kernel hardness (hard vs soft) and colour (red vs white). <b>Hard</b> wheats generally have higher protein and suit bread; <b>soft</b> wheats suit cakes, biscuits and pastries; <b>durum</b> (very hard) is used for pasta and semolina. Each exporting country has its own grading system and class names — never assume equivalence without checking specifications.</p>
<h2>Milling vs feed wheat</h2>
<p>Milling wheat must meet quality thresholds (protein, gluten strength, falling number, test weight, low damage and foreign material). Wheat that fails — e.g. rain-damaged at harvest — goes to the <b>feed</b> market, where it competes with corn and barley on energy value. The price gap between milling and feed wheat can be large in years with poor harvest weather.</p>
<h2>Key quality parameters</h2>
${T(['Parameter', 'What it measures', 'Commercial effect'], [
  ['Protein (% on a stated moisture basis)', 'Baking strength', 'Premiums/discounts per 0.1–0.5% vs. base; minimum levels for acceptance'],
  ['Moisture (%)', 'Water content', 'Maximums (often around 13–14.5%); excess = paying for water + spoilage risk'],
  ['Test weight (kg/hl or lb/bu)', 'Bulk density/kernel soundness', 'Flour extraction; minimums by grade'],
  ['Falling number (s)', 'Sprout damage', 'Low values → rejection for bread flour'],
  ['Foreign material, broken kernels, damaged kernels', 'Cleanliness', 'Grade limits; discounts'],
  ['Mycotoxins (e.g. DON)', 'Fungal toxins', 'Food-safety limits set by importing countries'],
])}
<div data-widget="wheatQuality"></div>
<h2>Crop cycle, yields and costs</h2>
<p>Winter wheat is sown in autumn, overwinters, and is harvested in early-to-mid summer; spring wheat is sown in spring. Yield per hectare depends on rainfall, temperature, soils and inputs; it varies greatly by country. Production cost per tonne = cost per hectare ÷ yield: a bad yield year raises unit costs sharply. ${SIM} Example: costs 650/ha at 6.5 t/ha = 100/t; at 4.5 t/ha = 144/t.</p>
<h2>Storage, elevators and spoilage</h2>
<p>Farmers deliver to <b>country elevators</b> (inland), where grain is sampled, graded, dried if needed and stored in <b>silos</b> segregated by quality. Grain moves by truck, rail or barge to <b>port terminals</b> (export elevators) that load ships. Risks: moisture and heat causing mould, insects, mixing of qualities, shrink, and documentation errors on warehouse receipts. Aeration, fumigation and stock rotation manage quality.</p>
<h2>Milling and demand</h2>
<p>Flour mills grind wheat into flour (extraction often around 72–78% depending on flour type) and by-products (bran, middlings) for feed. Mills blend wheats to hit flour specifications. Demand segments: <b>food</b> (bread, noodles, pasta, biscuits — relatively stable, population-driven), <b>feed</b> (price-sensitive, substitutable) and <b>industrial</b> (starch, ethanol). Many importing countries have state buyers that purchase via public tenders.</p>
` });

<p>For a country or the world over a marketing year: <b>Ending stocks = Beginning stocks + Production + Imports − Consumption (food, feed, seed, industrial, waste) − Exports</b>. The <b>stocks-to-use ratio</b> = ending stocks ÷ total use. At world level imports ≈ exports, so the balance reduces to stocks + production − consumption.</p>

<ul><li><b>Exportable surplus</b> matters more than total stocks. Stocks held by countries that rarely export (or in government reserves) do not supply the world market.</li><li><b>Revisions</b>: each monthly report revises estimates; markets react to the surprise versus expectations.</li><li><b>Crop conditions and weather forecasts</b> update yield expectations before harvest; satellite and field data help but uncertainty is high until harvest.</li><li><b>Food security policies</b>: governments build stocks, subsidise bread, or restrict exports when domestic prices rise.</li></ul>

<p>No report perfectly predicts prices: they are estimates, anticipated by the market, and prices also respond to freight, currencies, policy and positioning.</p>
<h2>Export restrictions, freight and currencies</h2>

<h2>Mill economics</h2>
<p>A simplified BF-BOF raw-material cost per tonne of hot metal combines about 1.5–1.7 t of iron ore and 0.4–0.6 t of coke-equivalent coal (ratios vary by plant — ${ILLU}). An EAF\'s main costs are scrap (around 1.1 t per tonne of liquid steel) and electricity. The <b>spread</b> between finished steel prices and raw-material costs indicates margin pressure.</p>
<div data-widget="millMargin"></div>
<h2>Why pass-through is not immediate or proportional</h2>
<ul><li>Mills buy raw materials on contracts and hold inventories; cost changes arrive with lags.</li><li>Steel prices are set by demand and competition. When demand is weak or capacity is high, mills absorb cost increases (margins shrink); when demand is strong, prices can rise faster than costs.</li><li>Different routes (BF vs. EAF) face different input moves.</li><li>Exports from regions with surplus capacity cap import prices elsewhere.</li></ul>
<h2>Demand drivers</h2>
<p>Construction (property, infrastructure) is the largest end use globally, followed by machinery, automotive, metal products, and energy. Property cycles and infrastructure programmes are key for long products (rebar); manufacturing cycles for flats (HRC, CRC, coated). Capacity utilisation rates indicate pricing power.</p>
<h2>Trade policy</h2>
<p>Steel is heavily affected by trade remedies: anti-dumping and countervailing duties (origin- and sometimes producer-specific), safeguard quotas and tariffs, and carbon-border measures. A trader must determine the HS classification, origin rules and applicable duties before quoting a landed price.</p>
<h2>Regional price differences and inventory cycles</h2>
<p>Steel prices differ by region because of freight, duties, standards and local supply-demand. Distributors\' restocking and destocking amplify demand swings: when prices are expected to rise, distributors buy ahead, and vice versa.</p>
<h2>Hedging steel</h2>
<p>Exchange-traded or cleared contracts exist for certain steel benchmarks (e.g. some HRC, rebar and scrap contracts on exchanges in the USA, Europe/London and China), and OTC swaps reference price assessments. But a specific product, grade, region and delivery timing may not match any benchmark well, and liquidity can be limited. Steel hedging opportunities therefore vary by product, region, benchmark and market liquidity; residual basis risk is usually significant.</p>
` });

<ol><li><b>Buyer requirements</b>: product (e.g. 1 kg bars 999.9), accredited refiners accepted, quantity, delivery location (vault, airport), timing, payment method.</li>
<li><b>Seller verification and due diligence</b>: legal identity, beneficial owners, licences, source of metal (mine/refiner, responsible sourcing documentation), sanctions screening, bank references.</li>
<li><b>Purity and assay</b>: bars from accredited refiners carry refiner stamps, serial numbers and fineness; the bar list must match. For non-standard material, independent assay is required.</li>
<li><b>Weight verification</b>: bars are weighed at delivery; tolerances and rounding rules agreed.</li>
<li><b>Price quotation</b>: benchmark (spot or fixing) + premium/discount per fine oz, fixed at a defined time.</li>
<li><b>Delivery and secure transport</b>: specialised secure logistics, vault-to-vault or airport; risk transfer point defined.</li>
<li><b>Insurance</b>: in-transit and in-vault cover, insured value, exclusions.</li>
<li><b>Payment</b>: delivery-versus-payment where possible (simultaneous transfer of metal and money), or payment against vault receipt / release confirmation. Avoid unsecured advance payments to unknown parties.</li>
<li><b>Custody</b>: allocated storage with bar list; audit rights.</li>
<li><b>Settlement and reconciliation</b>: final weights × fineness × agreed price; reconcile bar list, invoice, vault receipt and payment.</li></ol>
<div class="numbox"><b>Numbers</b> ${SIM}<div>20 bars of 1 kg (999.9). Fine oz = 20 × 32.1507 × 0.9999 = 642.95 oz. Price = 2,000 spot + 1.50 premium = 2,001.50/oz. Invoice = 1,286,866 (rounded). Secure transport 0.05% and insurance 0.02% of value add 901.</div></div>
<h2>Commercial and compliance risks</h2>
<ul><li><b>Fraud</b>: fake or gold-plated bars, fake assay documents, advance-fee scams ("discounted gold from a mine, pay a fee first").</li><li><b>AML/sanctions</b>: illicit origin, sanctioned jurisdictions, cash payments.</li><li><b>Settlement risk</b>: paying before receiving title/metal.</li><li><b>Price risk</b>: between pricing and settlement — hedge with futures/forwards.</li><li><b>Custody risk</b>: unallocated vs allocated title confusion.</li></ul>
${N('bad', 'Red flags', 'Discounts to spot that are "too good", unverifiable refiners, documents only as scans, pressure to pay advance fees, payment to third-party accounts, refusal of independent inspection, unusual delivery locations.')}
${go('gold/cases', 'Gold practical cases')} ${go('physical/workflow', 'Run a gold deal')}
` });

  L.push({ id: 'p-wheat', track: 'wheat', title: 'Physical wheat trading — from inquiry to discharge', mins: 45,

  L.push({ id: 'p-sugar', track: 'sugar', title: 'Physical sugar trading — comparing offers and executing', mins: 40,

  L.push({ id: 'p-steel', track: 'steel', title: 'Physical steel trading — mills, traders, distributors and project buyers', mins: 40,

  L.push({ id: 't-contracts', track: 'finance', title: 'Contracts and trade documents', mins: 40,

  L.push({ id: 't-payments', track: 'finance', title: 'Payment methods and bank instruments', mins: 35,
    summary: 'Advance payment, open account, cash against documents, documentary collections, letters of credit, standby LCs and guarantees; commercial vs documentary vs bank obligations.',
    objectives: ['Rank payment methods by risk for each party', 'Distinguish commercial, documentary and bank obligations', 'Choose payment security for a deal'],
    body: `
${T(['Method', 'How it works', 'Seller risk', 'Buyer risk', 'Cost/complexity'], [
  ['Advance payment', 'Buyer pays before shipment (fully or partly)', 'Lowest', 'Highest (non-delivery)', 'Low; buyer may require an advance payment guarantee'],
  ['Letter of credit (confirmed)', 'Issuing bank + confirming bank undertake to pay against complying documents', 'Low (documentary risk remains)', 'Pays only against documents, not goods', 'Higher fees; strict document handling'],
  ['Letter of credit (unconfirmed)', 'Issuing bank undertakes', 'Issuing-bank and country risk', 'Same', 'Moderate'],
  ['Documentary collection (D/P, CAD)', 'Banks release documents against payment (or acceptance for D/A); no bank undertaking', 'Buyer may refuse documents; goods stranded abroad', 'Pays before inspecting goods', 'Low'],
  ['Open account', 'Seller ships and invoices; buyer pays later', 'Highest (credit)', 'Lowest', 'Lowest; often with credit insurance'],
])}
<h2>Three kinds of obligation</h2>
<ul><li><b>Commercial obligation</b>: under the sales contract — deliver conforming goods, pay the price.</li><li><b>Documentary obligation</b>: present specified documents that comply with the contract/LC.</li><li><b>Bank\'s independent undertaking</b>: under an LC or guarantee, the bank must pay against a complying presentation (or demand), independently of disputes about the goods — subject to fraud exceptions under applicable law.</li></ul>
<p>This independence is why sellers love LCs — and why document accuracy matters so much.</p>
<h2>Standby LCs and guarantees</h2>
<p>An SBLC or demand guarantee secures an obligation and is drawn only if the applicant fails (e.g. buyer does not pay open-account invoices; seller does not perform). Common types: payment guarantee, performance bond, advance-payment guarantee. Standbys are often subject to ISP98 or UCP 600; guarantees to URDG 758 — when the instrument incorporates them.</p>
` });

  L.push({ id: 't-lc', track: 'finance', title: 'Letters of credit and UCP 600', mins: 45,
    summary: 'Parties, steps, examination, discrepancies, presentation periods, expiry, sight vs deferred payment, reimbursement and documentary compliance.',
    objectives: ['Walk through an LC transaction', 'Identify discrepancies', 'Apply key UCP 600 timing rules'],
    body: `
<h2>Parties</h2>
${T(['Party', 'Role'], [['Applicant', 'Buyer who asks its bank to issue the credit'], ['Beneficiary', 'Seller who will be paid'], ['Issuing bank', 'Issues the credit and undertakes to honour a complying presentation'], ['Advising bank', 'Authenticates and advises the credit to the beneficiary; no payment undertaking by itself'], ['Confirming bank', 'Adds its own undertaking (removes issuing bank/country risk for the seller)'], ['Nominated bank', 'Bank authorised to honour or negotiate'], ['Reimbursing bank', 'Pays the claiming bank on the issuing bank\'s behalf, if provided']])}
<h2>Steps</h2>
<ol><li>Sales contract specifies payment by LC and its terms.</li><li>Buyer applies; issuing bank issues the LC (usually via SWIFT MT700) subject to UCP 600.</li><li>Advising (and confirming) bank advises the seller. <b>Seller checks the LC immediately</b> and requests amendments for anything it cannot comply with.</li><li>Seller ships and prepares documents.</li><li>Presentation to the nominated/confirming bank within the presentation period and before expiry.</li><li>Banks examine documents (max five banking days following presentation).</li><li>If complying: honour (sight payment, deferred payment, acceptance) or negotiation. If discrepant: refusal notice, or the applicant may waive.</li><li>Issuing bank reimburses; buyer pays its bank and gets documents to take delivery.</li></ol>
<h2>Key UCP 600 rules (summary)</h2>
<ul><li>Applies only when the credit expressly states it is subject to UCP 600 (art. 1).</li><li>Credits are irrevocable (art. 3); banks deal with documents, not goods (art. 5).</li><li>Examination: max 5 banking days following presentation (art. 14b).</li><li>Transport documents with original copies: present no later than 21 calendar days after shipment if the LC is silent, and not later than expiry (art. 14c).</li><li>Data in a document need not be identical to, but must not conflict with, data in other documents or the credit (art. 14d).</li><li>The invoice description must correspond with the credit (art. 18c); other documents may describe goods in general terms not conflicting with the credit (art. 14e).</li><li>"About"/"approximately" allows ±10% on amount, quantity or unit price (art. 30a); for goods not in packing units/items, ±5% quantity tolerance if the amount is not exceeded (art. 30b).</li></ul>
<h2>Common discrepancies</h2>
<p>Late shipment, late presentation, expired credit, invoice amount above credit, description mismatch, B/L not "clean" or not "on board", wrong consignee/notify party, missing endorsements, insurance cover less than required or dated after shipment, certificate issued by the wrong party, inconsistent weights between invoice and weight certificate.</p>
${N('', 'Practice', 'Find the discrepancies in a simulated LC presentation. ' + go('finance/lc', 'LC discrepancy exercise'))}
` });

  L.push({ id: 't-incoterms', track: 'incoterms', title: 'Incoterms 2020 for commodity trades', mins: 45,
    summary: 'All eleven rules: delivery point, risk transfer, costs, insurance and clearance; sea-only vs any-mode; how to choose and what Incoterms do not cover.',
    objectives: ['Allocate costs and risks under each rule', 'Choose rules suited to bulk vs containers', 'Avoid common Incoterm errors'],
    body: `
<p>Incoterms® rules are published by the International Chamber of Commerce. They define <b>delivery</b> (when the seller has done its job), <b>risk transfer</b>, <b>cost allocation</b>, and <b>export/import clearance</b> duties. They do <b>not</b> define title transfer, payment, or the price, and apply only if the contract incorporates them (e.g. "CIF Alexandria, Incoterms® 2020").</p>
<h2>Two families</h2>
<p><b>Any mode of transport</b>: EXW, FCA, CPT, CIP, DAP, DPU, DDP. <b>Sea and inland waterway only</b>: FAS, FOB, CFR, CIF.</p>
<div data-widget="incotermMini"></div>
<h2>Commodity practice</h2>
<ul><li>Bulk grain and raw sugar: FOB, CFR, CIF dominate. With FOB, the buyer charters the vessel and nominates it; the seller loads within the loading window.</li><li>Containerised cargo (bagged sugar, some steel): FCA, CPT, CIP fit better, because the seller hands over to the carrier at a terminal before loading.</li><li>Under CFR/CIF the seller pays freight to destination but risk passes on loading: the buyer bears transit risk.</li><li>CIF minimum insurance is ICC (C) 110%; CIP is ICC (A) 110% in the 2020 rules.</li><li>DDP requires the seller to clear imports and pay duties in the buyer\'s country — risky for foreign sellers.</li></ul>
${go('finance/incoterms', 'Incoterms comparison tool')}
` });

  L.push({ id: 'l-shipping', track: 'logistics', title: 'Shipping — vessels, freight, chartering, laytime and demurrage', mins: 45,
    summary: 'Bulk carriers, containers, tankers, breakbulk, freight quotes, chartering basics, DWT, freight per tonne, load/discharge rates, laytime, demurrage, despatch and congestion.',
    objectives: ['Choose the right shipping mode per commodity', 'Calculate laytime and demurrage', 'Read basic charter terms'],
    body: `
${T(['Mode', 'Typical commodities', 'Notes'], [['Dry bulk carriers (Handysize ~15–40k DWT, Supramax/Ultramax ~50–65k, Panamax/Kamsarmax ~65–85k, Capesize 100k+)', 'Grain, raw sugar, iron ore, coal, scrap', 'Voyage or time charter; freight per tonne'], ['Container ships', 'Bagged refined sugar, coils/bars in some trades, specialty grains', 'Per box rates; door-to-door; FCA/CPT/CIP terms'], ['Breakbulk / general cargo', 'Steel coils, plates, bundles of rebar, sections', 'Lashing, dunnage, rust protection'], ['Tankers', 'Liquid commodities (molasses, ethanol, oils)', 'Not used for our four core products, except molasses/ethanol by-products'], ['Air freight (secure)', 'Gold', 'High value density; specialised carriers and insurance']])}
<h2>Chartering basics</h2>
<p><b>Voyage charter</b>: owner carries a cargo from A to B for freight per tonne; laytime/demurrage apply. <b>Time charter</b>: charterer hires a ship for a period at a daily rate and pays fuel/port costs. The <b>charter party</b> sets laycan (the window for the vessel to arrive), load/discharge rates, laytime terms (e.g. SHINC/SHEX), demurrage and despatch rates.</p>
<h2>Laytime and demurrage</h2>
<p>Laytime allowed = quantity ÷ agreed rate (t/day), adjusted for excepted periods (weekends/holidays if SHEX, bad weather). If time used exceeds laytime, the charterer pays <b>demurrage</b> per day; if faster, the owner may pay <b>despatch</b> (often half the demurrage rate). Through sale contracts, traders pass these terms to suppliers and buyers — mismatches create exposure.</p>
<div data-widget="laytimeMini"></div>
${go('logistics/calculator', 'Shipping calculator')} ${go('logistics/disruptions', 'Disruption scenarios')}
` });

  L.push({ id: 'l-operations', track: 'logistics', title: 'Cargo operations — insurance, claims, warehousing, customs and inspection', mins: 35,
    summary: 'Cargo insurance and marine claims, warehousing and storage costs, inland transport, customs clearance, tracking and inspection — and why commodities need different handling.',
    objectives: ['Handle a cargo claim properly', 'Estimate storage costs', 'Explain handling differences between commodities'],
    body: `
<h2>Why handling differs</h2>
${T(['Commodity', 'Handling needs', 'Main physical risks'], [['Gold', 'Vaults, armoured/secure transport, air freight, strict chain of custody', 'Theft, fraud, substitution'], ['Wheat', 'Dry bulk holds, fumigation, aeration in storage, clean holds certification', 'Heating, moisture, insects, contamination'], ['Sugar', 'Raw: dry bulk storage; refined: food-grade bags/containers, dry, clean', 'Moisture (caking), contamination, bag damage'], ['Steel', 'Cranes, lashing, dunnage, covered storage, rust protection', 'Wet damage/rust, deformation, handling damage']])}
<h2>Insurance and claims</h2>
<p>Cargo insurance protects against physical loss/damage within policy terms. On loss: notify insurers and carriers promptly, note protest, appoint surveyors, preserve evidence, keep documents (B/L, survey reports, photos), and respect time bars. Carrier liability is limited under applicable conventions and contract terms; insurers may recover from carriers (subrogation).</p>
<h2>Warehousing</h2>
<p>Storage cost (per tonne per month), handling in/out, insurance and shrink. Warehouse receipts must be from reputable operators; financing banks often use collateral managers. Monitor ageing and quality.</p>
<h2>Customs and tracking</h2>
<p>Customs clearance requires correct HS classification, valuation, origin, licences and payment of duties/taxes; brokers prepare declarations. Shipment tracking uses vessel AIS data and agents\' reports; plan for ETA changes and pass notices on to buyers per contract.</p>
` });

  L.push({ id: 'd-futures', track: 'derivatives', title: 'Futures mechanics — specs, ticks, margin, MTM, expiry and rollover', mins: 45,
    summary: 'Contract specifications, multipliers, tick sizes and values, initial and maintenance margin, mark-to-market, expiration, rollovers, leverage, long and short, hedging and speculation.',
    objectives: ['Convert price moves into P&L using multipliers', 'Run margin and margin-call calculations', 'Understand roll and expiry'],
    body: `
<h2>Illustrative specifications ${ILLU}</h2>
<p>The specs below reflect commonly published contract designs for teaching. <b>Always verify with the exchange\'s current rulebook</b> — specs, margins and dates change. You can edit them in Settings.</p>
<div data-widget="specTable"></div>
<h2>From price to money</h2>
<p>P&L = (exit − entry) × multiplier × contracts × (+1 long / −1 short). Tick value = tick size × multiplier. Watch units: wheat is quoted in cents/bushel, raw sugar in cents/lb — convert cents to dollars before multiplying.</p>
<div class="numbox"><b>Numbers</b> ${SIM}<div>Long 4 raw sugar contracts (112,000 lb) at 19.40 c/lb, sell at 19.85 c/lb: 0.45 c × 112,000 lb = 504 USD per contract × 4 = 2,016 USD.</div></div>
<h2>Margin and mark-to-market</h2>
<p>Initial margin is posted to open; every day positions are marked to the settlement price and gains/losses paid in cash (variation margin). If equity falls below maintenance margin, a margin call requires restoring it (usually to initial margin) — or the broker may liquidate. Leverage = notional ÷ equity; losses can exceed initial margin.</p>
<h2>Expiry and rollover</h2>
<p>Each contract month has a last trading day (and for delivered contracts, notice/delivery periods). Hedgers and speculators who want to keep exposure <b>roll</b>: close the expiring month and open a later one. The roll price difference (the calendar spread) is a gain or cost depending on curve shape.</p>
${go('futures/trade', 'Open the futures simulator')}
` });

  L.push({ id: 'd-hedging', track: 'derivatives', title: 'Hedging physical exposure and basis risk', mins: 45,
    summary: 'Short and long hedges, producer and mill hedging, hedging inventory and future purchases, hedge ratios, basis, basis risk, cross-hedging, liquidity effects.',
    objectives: ['Design a hedge for a physical exposure', 'Calculate hedge outcomes including basis', 'Explain residual and new risks'],
    body: `
<h2>Which side?</h2>
${T(['Exposure', 'Risk', 'Hedge'], [['Own inventory / will produce', 'Price falls', 'Short hedge: sell futures (or buy puts)'], ['Must buy later / sold forward at fixed price without supply', 'Price rises', 'Long hedge: buy futures (or buy calls)'], ['Fixed-price purchase and fixed-price sale matched', 'Little flat-price risk', 'No flat-price hedge; manage basis/timing']])}
<h2>Basis and basis risk</h2>
<p>Basis = local cash price − futures price. A hedger locks in the futures level, so the result depends on the basis when the hedge is lifted. <b>Basis risk</b> arises because location, quality, timing and local supply-demand affect the physical price differently from the futures. Cross-hedging (e.g. hedging non-US wheat with a US contract, or a regional steel product with a different benchmark) increases basis risk.</p>
<div data-widget="hedgeDemo"></div>
<h2>Mill and producer examples</h2>
<p><b>Mill</b>: holds 20,000 t wheat inventory valued off the market; sells futures equivalent to tonnage (convert tonnes to bushels: 1 t = 36.74 bu). If wheat prices fall, the inventory loses value but the short futures gain. <b>Producer</b>: sells futures before harvest to lock a price for part of expected output; keeps some unhedged because yield is uncertain (over-hedging a crop that fails is dangerous).</p>
<h2>A hedge reduces some risks but keeps or creates others</h2>
<ul><li><b>Remaining</b>: basis risk, quantity risk (volume uncertainty), quality risk, counterparty risk on the physical contract.</li><li><b>Created</b>: liquidity risk (margin calls on the futures leg while the physical gain is unrealised), operational risk (roll errors), and possibly accounting volatility.</li></ul>
` });

  L.push({ id: 'd-options', track: 'options', title: 'Options — calls, puts, value, volatility and Greeks', mins: 50,
    summary: 'Calls, puts, strikes, expiry, premium, intrinsic and time value, implied volatility, delta, gamma, theta and vega with a simplified Black-76 model and its limitations.',

    body: `
<h2>Building blocks</h2>
<ul><li><b>Call</b>: right to buy the underlying (futures) at the <b>strike</b>; <b>put</b>: right to sell.</li><li><b>Premium</b> = intrinsic value + time value. Intrinsic = max(F−K, 0) for calls; max(K−F, 0) for puts.</li><li><b>Expiration</b>: after expiry the option is exercised (if in the money) or worthless.</li><li>Buyers: limited loss (premium), potentially large gain. Sellers: receive premium, potentially large loss; post margin.</li></ul>
<h2>Implied volatility</h2>
<p>Volatility is the main unknown input. Implied volatility (IV) is the volatility that makes the model price equal the market price; it reflects the market\'s view of future uncertainty and supply-demand for options. Commodity IV often rises around reports, weather risk and supply shocks.</p>
<h2>Greeks</h2>
${T(['Greek', 'Measures', 'Rule of thumb'], [['Delta', 'Price change per 1 unit move in futures', 'Call 0 to 1, put −1 to 0; ATM ≈ ±0.5'], ['Gamma', 'Change of delta per 1 unit move', 'Highest for ATM near expiry'], ['Theta', 'Value change per day', 'Negative for long options; accelerates near expiry'], ['Vega', 'Value change per 1 vol point', 'Highest for longer-dated ATM options']])}
<div data-widget="optionPayoff"></div>
<h2>Model limitations</h2>
<p>The academy uses Black-76 (European options on futures, constant volatility, lognormal prices, no jumps, continuous trading). Real commodity options are often American-style, have volatility smiles/skews, jump risk around reports and weather, and early-exercise features. Treat model values as educational approximations.</p>
${go('futures/options', 'Options simulator')}
` });

${T(['Spread', 'Definition', 'Example'], [['Geographic (location)', 'Price at B − price at A', 'Wheat CFR Egypt vs FOB Black Sea'], ['Time / calendar', 'Deferred − nearby month', 'Gold Dec vs Jun; wheat Jul vs Sep'], ['Quality', 'Grade A − grade B', 'High-protein vs standard wheat; white vs raw sugar'], ['Processing', 'Output value − input cost', 'Refining margin; steel spread over ore & coal'], ['Physical basis', 'Local cash − futures', 'Elevator bid − nearby futures'], ['Freight arbitrage', 'Delivered-price difference driven by freight', 'Australia vs Black Sea into SE Asia'], ['Currency-adjusted', 'Prices converted to one currency', 'EUR-priced vs USD-priced offers']])}
<h2>Why a price gap is not automatically arbitrage</h2>
<p>True arbitrage is riskless after costs. In commodities you face freight, insurance, duties, handling, financing for the voyage/storage period, quality differences, delivery timing mismatches, currency moves, execution risk (vessel availability, port constraints), counterparty risk and regulatory constraints. Most apparent gaps are explained by these.</p>
<h2>Carry and storage economics</h2>
<p>Full carry: deferred price ≈ spot + storage + insurance + financing − any income (e.g. lease rate). If the futures spread exceeds full carry, a trader can buy spot, store and sell deferred (cash-and-carry). If the spread is far below full carry (or inverted), the market pays to release stocks now.</p>

  L.push({ id: 'a-quant', track: 'quant', title: 'Quantitative methods — returns, volatility, correlation and regression', mins: 45,

    body: `
<h2>Core statistics</h2>
<ul><li><b>Simple return</b> r = P1/P0 − 1; <b>log return</b> = ln(P1/P0) (time-additive).</li><li><b>Mean</b> and <b>variance</b>/<b>standard deviation</b> of returns; sample statistics use n − 1.</li><li><b>Annualised volatility</b> ≈ daily standard deviation × √252 (assumes independent, identically distributed returns).</li><li><b>Rolling</b> averages/volatility reveal regime changes.</li><li><b>Correlation</b> (−1…+1) measures linear co-movement; <b>regression</b> y = a + b·x estimates sensitivity (beta) and R² (share of variance explained). Hedge ratio by regression: minimum-variance ratio = ρ × σspot/σfutures.</li><li><b>Drawdown</b>: fall from a running peak; max drawdown measures pain.</li></ul>
<h2>Scenario and sensitivity analysis</h2>
<p>Sensitivity analysis changes one input at a time (e.g. freight ±10%) to see which drives profit most; scenario analysis changes several consistently (e.g. drought: price +15%, freight +20%, delays +10 days).</p>
<h2>Assumptions and weaknesses</h2>
<p>Returns are not normal (fat tails, jumps), volatility clusters, correlations break down in stress, and samples may not represent the future. Regression relationships can be spurious, especially with trending price levels — work with returns.</p>

` });

  L.push({ id: 'a-risk-models', track: 'quant', title: 'Risk models — Monte Carlo, VaR, Expected Shortfall and diversification', mins: 45,
    summary: 'Monte Carlo simulation, historical and parametric VaR, Expected Shortfall, portfolio diversification and model risk.',
    objectives: ['Compute VaR three ways', 'Explain ES and why it matters', 'Use diversification maths'],
    body: `
<h2>Value at Risk</h2>
<p>VaR(confidence c, horizon h) is the loss threshold exceeded with probability (1 − c) under the model. <b>Historical VaR</b> uses the empirical return distribution; <b>parametric VaR</b> assumes normality (VaR ≈ z·σ − μ, times position value); <b>Monte Carlo VaR</b> simulates paths from an assumed model.</p>
<h2>Expected Shortfall</h2>
<p>ES = average loss beyond VaR. It describes tail severity, which VaR ignores. Two portfolios can have the same VaR but very different ES.</p>
<h2>Monte Carlo</h2>
<p>Simulate many price paths (e.g. geometric Brownian motion with chosen drift and volatility), compute the outcome for each (P&L, margin need, inventory value), and read the distribution. Outputs are only as good as the model: if jumps or regime changes are missing, tail risk is understated.</p>
<h2>Diversification</h2>
<p>Portfolio σ = √(wᵀΣw). With correlations below 1, total risk is less than the sum. But correlations rise in crises, so diversification benefits shrink precisely when needed.</p>
${N('warn', 'Models are not forecasts', 'Use VaR/ES/Monte Carlo as one input. Complement with stress tests built from plausible combined shocks, and with limits on exposures, concentrations and liquidity.')}
${go('quant/var', 'VaR & Monte Carlo lab')}
` });

  /* ============================================================ Stage 8 */
  L.push({ id: 'r-framework', track: 'risk', title: 'Risk management framework for trading businesses', mins: 45,
    summary: 'Price, basis, currency, counterparty, credit, liquidity, financing, operational, documentation, quality, delivery, shipping, legal, regulatory, fraud and concentration risk; risk registers and governance.',
    objectives: ['Classify deal risks completely', 'Build a risk register entry', 'Assign owners and contingencies'],
    body: `
${T(['Risk', 'Example', 'Mitigants'], [
  ['Price', 'Unhedged inventory falls 10%', 'Hedging, limits, fast back-to-back'], ['Basis', 'Local premium collapses vs futures', 'Basis limits, careful benchmark choice'], ['Currency', 'EUR sale, USD purchase', 'FX forwards, same-currency contracts'],
  ['Counterparty / credit', 'Buyer defaults', 'LCs, credit insurance, limits, KYC'], ['Liquidity', 'Margin calls on hedges', 'Committed lines, liquidity reserve'], ['Financing', 'Bank cuts lines', 'Diversified banks, committed facilities'],

  ['Delivery', 'Supplier ships late', 'Penalties, reliable suppliers, buffers'], ['Shipping', 'Congestion, damage', 'Laytime terms, insurance, route choice'], ['Legal', 'Unenforceable contract', 'Standard forms, counsel'],
  ['Regulatory', 'Sanctions, export bans', 'Screening, policy monitoring, force majeure clauses'], ['Fraud', 'Fake warehouse receipts', 'Collateral managers, verification'], ['Concentration', 'One buyer = 60% of receivables', 'Counterparty limits, diversification'],
])}
<h2>A risk register entry</h2>
<p>For each risk: description, cause, probability (1–5), financial impact (amount or 1–5), mitigation, residual exposure, responsible owner and contingency plan. Expected loss ≈ probability × impact; prioritise high-impact risks even if unlikely.</p>
${go('risk/register', 'Risk register & dashboard')}
` });

  L.push({ id: 'r-limits', track: 'risk', title: 'Limits, sizing, stress testing and liquidity', mins: 40,

    body: `
<h2>Position sizing</h2>
<p>Contracts = floor( equity × risk% ÷ (|entry − stop| × multiplier) ). Never let one trade risk more than a small share of capital (e.g. 0.5–2% in speculative books).</p>
<h2>Limits</h2>
<ul><li><b>Exposure limits</b>: max net tonnes/ounces per commodity, per tenor.</li><li><b>Stop-loss limits</b>: desk/trader loss triggers for review or reduction.</li><li><b>Counterparty limits</b>: max unsecured exposure per counterparty/country, based on credit assessment.</li><li><b>Concentration limits</b>: by supplier, route, bank, warehouse.</li><li><b>Liquidity limits</b>: minimum cash/undrawn facilities versus stressed outflows (margin calls, supplier payments).</li></ul>
<h2>Stress testing combined shocks</h2>
<p>Example: a trader buys 5,000 t of wheat; the market falls 8%, freight rises 15%, the vessel is delayed 12 days and the buyer asks for 60 extra days to pay. Losses add up from price, freight, demurrage and financing — and the cash need peaks at the same time.</p>
${go('risk/stress', 'Run the combined stress test')}
` });

  L.push({ id: 'n-negotiation', track: 'negotiation', title: 'Commercial negotiation of complete deals', mins: 40,

<script>
/* js/data/exercises.js */
/* Numerical exercises. Each `gen(rng)` draws simulated inputs and returns the prompt, the exact answer
 * (computed with the CALC library where possible), tolerance, formula, worked steps, common mistakes
 * and the commercial implication. "New numbers" redraws inputs so exercises can be repeated. */
(function () {
  const CTA = window.CTA, C = window.CALC;
  const f = (n, d = 2) => CTA.fmt.num(n, d);
  const E = (CTA.EXERCISES = []);
  const ex = (id, topic, title, gen) => E.push({ id, topic, topicLabel: CTA.TOPICS ? CTA.TOPICS[topic] : topic, title, gen });
  const rr = (r, lo, hi, step) => Math.round(r.range(lo, hi) / step) * step;

  /* ------------------------------------------------------------ foundations */
  ex('ex-spread', 'foundations', 'Round-trip cost of the bid-ask spread', (r) => {
    const bid = rr(r, 1900, 2100, 0.1), sp = rr(r, 0.3, 1.5, 0.1), ask = bid + sp, q = r.int(2, 20) * 100;
    const ans = sp * q;
    return { prompt: `A dealer quotes gold at bid ${f(bid)} / ask ${f(ask)} per oz. You buy ${f(q, 0)} oz and immediately sell them back. What is your loss from the spread (USD)?`, answer: ans, unit: 'USD', tol: 0.5,
      formula: 'Loss = (ask − bid) × quantity', steps: [`Spread = ${f(ask)} − ${f(bid)} = ${f(sp)}`, `Loss = ${f(sp)} × ${f(q, 0)} = ${f(ans)}`],
      mistakes: 'Using half the spread, or forgetting you buy at the higher (ask) price.', implication: 'Frequent trading in wide-spread products erodes returns; always value positions at the price you can actually exit (bid for longs).' };
  });
  ex('ex-netprofit', 'foundations', 'Net profit of a simple cargo', (r) => {
    const q = r.int(5, 40) * 1000, buy = rr(r, 200, 320, 1), m = rr(r, 18, 45, 1), sell = buy + m, log = rr(r, 10, 30, 0.5), fin = rr(r, 1.5, 5, 0.1);
    const ans = (sell - buy - log - fin) * q;
    return { prompt: `You buy ${f(q, 0)} t at ${f(buy)}/t and sell at ${f(sell)}/t. Logistics cost ${f(log)}/t and financing ${f(fin)}/t. Net profit?`, answer: ans, unit: 'USD', tol: 1,
      formula: 'Net profit = (sell − buy − logistics − financing) × quantity', steps: [`Margin per t = ${f(sell)} − ${f(buy)} − ${f(log)} − ${f(fin)} = ${f(sell - buy - log - fin)}`, `× ${f(q, 0)} t = ${f(ans)}`],
      mistakes: 'Multiplying the headline margin (sell − buy) by quantity and forgetting costs.', implication: `The headline spread of ${f(m)}/t shrinks to ${f(sell - buy - log - fin)}/t: ${f((log + fin) / m * 100, 0)}% of it goes to costs.` };
  });
  ex('ex-financing', 'foundations', 'Financing cost of a cargo (ACT/360)', (r) => {
    const amt = r.int(20, 120) * 100000, rate = rr(r, 4, 11, 0.25), days = r.int(20, 120);
    const ans = C.interest(amt, rate, days);
    return { prompt: `A bank finances ${f(amt, 0)} at ${f(rate)}% per year for ${days} days (ACT/360). Interest cost?`, answer: ans, unit: 'USD', tol: 1,
      formula: 'Interest = principal × rate × days ÷ 360', steps: [`${f(amt, 0)} × ${f(rate)}% × ${days} / 360 = ${f(ans)}`],
      mistakes: 'Using 365 when the facility is ACT/360, or forgetting to divide the annual rate by days in the year.', implication: 'Each extra day of delay costs ' + f(ans / days) + ' in interest alone.' };
  });
  ex('ex-roic', 'foundations', 'Annualised return on equity employed', (r) => {
    const profit = r.int(40, 300) * 1000, wc = r.int(15, 60) * 100000, bank = r.pick([60, 70, 75, 80, 85]), days = r.int(30, 150);
    const eq = wc * (1 - bank / 100), roic = profit / eq * 100, ann = roic * 365 / days;
    return { prompt: `A deal earns ${f(profit, 0)} net profit. Working capital is ${f(wc, 0)}, of which the bank funds ${bank}%. The cycle lasts ${days} days. What is the annualised return on the trader's equity (%)?`, answer: ann, unit: '%', tol: 0.5,
      formula: 'ROIC = profit ÷ (working capital × (1 − bank share)); annualised = ROIC × 365 ÷ days', steps: [`Equity = ${f(wc, 0)} × ${100 - bank}% = ${f(eq, 0)}`, `ROIC = ${f(profit, 0)} / ${f(eq, 0)} = ${f(roic)}%`, `Annualised = ${f(roic)}% × 365 / ${days} = ${f(ann)}%`],
      mistakes: 'Dividing by total working capital instead of equity, or forgetting to annualise.', implication: 'Leverage magnifies return on equity — and magnifies losses the same way.' };
  });
  ex('ex-breakeven', 'foundations', 'Break-even selling price with commission', (r) => {
    const q = r.int(5, 30) * 1000, cost = r.int(200, 600) * q, comm = r.pick([0.5, 1, 1.5, 2]);
    const total = Math.round(cost * r.range(0.95, 1.05));
    const ans = total / (q * (1 - comm / 100));
    return { prompt: `Total costs of a ${f(q, 0)} t deal are ${f(total, 0)}. The buyer's agent takes a ${comm}% commission on sales value. Break-even selling price per t?`, answer: ans, unit: 'USD/t', tol: 0.05,
      formula: 'Break-even = total costs ÷ (quantity × (1 − commission %))', steps: [`Cost per t = ${f(total / q)}`, `Divide by (1 − ${comm}%) = ${f(1 - comm / 100, 3)} → ${f(ans)}`],
      mistakes: 'Adding the commission % to the cost per tonne instead of grossing up (commission applies to the selling price itself).', implication: 'Never quote below break-even; it is your walk-away price in negotiations.' };
  });
  ex('ex-wc', 'foundations', 'Working capital requirement', (r) => {
    const cargo = r.int(30, 90) * 100000, costs = r.int(2, 9) * 100000, adv = r.pick([0, 10, 15, 20]), sup = r.pick([0, 20, 30, 50]);
    const ans = Math.max(0, cargo + costs - cargo * sup / 100 - (cargo * 1.05) * adv / 100);
    return { prompt: `You pay ${f(cargo, 0)} for a cargo and ${f(costs, 0)} of costs before the buyer pays. The supplier grants credit on ${sup}% of the cargo value until after you collect, and the buyer pays an advance of ${adv}% of the sale value (sale value = cargo value × 1.05). Working capital you must fund?`, answer: ans, unit: 'USD', tol: 1,
      formula: 'WC = purchase + costs − supplier credit − buyer advance', steps: [`Supplier credit = ${f(cargo * sup / 100, 0)}`, `Buyer advance = ${f(cargo * 1.05 * adv / 100, 0)}`, `WC = ${f(cargo + costs, 0)} − ${f(cargo * sup / 100, 0)} − ${f(cargo * 1.05 * adv / 100, 0)} = ${f(ans, 0)}`],
      mistakes: 'Forgetting supplier credit reduces your funding need, or computing the advance on purchase value instead of sale value.', implication: 'Negotiating payment terms can free more capital than negotiating price.' };
  });
  /* ------------------------------------------------------------ accounting */
  ex('ex-ocf', 'accounting', 'Operating cash flow from working-capital changes', (r) => {
    const p = rr(r, 1, 6, 0.1), inv = rr(r, -3, 9, 0.1), rec = rr(r, -2, 8, 0.1), pay = rr(r, -2, 6, 0.1), mtm = rr(r, 0, 1.5, 0.1);
    const ans = p - mtm - inv - rec + pay;
    return { prompt: `A trader reports net profit of ${f(p, 1)}m, including ${f(mtm, 1)}m of unrealised MTM gains. Inventories changed by ${f(inv, 1)}m, receivables by ${f(rec, 1)}m and payables by ${f(pay, 1)}m (positive = increase). Operating cash flow (m)?`, answer: ans, unit: 'm', tol: 0.05, dp: 2,
      formula: 'OCF ≈ profit − non-cash gains − Δinventory − Δreceivables + Δpayables', steps: [`${f(p, 1)} − ${f(mtm, 1)} − (${f(inv, 1)}) − (${f(rec, 1)}) + (${f(pay, 1)}) = ${f(ans)}`],
      mistakes: 'Adding increases in inventory/receivables (they consume cash) or forgetting to remove non-cash MTM gains.', implication: ans < 0 ? 'Profitable but cash-consuming: the gap must be funded by banks or equity.' : 'Profit converted into cash this period.' };
  });
  ex('ex-cashgap', 'accounting', 'Peak cash need from payment timing', (r) => {
    const n = r.int(2, 6), v = r.int(20, 60) * 100000, gap = r.int(30, 120), every = r.pick([15, 20, 30]);
    const overlap = Math.min(n, Math.floor(gap / every) + 1);
    const ans = overlap * v;
    return { prompt: `You start a new cargo every ${every} days. Each cargo costs ${f(v, 0)}, paid to the supplier on day 0 of that cargo, and the buyer pays ${gap} days later. You run ${n} cargoes in total. Ignoring profit, what is the maximum cash tied up at one time?`, answer: ans, unit: 'USD', tol: 1,
      formula: 'Peak cash = number of cargoes paid but not yet collected at the same time × cargo cost', steps: [`Cargoes overlapping = min(${n}, floor(${gap}/${every}) + 1) = ${overlap}`, `Peak = ${overlap} × ${f(v, 0)} = ${f(ans, 0)}`],
      mistakes: 'Counting only one cargo, ignoring that new cargoes start before old ones are paid.', implication: 'Growth in volume or longer buyer terms increases the funding need even when every deal is profitable.' };
  });
  /* ------------------------------------------------------------ gold */
  ex('ex-gold-fine', 'gold', 'Fine gold content from karat and grams', (r) => {
    const k = r.pick([14, 18, 21, 22]), g = rr(r, 20, 900, 0.5);
    const ans = C.convertMass(g * k / 24, 'g', 'ozt');
    return { prompt: `A batch of ${k}-karat jewellery scrap weighs ${f(g, 1)} g. How many fine troy ounces of gold does it contain?`, answer: ans, unit: 'fine ozt', tol: 0.005, dp: 3,
      formula: 'Fine oz = grams × (karat ÷ 24) ÷ 31.1034768', steps: [`Fineness = ${k}/24 = ${f(k / 24, 4)}`, `Fine grams = ${f(g, 1)} × ${f(k / 24, 4)} = ${f(g * k / 24, 3)} g`, `÷ 31.1034768 = ${f(ans, 3)} ozt`],
      mistakes: 'Dividing by 28.35 (avoirdupois ounce) — a ~9.7% error.', implication: 'Scrap buyers also deduct refining charges and assay tolerances, so the payable ounces are less than this.' };

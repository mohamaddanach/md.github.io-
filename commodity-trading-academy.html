    ['Currency risk', 2, 0.02, 'FX forwards; same-currency contracts', 'Treasury', 'Hedge remaining exposure'],
    ['Counterparty risk (supplier performance)', 2, 0.04, 'Due diligence, reliable suppliers, performance bond', 'Trading manager', 'Back-up supplier list'],
    ['Credit risk (buyer payment)', 2, 0.6, 'LC/credit insurance/limits', 'Credit risk', 'Collections plan, legal action'],
    ['Liquidity risk (margin calls, payments)', 2, 0.03, 'Committed lines, liquidity reserve', 'Treasury', 'Draw reserve lines'],
    ['Financing risk', 1, 0.02, 'Diversified banks; committed facilities', 'Treasury', 'Alternative funding'],
    ['Operational risk', 2, 0.01, 'Four-eyes, call-back verification, systems', 'Operations', 'Incident response'],
    ['Documentation risk', 2, 0.01, 'Checklists, early LC review', 'Documentation', 'Correct & re-present; seek waiver'],
    ['Quality risk', 2, 0.02, 'Independent inspection, final-at-loading terms', 'Operations', 'Allowances per contract'],
    ['Delivery risk', 2, 0.015, 'Realistic windows, reliable logistics', 'Operations', 'Extension requests, substitutes'],
    ['Shipping risk (delay, damage)', 2, 0.015, 'Route choice, insurance, laytime alignment', 'Shipping', 'Claims, alternative ports'],
    ['Legal risk', 1, 0.02, 'Standard contracts, arbitration clause, counsel review', 'Legal', 'Arbitration'],
    ['Regulatory risk (sanctions, export bans)', 1, 0.3, 'Screening, force majeure, policy monitoring', 'Compliance', 'Stop/unwind per counsel'],
    ['Fraud risk', 1, 0.5, 'KYC, verified documents, DvP, collateral managers', 'Compliance', 'Freeze, report, legal action'],
    ['Concentration risk', 2, 0.1, 'Counterparty & route limits', 'Risk', 'Diversify next deals'],
  ];
  const freshRegister = (value) => TEMPLATE.map(([name, p, impPct, mit, owner, cont]) => ({ name, p, impact: Math.round(value * impPct), mit, residual: 40, owner, cont }));

  function heat(entries) {
    const grid = {}; entries.forEach((e) => { const k = e.p + ':' + impactBucket(e.impact); (grid[k] = grid[k] || []).push(e.name); });
    const col = (p, i) => { const s = p * i; return s >= 15 ? '#f4b4b4' : s >= 8 ? '#fbd9a5' : s >= 4 ? '#fff0b8' : '#d7efdf'; };
    let h = '<div class="heat"><div class="hl"></div>' + ['<25k', '<100k', '<300k', '<1m', '≥1m'].map((x) => `<div class="hl" style="justify-content:center">${x}</div>`).join('');
    for (let p = 5; p >= 1; p--) { h += `<div class="hl">P${p} (${PROB[p] * 100}%)</div>`; for (let i = 1; i <= 5; i++) { const xs = grid[p + ':' + i] || []; h += `<div style="background:${col(p, i)}" title="${esc(xs.join(', '))}">${xs.length ? '<b>' + xs.length + '</b>' : ''}</div>`; } }
    return h + '</div><p class="muted" style="font-size:.8rem">Rows: probability · columns: impact (USD). Hover a cell to see risks.</p>';
  }

  function register(b, r) {
    const deals = CTA.state.physical.completed;
    const id = r.q.deal || (deals.length ? deals[deals.length - 1].id : 'generic');
    const deal = deals.find((d) => d.id === id);
    const value = deal ? deal.revenue : 7000000;
    const regs = CTA.state.risk.registers;
    if (!regs[id]) regs[id] = freshRegister(value);
    const E = regs[id];
    const draw = () => {
      const tot = E.reduce((s, e) => s + PROB[e.p] * e.impact, 0), res = E.reduce((s, e) => s + PROB[e.p] * e.impact * e.residual / 100, 0);
      b.innerHTML = `<div class="card"><div class="row"><label for="rdeal">Deal</label><select id="rdeal" style="max-width:340px"><option value="generic" ${id === 'generic' ? 'selected' : ''}>Generic 7m commodity deal (template)</option>${deals.map((d) => `<option value="${d.id}" ${d.id === id ? 'selected' : ''}>${d.commodity} deal ${fmt.date(d.date)} — revenue ${fmt.money(d.revenue, 'USD', 0)}</option>`).join('')}</select><button class="btn sm" id="rreset">Reset to template</button></div>
        ${deal ? `<p class="muted" style="font-size:.86rem">Choices in this deal: supplier ${esc(deal.choices.supplier)}, buyer ${esc(deal.choices.buyer)}, hedge ${deal.choices.hedge || 0}%, ${esc(deal.choices.route)}. Adjust probabilities accordingly.</p>` : ''}</div>
        <div class="grid side"><div class="card"><h3>Risk register ${CTA.SIM}</h3><div class="table-wrap"><table><thead><tr><th>Risk</th><th>Probability</th><th class="r">Impact (USD)</th><th class="r">Expected loss</th><th>Mitigation</th><th>Residual %</th><th class="r">Remaining exposure</th><th>Owner</th><th>Contingency</th></tr></thead><tbody>
          ${E.map((e, i) => `<tr><td><b>${esc(e.name)}</b></td><td><select data-i="${i}" data-k="p" aria-label="Probability">${[1, 2, 3, 4, 5].map((p) => `<option value="${p}" ${+e.p === p ? 'selected' : ''}>${p} (${PROB[p] * 100}%)</option>`).join('')}</select></td><td><input type="number" data-i="${i}" data-k="impact" value="${e.impact}" style="width:110px" aria-label="Impact"></td><td class="r num">${f(PROB[e.p] * e.impact)}</td><td><input type="text" data-i="${i}" data-k="mit" value="${esc(e.mit)}" style="min-width:200px" aria-label="Mitigation"></td><td><input type="number" data-i="${i}" data-k="residual" value="${e.residual}" min="0" max="100" style="width:70px" aria-label="Residual"></td><td class="r num">${f(PROB[e.p] * e.impact * e.residual / 100)}</td><td><input type="text" data-i="${i}" data-k="owner" value="${esc(e.owner)}" style="width:110px" aria-label="Owner"></td><td><input type="text" data-i="${i}" data-k="cont" value="${esc(e.cont)}" style="min-width:170px" aria-label="Contingency"></td></tr>`).join('')}
          <tr class="total"><td colspan="3">Totals</td><td class="r">${f(tot)}</td><td></td><td></td><td class="r">${f(res)}</td><td colspan="2"></td></tr></tbody></table></div><p class="muted" style="font-size:.84rem">Expected loss = probability × impact. Remaining exposure = expected loss × residual % after mitigation. Expected values hide tail risk: also look at high-impact cells in the heat map.</p></div>
        <div><div class="card"><h3>Heat map</h3>${heat(E)}</div><div class="card"><h3>Top residual exposures</h3>${E.map((e) => [e.name, PROB[e.p] * e.impact * e.residual / 100]).sort((a, c) => c[1] - a[1]).slice(0, 5).map(([n, v]) => `<div class="row between"><span>${esc(n)}</span><b>${f(v)}</b></div>`).join('')}</div></div></div>`;
      CTA.$('#rdeal', b).onchange = (e) => CTA.go('risk/register?deal=' + e.target.value);
      CTA.$('#rreset', b).onclick = () => { regs[id] = freshRegister(value); CTA.save(); register(b, r); };
      CTA.$$('[data-i]', b).forEach((inp) => { inp.onchange = () => { const e = E[+inp.dataset.i]; const k = inp.dataset.k; e[k] = ['p', 'impact', 'residual'].includes(k) ? Math.max(0, CTA.num(inp.value, 0)) : inp.value; if (k === 'residual') e.residual = Math.min(100, e.residual); CTA.save(); draw(); }; });
    };
    CTA.save(); draw();
  }

  function stress(b) {
    CTA.ui.calcWidget(b, { title: 'Combined stress test — 5,000 t wheat', intro: 'A trader buys 5,000 t of wheat. The market price declines, freight increases, the vessel is delayed and the buyer requests an extension of payment terms. Adjust the shocks and see the combined impact on profit and cash.',
      fields: [{ id: 'q', label: 'Quantity (t)', value: 5000 }, { id: 'buy', label: 'Purchase price (/t)', value: 248 }, { id: 'sell', label: 'Agreed sale price (/t)', value: 282 }, { id: 'fr', label: 'Freight (/t, unfixed)', value: 30 }, { id: 'oth', label: 'Other costs (/t)', value: 6 }, { id: 'hedge', label: 'Hedged share of price risk (%)', value: 0 }, { id: 'priceFall', label: 'Market price decline (%)', value: 8 }, { id: 'pricePass', label: 'Share of price fall hitting you (buyer renegotiates/defaults, %)', value: 50 }, { id: 'frUp', label: 'Freight increase (%)', value: 20 }, { id: 'delay', label: 'Vessel delay (days)', value: 10 }, { id: 'dem', label: 'Demurrage (/day)', value: 9000 }, { id: 'ext', label: 'Payment extension (days)', value: 60 }, { id: 'rate', label: 'Funding rate %', value: 8 }, { id: 'cash', label: 'Available liquidity (USD)', value: 400000 }],
      compute: (v) => { const base = (v.sell - v.buy - v.fr - v.oth) * v.q;
        const price = v.q * v.buy * v.priceFall / 100 * v.pricePass / 100 * (1 - v.hedge / 100);
        const freight = v.q * v.fr * v.frUp / 100, dem = v.delay * v.dem, fin = C.interest(v.q * v.buy, v.rate, v.delay + v.ext);
        const tot = price + freight + dem + fin, after = base - tot; const cashNeed = v.q * v.buy * (1 - 0.8) + freight + dem + fin;
        return `${CTA.table(['Shock', 'Impact (USD)'], [['Price decline × share hitting you × unhedged share', f(price)], ['Freight increase', f(freight)], ['Demurrage from delay', f(dem)], ['Extra financing (delay + extension)', f(fin)], ['<b>Combined impact</b>', '<b>' + f(tot) + '</b>']])}
          ${CTA.ui.kpis([{ label: 'Planned profit', value: fmt.money(base, 'USD', 0) }, { label: 'Stressed profit', value: fmt.money(after, 'USD', 0), cls: fmt.cls(after) }, { label: 'Stressed cash need (20% equity + shocks)', value: fmt.money(cashNeed, 'USD', 0), cls: cashNeed > v.cash ? 'neg' : '' }, { label: 'Liquidity headroom', value: fmt.money(v.cash - cashNeed, 'USD', 0), cls: fmt.cls(v.cash - cashNeed) }])}
          ${cashNeed > v.cash ? '<div class="note bad"><strong>Liquidity shortfall</strong>The shocks arrive together and the cash need exceeds available liquidity.</div>' : ''}<div id="stdec"></div>`; },
      after: (v, out) => {
        const opts = [['Accept the extension only with interest and security (e.g. a bank guarantee); fix the remaining freight now; hedge the unpriced exposure; draw the committed line', 100, 'Addresses each driver: credit, freight, price and liquidity.'], ['Accept the extension without conditions to keep the customer', 30, 'You become the buyer\'s unpaid financier while your own costs rise.'], ['Refuse everything and cancel the sale', 20, 'Leaves you with unsold cargo in a falling market — likely the worst outcome.'], ['Wait for prices to recover', 10, 'Hope is not a risk-management strategy.']];
        const dec = CTA.$('#stdec', out); dec.innerHTML = `<h4>How do you respond?</h4>${CTA.shuffleIdx(opts.length).map((i) => `<label class="choice"><input type="radio" name="stdec" value="${i}"><span class="ch-t">${esc(opts[i][0])}</span></label>`).join('')}<div class="stfb"></div>`;
        CTA.$$('input[name=stdec]', dec).forEach((x) => { x.onchange = () => { const o = opts[+x.value]; CTA.$('.stfb', dec).innerHTML = `<div class="note ${o[1] >= 70 ? 'ok' : 'bad'}"><strong>${o[1]}/100</strong>${esc(o[2])} Note: a hedge would have reduced the price component but kept freight, delay, credit and liquidity risks — and could itself require margin cash.</div>`; CTA.record.caseResult('stress-wheat', o[1]); }; });
      } });
  }

  function sizing(b) {
    b.innerHTML = `<div data-widget="rrCalc"></div><div data-widget="hedgeDemo"></div>
      <div class="card"><h3>A hedge reduces some risks — and keeps or creates others</h3>${CTA.table(['Risk', 'After a futures hedge of physical inventory'], [['Flat price risk', '<span class="pos">Largely removed</span>'], ['Basis risk', '<span class="neg">Remains</span> (location/quality/timing differences)'], ['Liquidity risk', '<span class="neg">Created</span>: variation margin is paid in cash daily while the physical gain is unrealised'], ['Counterparty risk on physical contracts', '<span class="neg">Remains</span>'], ['Quantity risk', '<span class="neg">Remains</span> (if volumes change, the hedge may be too large)'], ['Operational risk', '<span class="neg">Increases</span>: rolls, expiry, reconciliation'], ['Model/correlation risk (cross-hedges)', '<span class="neg">Created</span> when using a proxy contract']])}</div>
      <div class="card"><h3>Typical limits framework ${CTA.ILLU}</h3>${CTA.table(['Limit', 'Example', 'Purpose'], [['Max risk per speculative trade', '1% of equity', 'Survive losing streaks'], ['Max open net exposure per commodity', 'e.g. 50,000 t wheat', 'Cap market risk'], ['Max unsecured exposure per counterparty', 'e.g. 10% of equity', 'Cap credit risk'], ['Max concentration per country/route/bank', 'e.g. 25%', 'Avoid correlated losses'], ['Minimum liquidity reserve', 'Stressed outflows for 30 days', 'Meet margin calls & payments'], ['Max leverage (futures desk)', 'e.g. 5× equity', 'Avoid margin spirals'], ['Stop-loss review trigger', 'e.g. −5% monthly', 'Force review of losing strategies']])}</div>`;
  }

  function dashboard(b) {
    const st = CTA.state, F = st.futures; const regs = st.risk.registers; const all = Object.entries(regs).filter(([, e]) => e);
    const fut = F && CTA.FUT ? (() => { const eq = CTA.FUT.equity(F), m = CTA.FUT.margins(F); const sp = CTA.MARKET.specs()[CTA.MARKET.SCENARIOS.find((s) => s.id === F.scenarioId).inst]; const ex = F.positions.filter((p) => p.type === 'fut').reduce((s, p) => s + CTA.FUT.price(F, p.month).c * sp.pointValue * p.qty, 0); return { eq, m, ex, lev: eq > 0 ? ex / eq : 0, dd: C.maxDrawdown(F.equityHist) }; })() : null;
    const co = st.company; const recv = co ? co.receivables : []; const tot = recv.reduce((s, x) => s + x.amount, 0); const by = {}; recv.forEach((x) => { by[x.buy] = (by[x.buy] || 0) + x.amount; }); const maxC = tot ? Math.max(...Object.values(by)) / tot * 100 : 0;
    const allE = all.flatMap(([, e]) => e);
    const lim = (label, val, limit, unit, ok) => [label, val, limit, ok ? '<span class="badge ok">within</span>' : '<span class="badge bad">breach</span>'];
    b.innerHTML = `${CTA.ui.kpis([{ label: 'Futures equity', value: fut ? fmt.money(fut.eq, 'USD', 0) : '—' }, { label: 'Futures leverage', value: fut ? f(fut.lev, 1) + '×' : '—', cls: fut && fut.lev > 5 ? 'neg' : '' }, { label: 'Margin headroom', value: fut ? fmt.money(fut.eq - fut.m.mm, 'USD', 0) : '—', cls: fut && fut.eq < fut.m.mm ? 'neg' : '' }, { label: 'Max drawdown (futures)', value: fut ? fmt.pct(fut.dd * 100) : '—' }, { label: 'Company receivables', value: co ? fmt.money(tot, 'USD', 0) : '—' }, { label: 'Largest buyer-rating concentration', value: co && tot ? fmt.pct(maxC, 0) : '—', cls: maxC > 50 ? 'neg' : '' }, { label: 'Risk registers', value: all.length }, { label: 'Expected loss (all registers)', value: fmt.money(allE.reduce((s, e) => s + PROB[e.p] * e.impact, 0), 'USD', 0) }])}
      <div class="grid c2"><div class="card"><h3>Limit monitor ${CTA.ILLU}</h3>${CTA.table(['Limit', 'Current', 'Limit', 'Status'], [fut ? lim('Futures leverage', f(fut.lev, 1) + '×', '5×', '', fut.lev <= 5) : ['Futures leverage', '—', '5×', '—'], fut ? lim('Equity vs maintenance margin', fmt.money(fut.eq, 'USD', 0), '≥ ' + fmt.money(fut.m.mm, 'USD', 0), '', fut.eq >= fut.m.mm) : ['Margin', '—', '—', '—'], co ? lim('Single rating bucket concentration', fmt.pct(maxC, 0), '≤ 50%', '', maxC <= 50) : ['Concentration', '—', '50%', '—'], co ? lim('Facility utilisation', fmt.pct(co.debt / co.cfg.facility * 100, 0), '≤ 80%', '', co.debt / co.cfg.facility <= 0.8) : ['Facility', '—', '80%', '—']])}<p class="muted" style="font-size:.84rem">Feeds from the futures desk and the trading company simulator. Limits are illustrative examples of a risk policy.</p></div>
      <div class="card"><h3>Aggregated heat map</h3>${allE.length ? heat(allE) : CTA.ui.empty('No risk registers yet', 'Build one for a completed deal.', '<a class="btn primary" href="#/risk/register">Open register</a>')}</div></div>`;
  }

  CTA.route('risk', { title: 'Risk Management Center', desc: 'Registers, heat maps, stress tests, limits.', render(el, r) {
    const tab = r.parts[0] || 'dashboard';
    el.innerHTML = `${CTA.pageHead('Risk Management Center', 'How professional trading businesses identify, measure, mitigate and monitor risk: price, basis, currency, counterparty, credit, liquidity, financing, operational, documentation, quality, delivery, shipping, legal, regulatory, fraud and concentration.')}${CTA.tabs([['dashboard', 'Dashboard'], ['register', 'Deal risk register'], ['stress', 'Stress test'], ['sizing', 'Sizing, limits & hedges']], tab, 'risk')}<div id="rk"></div>`;
    const b = CTA.$('#rk', el);
    if (tab === 'register') register(b, r); else if (tab === 'stress') stress(b); else if (tab === 'sizing') sizing(b); else dashboard(b);
  } });
})();

</script>
<script>
/* js/views/quant.js */
/* Quantitative Analysis Laboratory — statistics, correlation/regression, VaR/ES/Monte Carlo, diversification.
 * Uses the simulated, correlated 500-day dataset from CTA.MARKET.dataset (seeded, reproducible). */
(function () {
  const CTA = window.CTA, C = window.CALC, fmt = CTA.fmt, esc = CTA.esc;
  const f = (n, d = 2) => fmt.num(n, d);
  const NAMES = { gold: 'Gold', wheat: 'Wheat', sugar: 'Sugar', steel: 'HRC steel' };
  const hist = (vals, bins) => { const lo = Math.min(...vals), hi = Math.max(...vals), w = (hi - lo) / bins || 1; const h = new Array(bins).fill(0); vals.forEach((v) => { h[Math.min(bins - 1, Math.floor((v - lo) / w))]++; }); return { h, labels: h.map((_, i) => f(lo + w * (i + 0.5), 3)), lo, w }; };

  function stats(b, ds, q) {
    const k = q.c || 'wheat'; const p = ds.series[k]; const lr = C.logReturns(p), sr = C.returns(p);
    const roll = C.rollingStdev(lr, 20).map((x) => (x == null ? null : x * Math.sqrt(252) * 100));
    const dd = C.drawdownSeries(p).map((x) => x * 100);
    const skew = (() => { const m = C.mean(lr), s = C.stdev(lr); return C.mean(lr.map((x) => ((x - m) / s) ** 3)); })(), kurt = (() => { const m = C.mean(lr), s = C.stdev(lr); return C.mean(lr.map((x) => ((x - m) / s) ** 4)) - 3; })();
    b.innerHTML = `<div class="card"><div class="row"><label>Series</label>${Object.keys(NAMES).map((x) => `<a class="btn sm ${x === k ? 'primary' : ''}" href="#/quant/stats?c=${x}&seed=${q.seed || 2024}">${NAMES[x]}</a>`).join('')}<span class="muted">${esc(ds.units[k])} · 500 simulated trading days ${CTA.SIM}</span></div>
      ${CTA.ui.kpis([{ label: 'Mean daily log return', value: f(C.mean(lr) * 100, 4) + '%' }, { label: 'Daily st. dev.', value: f(C.stdev(lr) * 100, 3) + '%' }, { label: 'Variance (daily)', value: f(C.variance(lr), 7) }, { label: 'Annualised volatility', value: fmt.pct(C.annualizedVol(lr) * 100), term: 'Volatility' }, { label: 'Mean simple return', value: f(C.mean(sr) * 100, 4) + '%' }, { label: 'Skewness', value: f(skew, 2) }, { label: 'Excess kurtosis', value: f(kurt, 2), sub: '> 0 → fatter tails than normal' }, { label: 'Max drawdown', value: fmt.pct(C.maxDrawdown(p) * 100), term: 'Drawdown' }])}
      <div id="qp"></div><h4>Rolling 20-day annualised volatility (%)</h4><div id="qv"></div><h4>Drawdown from running peak (%)</h4><div id="qd"></div><h4>Distribution of daily log returns</h4><div id="qh"></div>
      <div class="note"><strong>Assumptions & limits</strong>Annualising with √252 assumes independent returns. Real commodity returns show volatility clustering, jumps (supply shocks) and fat tails — here visible as positive excess kurtosis from the simulated jumps.</div></div>`;
    const lbl = p.map((_, i) => 'D' + i);
    CTA.chart(CTA.$('#qp', b), { height: 230, labels: lbl, series: [{ data: p, label: NAMES[k], color: CTA.MARKET.PROFILE[k].color }, { data: C.sma(p, 50), label: 'Rolling 50-day mean', color: 'var(--c3)', dash: '5 3' }] });
    CTA.chart(CTA.$('#qv', b), { height: 140, labels: lbl.slice(1), series: [{ data: roll, label: 'Vol %', color: 'var(--c5)' }] });
    CTA.chart(CTA.$('#qd', b), { height: 120, labels: lbl, zero: true, series: [{ data: dd, label: 'Drawdown %', color: 'var(--neg)', type: 'area' }] });
    const H = hist(lr, 30); CTA.chart(CTA.$('#qh', b), { height: 150, labels: H.labels, series: [{ type: 'bars', data: H.h, label: 'Frequency', color: 'var(--c1)' }], yMin: 0 });
  }

  function corr(b, ds, q) {
    const R = {}; ds.names.forEach((n) => { R[n] = C.logReturns(ds.series[n]); });
    const x = q.x || 'wheat', y = q.y || 'sugar';
    const rg = C.linearRegression(R[x], R[y]);
    const roll = R[x].map((_, i) => (i < 59 ? null : C.correlation(R[x].slice(i - 59, i + 1), R[y].slice(i - 59, i + 1))));
    b.innerHTML = `<div class="grid c2"><div class="card"><h3>Correlation matrix of daily log returns</h3>${CTA.table(['', ...ds.names.map((n) => NAMES[n])], ds.names.map((a) => [NAMES[a], ...ds.names.map((c) => { const v = C.correlation(R[a], R[c]); return `<span style="font-weight:${a === c ? 400 : 600};color:${v > 0.2 ? 'var(--pos)' : v < -0.2 ? 'var(--neg)' : 'inherit'}">${f(v, 2)}</span>`; })]))}<p class="muted" style="font-size:.84rem">Generated with "true" correlations of ${f(ds.trueCorr[1][2], 2)} (wheat–sugar) etc. Sample estimates differ from true values — that is sampling error.</p></div>
      <div class="card"><h3>Regression</h3><div class="row"><label>y</label><select id="ry">${ds.names.map((n) => `<option value="${n}" ${n === y ? 'selected' : ''}>${NAMES[n]}</option>`).join('')}</select><label>on x</label><select id="rx">${ds.names.map((n) => `<option value="${n}" ${n === x ? 'selected' : ''}>${NAMES[n]}</option>`).join('')}</select></div>
        ${CTA.ui.kpis([{ label: 'Slope (beta)', value: f(rg.slope, 3) }, { label: 'Intercept', value: f(rg.intercept * 100, 4) + '%' }, { label: 'R²', value: f(rg.r2, 3) }, { label: 'Min-variance hedge ratio (y hedged with x)', value: f(C.minVarianceHedgeRatio(C.correlation(R[y], R[x]), C.stdev(R[y]), C.stdev(R[x])), 3) }])}<p class="muted" style="font-size:.84rem">Regression on returns, not price levels (levels of trending series can show spurious relationships). Low R² means x explains little of y.</p></div></div>
      <div class="card"><h4>Rolling 60-day correlation: ${NAMES[x]} vs ${NAMES[y]}</h4><div id="rc"></div><p class="muted" style="font-size:.84rem">Correlation is unstable even when the true underlying value is constant. In real markets it also shifts with regimes — and tends to rise in crises.</p></div>`;
    CTA.chart(CTA.$('#rc', b), { height: 170, zero: true, yMin: -1, yMax: 1, series: [{ data: roll, label: 'Rolling correlation', color: 'var(--c3)' }], labels: roll.map((_, i) => 'D' + i) });
    const go = () => CTA.go(`quant/corr?x=${CTA.$('#rx', b).value}&y=${CTA.$('#ry', b).value}`); CTA.$('#rx', b).onchange = go; CTA.$('#ry', b).onchange = go;
  }

  function varLab(b, ds) {
    CTA.ui.calcWidget(b, { title: 'Value at Risk, Expected Shortfall and Monte Carlo', tag: CTA.SIM, intro: 'Position: a long physical or futures exposure in one commodity. Compare historical, parametric (normal) and Monte Carlo (GBM) estimates.',
      fields: [{ id: 'c', label: 'Commodity', type: 'select', value: 'wheat', options: Object.entries(NAMES) }, { id: 'val', label: 'Position value (USD)', value: 5000000 }, { id: 'conf', label: 'Confidence', type: 'select', value: '0.99', options: [['0.95', '95%'], ['0.99', '99%']] }, { id: 'h', label: 'Horizon (days)', value: 1 }, { id: 'paths', label: 'Monte Carlo paths', value: 2000 }, { id: 'stress', label: 'Stress scenario move (%)', value: -15 }],
      compute: (v, out) => {
        const p = ds.series[v.c]; const lr = C.logReturns(p); const conf = +v.conf; const h = Math.max(1, Math.round(v.h)); const sc = Math.sqrt(h);
        const hv = C.historicalVaR(lr, conf, v.val) * sc, pv = C.parametricVaR(lr, conf, v.val) * sc, es = C.expectedShortfall(lr, conf, v.val) * sc;
        const sigma = C.annualizedVol(lr); const mc = C.monteCarloGBM({ s0: 1, mu: 0, sigma, days: h, paths: Math.min(20000, Math.max(100, Math.round(v.paths))), seed: 99 });
        const pnl = mc.terminal.map((x) => (x - 1) * v.val); const mcVar = -C.percentile(pnl, 1 - conf); const tail = pnl.filter((x) => x <= -mcVar); const mcEs = tail.length ? -C.mean(tail) : NaN;
        el_cache = { pnl, sample: mc.sample, h };
        return `${CTA.ui.kpis([{ label: 'Historical VaR', value: fmt.money(hv, 'USD', 0), term: 'Value at Risk' }, { label: 'Parametric VaR (normal)', value: fmt.money(pv, 'USD', 0) }, { label: 'Monte Carlo VaR (GBM)', value: fmt.money(mcVar, 'USD', 0) }, { label: 'Historical Expected Shortfall', value: fmt.money(es, 'USD', 0), term: 'Expected Shortfall' }, { label: 'Monte Carlo ES', value: fmt.money(mcEs, 'USD', 0) }, { label: 'Stress scenario loss', value: fmt.money(-v.stress / 100 * v.val, 'USD', 0), cls: 'neg' }])}
          <p class="muted" style="font-size:.84rem">Multi-day VaR scaled by √horizon from daily estimates (assumes independence). Annualised vol used in Monte Carlo: ${fmt.pct(sigma * 100)}. A ${v.stress}% stress move is ${f(Math.abs(v.stress) / 100 / (C.stdev(lr) * sc), 1)} standard deviations — under a normal model such a move would be "almost impossible", yet commodity markets have seen such moves.</p>
          <div class="grid c2"><div><h4>Monte Carlo sample paths</h4><div id="mcp"></div></div><div><h4>Simulated P&L distribution</h4><div id="mch"></div></div></div>
          <div class="note warn"><strong>Model limitations</strong>VaR is not a worst case. Historical VaR depends on the sample window; parametric VaR understates fat tails; Monte Carlo inherits its model's assumptions (here no jumps). Use stress tests and limits alongside.</div>`; },
      after: (v, out) => { const c = el_cache; CTA.chart(CTA.$('#mcp', out), { height: 180, series: c.sample.slice(0, 20).map((s, i) => ({ data: s.map((x) => (x - 1) * 100), color: `hsl(${(i * 37) % 360} 50% 50%)`, width: 1 })), labels: c.sample[0].map((_, i) => 'D' + i), yFmt: (x) => f(x, 1) + '%' }); const H = hist(c.pnl, 30); CTA.chart(CTA.$('#mch', out), { height: 180, labels: H.labels.map((l) => f(+l / 1000, 0) + 'k'), series: [{ type: 'bars', data: H.h, label: 'Paths', colorFn: (_, i) => (H.lo + H.w * (i + 0.5) < 0 ? 'var(--neg)' : 'var(--pos)') }], yMin: 0 }); } });
  }
  let el_cache = null;

  function portfolio(b, ds) {
    const R = {}; ds.names.forEach((n) => { R[n] = C.logReturns(ds.series[n]); });
    const vols = ds.names.map((n) => C.annualizedVol(R[n])); const corrM = ds.names.map((a) => ds.names.map((c) => C.correlation(R[a], R[c])));
    CTA.ui.calcWidget(b, { title: 'Portfolio diversification', tag: CTA.SIM, intro: 'Weights of a commodity book (they are normalised to 100%). Volatilities and correlations are estimated from the simulated dataset.',
      fields: ds.names.map((n, i) => ({ id: n, label: `${NAMES[n]} weight % (vol ${fmt.pct(vols[i] * 100, 1)})`, value: 25 })).concat([{ id: 'val', label: 'Book value (USD)', value: 20000000 }]),
      compute: (v) => { const w0 = ds.names.map((n) => Math.max(0, v[n] || 0)); const s = w0.reduce((a, c) => a + c, 0) || 1; const w = w0.map((x) => x / s); const pv = C.portfolioVol(w, vols, corrM); const avg = w.reduce((a, x, i) => a + x * vols[i], 0); const z = C.invNorm(0.99);
        return `${CTA.ui.kpis([{ label: 'Portfolio volatility', value: fmt.pct(pv * 100) }, { label: 'Weighted average volatility', value: fmt.pct(avg * 100), sub: 'what it would be at correlation 1' }, { label: 'Diversification benefit', value: fmt.pct((avg - pv) * 100), cls: 'pos' }, { label: '1-day 99% parametric VaR', value: fmt.money(z * pv / Math.sqrt(252) * v.val, 'USD', 0) }])}<p class="muted" style="font-size:.84rem">σp = √(wᵀΣw). Diversification helps only while correlations stay low; in stress they often rise toward 1.</p>`; } });
  }

  CTA.route('quant', { title: 'Quantitative Lab', desc: 'Statistics, correlation, VaR, Monte Carlo, diversification.', render(el, r) {
    const tab = r.parts[0] || 'stats'; const ds = CTA.MARKET.dataset(+(r.q.seed || 2024));
    el.innerHTML = `${CTA.pageHead('Quantitative Analysis Laboratory', 'Statistics of commodity returns, volatility, correlation and regression, Value at Risk, Expected Shortfall, Monte Carlo and diversification — with their assumptions and weaknesses. Model estimates are not forecasts.')}${CTA.tabs([['stats', 'Returns & volatility'], ['corr', 'Correlation & regression'], ['var', 'VaR, ES & Monte Carlo'], ['portfolio', 'Diversification']], tab, 'quant')}<div id="qb"></div>`;
    const b = CTA.$('#qb', el);
    if (tab === 'stats') stats(b, ds, r.q); else if (tab === 'corr') corr(b, ds, r.q); else if (tab === 'var') varLab(b, ds); else portfolio(b, ds);
  } });
})();

</script>
<script>
/* js/views/records.js */
/* Trading Journal, Performance Analytics, Glossary, Settings & Progress. */
(function () {
  const CTA = window.CTA, C = window.CALC, fmt = CTA.fmt, esc = CTA.esc;
  const f = (n, d = 0) => fmt.num(n, d);

  /* ================================================== Journal */
  const TYPES = ['physical', 'futures', 'negotiation', 'company', 'analysis', 'reflection'];
  CTA.route('journal', { title: 'Trading Journal', desc: 'Record theses, trades and lessons.', render(el, r) {
    const J = CTA.state.journal; const edit = r.parts[0] === 'edit' ? J.find((x) => x.id === r.parts[1]) : r.parts[0] === 'new' ? {} : null;
    if (edit) {
      el.innerHTML = `${CTA.pageHead(edit.id ? 'Edit journal entry' : 'New journal entry', 'A good entry records the thesis before the outcome, the plan (entry, stop, target, size), what happened and what you learned.')}
        <div class="card"><div class="form">${CTA.ui.field({ id: 'j-date', name: 'date', label: 'Date', type: 'date', value: edit.date || CTA.today() })}${CTA.ui.field({ id: 'j-type', name: 'type', label: 'Type', type: 'select', value: edit.type || 'reflection', options: TYPES })}${CTA.ui.field({ id: 'j-com', name: 'commodity', label: 'Commodity', type: 'select', value: edit.commodity || 'gold', options: ['gold', 'wheat', 'sugar', 'steel', 'multi'] })}${CTA.ui.field({ id: 'j-title', name: 'title', label: 'Title', type: 'text', value: edit.title || '', cls: 'full' })}${CTA.ui.field({ id: 'j-thesis', name: 'thesis', label: 'Thesis / plan', type: 'textarea', value: edit.thesis || '', cls: 'full', ph: 'Why this trade? What would prove you wrong?' })}${CTA.ui.field({ id: 'j-entry', name: 'entry', label: 'Entry', type: 'text', ph: 'optional', value: edit.entry == null ? '' : edit.entry })}${CTA.ui.field({ id: 'j-exit', name: 'exit', label: 'Exit', type: 'text', ph: 'optional', value: edit.exit == null ? '' : edit.exit })}${CTA.ui.field({ id: 'j-pnl', name: 'pnl', label: 'P&L (USD)', type: 'text', ph: 'optional', value: edit.pnl == null ? '' : edit.pnl })}${CTA.ui.field({ id: 'j-conf', name: 'confidence', label: 'Confidence (1–5)', type: 'select', value: edit.confidence || 3, options: [1, 2, 3, 4, 5] })}${CTA.ui.field({ id: 'j-emo', name: 'emotion', label: 'State of mind', type: 'select', value: edit.emotion || 'calm', options: ['calm', 'confident', 'anxious', 'impatient', 'fearful', 'overconfident'] })}${CTA.ui.field({ id: 'j-tags', name: 'tags', label: 'Tags (comma-separated)', type: 'text', value: (edit.tags || []).join(', ') })}${CTA.ui.field({ id: 'j-les', name: 'lessons', label: 'Outcome & lessons learned', type: 'textarea', value: edit.lessons || '', cls: 'full' })}</div>
        <div class="row" style="margin-top:10px"><button class="btn primary" id="jsave">Save</button><a class="btn" href="#/journal">Cancel</a></div></div>`;
      CTA.$('#jsave', el).onclick = () => { const v = CTA.ui.read(el); if (!v.title.trim()) { CTA.toast('A title is required.', 'warn'); return; } const num = (x) => { const t = String(x == null ? '' : x).replace(/,/g, '').trim(); return t === '' || isNaN(t) ? null : +t; }; const rec = Object.assign(edit, { date: v.date, type: v.type, commodity: v.commodity, title: v.title.trim(), thesis: v.thesis, entry: num(v.entry), exit: num(v.exit), pnl: num(v.pnl), confidence: +v.confidence, emotion: v.emotion, tags: v.tags.split(',').map((t) => t.trim()).filter(Boolean), lessons: v.lessons });
        if (!rec.id) { rec.id = CTA.uid('j'); rec.ts = Date.now(); J.unshift(rec); } CTA.save(); CTA.toast('Journal entry saved.', 'ok'); CTA.go('journal'); };
      return;
    }
    const q = (r.q.q || '').toLowerCase(), t = r.q.t || '', c = r.q.c || '';
    const list = J.filter((x) => (!t || x.type === t) && (!c || x.commodity === c) && (!q || JSON.stringify(x).toLowerCase().includes(q)));
    const pnl = list.reduce((s, x) => s + (x.pnl || 0), 0), wins = list.filter((x) => x.pnl > 0).length, withP = list.filter((x) => x.pnl != null).length;
    el.innerHTML = `${CTA.pageHead('Trading Journal', 'Simulator results are logged automatically (toggle in Settings). Add your own theses and reflections — reviewing them is how traders improve.', '', '<a class="btn primary" href="#/journal/new">+ New entry</a>')}
      ${CTA.ui.kpis([{ label: 'Entries shown', value: list.length }, { label: 'Total P&L shown', value: fmt.money(pnl, 'USD', 0), cls: fmt.cls(pnl) }, { label: 'Win rate', value: withP ? fmt.pct(wins / withP * 100, 0) : '—' }])}
      <div class="card"><div class="row"><input id="jq" type="search" placeholder="Search…" value="${esc(r.q.q || '')}" style="max-width:240px" aria-label="Search journal"><select id="jt" aria-label="Type" style="max-width:160px"><option value="">All types</option>${TYPES.map((x) => `<option ${x === t ? 'selected' : ''}>${x}</option>`).join('')}</select><select id="jc" aria-label="Commodity" style="max-width:160px"><option value="">All commodities</option>${['gold', 'wheat', 'sugar', 'steel', 'multi'].map((x) => `<option ${x === c ? 'selected' : ''}>${x}</option>`).join('')}</select><button class="btn sm" id="jcsv" ${J.length ? '' : 'disabled'}>Export CSV</button></div></div>
      ${list.length ? list.map((x) => `<div class="card"><div class="row between"><div><b>${esc(x.title)}</b> ${x.auto ? '<span class="badge">auto</span>' : ''} <span class="badge">${esc(x.type || '')}</span> ${x.commodity ? `<span class="badge t-${x.commodity}">${esc(x.commodity)}</span>` : ''}</div><div class="row"><span class="muted">${esc(x.date || '')}</span>${x.pnl != null ? `<b class="${fmt.cls(x.pnl)}">${fmt.money(x.pnl, 'USD', 0)}</b>` : ''}<a class="btn sm" href="#/journal/edit/${x.id}">Edit</a><button class="btn sm ghost" data-del="${x.id}" aria-label="Delete">✕</button></div></div>
        ${x.thesis ? `<p style="margin:6px 0 0"><b>Thesis:</b> ${esc(x.thesis)}</p>` : ''}${x.entry != null || x.exit != null ? `<p class="muted" style="margin:2px 0">Entry ${x.entry != null ? fmt.num(x.entry, 2) : '—'} · exit ${x.exit != null ? fmt.num(x.exit, 2) : '—'}${x.confidence ? ' · confidence ' + x.confidence + '/5' : ''}${x.emotion ? ' · ' + esc(x.emotion) : ''}</p>` : ''}${x.lessons ? `<p style="margin:4px 0 0"><b>Lessons:</b> ${esc(x.lessons)}</p>` : ''}${(x.tags || []).length ? `<div>${x.tags.map((g) => `<span class="badge info">${esc(g)}</span>`).join(' ')}</div>` : ''}</div>`).join('') : CTA.ui.empty('No journal entries', J.length ? 'No entries match the filters.' : 'Run a simulation or write your first reflection.', '<a class="btn primary" href="#/journal/new">Write an entry</a>')}`;
    const go = () => CTA.go(`journal?q=${encodeURIComponent(CTA.$('#jq', el).value)}&t=${CTA.$('#jt', el).value}&c=${CTA.$('#jc', el).value}`);
    CTA.$('#jq', el).onchange = go; CTA.$('#jt', el).onchange = go; CTA.$('#jc', el).onchange = go;
    CTA.$$('[data-del]', el).forEach((bt) => { bt.onclick = () => { if (!confirm('Delete this entry?')) return; CTA.state.journal = J.filter((x) => x.id !== bt.dataset.del); CTA.save(); CTA.render(); }; });
    const csv = CTA.$('#jcsv', el); if (csv) csv.onclick = () => { const cols = ['date', 'type', 'commodity', 'title', 'thesis', 'entry', 'exit', 'pnl', 'confidence', 'emotion', 'tags', 'lessons', 'auto']; const q2 = (v) => '"' + String(v == null ? '' : Array.isArray(v) ? v.join('; ') : v).replace(/"/g, '""') + '"'; CTA.download('trading-journal.csv', [cols.join(','), ...J.map((x) => cols.map((k) => q2(x[k])).join(','))].join('\n'), 'text/csv'); };
  } });

  /* ================================================== Performance */
  CTA.route('performance', { title: 'Performance Analytics', desc: 'Accuracy by topic, simulator results, study time.', render(el) {
    const st = CTA.state, P = CTA.progress; const ts = P.topicStats();
    const topics = Object.entries(ts).filter(([, x]) => x.n > 0);
    const days = []; for (let i = 29; i >= 0; i--) { const d = new Date(Date.now() - i * 86400000).toISOString().slice(0, 10); days.push([d.slice(5), (st.time.days[d] || 0) / 60]); }
    const cases = CTA.CASES.map((c) => [c, st.cases[c.id]]).filter(([, x]) => x);
    const comAvg = ['gold', 'wheat', 'sugar', 'steel'].map((k) => { const xs = cases.filter(([c]) => c.commodity === k).map(([, x]) => x.best); return [k, xs.length ? C.mean(xs) : null, xs.length]; });
    const deals = st.physical.completed; const nego = st.negotiations || [];
    const exams = Object.entries(st.exams);
    const weak = P.weakTopics();
    el.innerHTML = `${CTA.pageHead('Performance Analytics', 'Where you are strong, where you are weak, and how your simulated trading has gone. Mastery is measured by accuracy and decision quality, not time spent.')}
      ${CTA.ui.kpis([{ label: 'Overall mastery', value: fmt.pct(P.overall(), 0) }, { label: 'Lessons mastered', value: CTA.LESSONS.filter((l) => P.lessonDone(l.id)).length + '/' + CTA.LESSONS.length }, { label: 'Question accuracy', value: (() => { const a = Object.values(st.answers); const n = a.reduce((s, x) => s + x.n, 0); return n ? fmt.pct(a.reduce((s, x) => s + x.c, 0) / n * 100, 0) : '—'; })() }, { label: 'Exercise accuracy', value: (() => { const a = Object.values(st.exercises); const n = a.reduce((s, x) => s + x.n, 0); return n ? fmt.pct(a.reduce((s, x) => s + x.c, 0) / n * 100, 0) : '—'; })() }, { label: 'Cases completed', value: Object.keys(st.cases).length }, { label: 'Documents reviewed', value: Object.keys(st.docs).length + '/' + CTA.DOCS.length }, { label: 'Physical deals', value: deals.length, sub: deals.length ? 'avg score ' + Math.round(C.mean(deals.map((d) => d.score))) + '%' : '' }, { label: 'Exams passed', value: exams.filter(([, x]) => x.passed).length + '/12' }, { label: 'Study time', value: fmt.dur(st.time.total) }])}
      <div class="grid c2"><div class="card"><h3>Accuracy by subject</h3>${topics.length ? '<div id="pt"></div>' : CTA.ui.empty('No answers yet', 'Answer quizzes and exercises to see this chart.')}</div>
        <div class="card"><h3>Weak subjects & recommendations</h3>${weak.length ? weak.map((w) => `<div class="row between" style="padding:4px 0"><span>${esc(w.label)} <small class="muted">(${w.n} attempts)</small></span><span class="badge bad">${fmt.pct(w.acc, 0)}</span></div>`).join('') + '<p class="muted" style="font-size:.86rem;margin-top:8px">Review the related lessons, then use Exams → Practice to retake questions and exercises by topic.</p>' : '<p class="muted">No weak subjects detected (needs ≥ 3 attempts in a topic with accuracy below 65%).</p>'}
          <h4>Case performance by commodity</h4>${comAvg.map(([k, v, n]) => `<div class="row" style="padding:3px 0"><span class="badge t-${k}" style="width:60px;text-align:center">${k}</span><span style="flex:1">${CTA.ui.pbar(v || 0, k)}</span><span style="width:90px;text-align:right">${v == null ? '—' : Math.round(v) + '%'} <small class="muted">(${n})</small></span></div>`).join('')}</div></div>
      <div class="grid c2"><div class="card"><h3>Study time — last 30 days (minutes)</h3><div id="pst"></div></div><div class="card"><h3>Futures desk</h3>${st.futures ? '<div id="pfe"></div>' + CTA.ui.kpis([{ label: 'Trades', value: st.futures.history.length }, { label: 'Realised P&L', value: fmt.money(st.futures.history.reduce((s, h) => s + h.pnl, 0), 'USD', 0) }, { label: 'Max drawdown', value: fmt.pct(C.maxDrawdown(st.futures.equityHist) * 100) }]) : CTA.ui.empty('No futures activity', 'Start a scenario on the futures desk.')}</div></div>
      <div class="grid c2"><div class="card"><h3>Physical deals</h3>${deals.length ? CTA.table(['Date', 'Commodity', 'P&L', 'Score', 'Weakest skill'], deals.slice().reverse().map((d) => { const wk = Object.entries(d.cats).filter(([, v]) => v != null).sort((a, b) => a[1] - b[1])[0]; return [fmt.date(d.date), d.commodity, `<span class="${fmt.cls(d.pnl)}">${f(d.pnl)}</span>`, Math.round(d.score) + '%', wk ? CTA.SIM_CATS[wk[0]] + ' (' + Math.round(wk[1]) + '%)' : '—']; })) : CTA.ui.empty('No deals yet', '')}</div>
        <div class="card"><h3>Negotiations & exams</h3>${nego.length ? CTA.table(['Counterparty', 'Outcome', 'Score'], nego.slice(-6).reverse().map((n) => [esc(n.name), n.outcome, Math.round(n.score) + '%'])) : '<p class="muted">No negotiations yet.</p>'}${exams.length ? CTA.table(['Exam', 'Best', 'Attempts', 'Status'], exams.map(([k, x]) => [esc((CTA.EXAMS.find((e) => e.id === k) || { title: k }).title), Math.round(x.best) + '%', x.attempts, x.passed ? '<span class="badge ok">passed</span>' : '<span class="badge warn">not yet</span>'])) : '<p class="muted">No exams attempted.</p>'}</div></div>`;
    if (topics.length) CTA.chart(CTA.$('#pt', el), { height: 220, yMin: 0, yMax: 100, labels: topics.map(([k]) => CTA.TOPICS[k]), series: [{ type: 'bars', data: topics.map(([, x]) => x.acc), label: 'Accuracy %', colorFn: (v) => (v >= 70 ? 'var(--pos)' : v >= 50 ? 'var(--wheat)' : 'var(--neg)') }], hlines: [{ y: 70, color: 'var(--ink-3)', label: 'mastery 70%' }] });
    CTA.chart(CTA.$('#pst', el), { height: 170, yMin: 0, labels: days.map((d) => d[0]), series: [{ type: 'bars', data: days.map((d) => d[1]), label: 'Minutes', color: 'var(--c1)' }] });
    if (st.futures && CTA.$('#pfe', el)) CTA.chart(CTA.$('#pfe', el), { height: 140, series: [{ data: st.futures.equityHist, label: 'Equity', color: 'var(--c1)', type: 'area' }], labels: st.futures.equityHist.map((_, i) => 'D' + i) });
  } });

  /* ================================================== Glossary */
  CTA.route('glossary', { title: 'Glossary', desc: 'Searchable glossary of commodity trading terms.', render(el, r) {
    const cats = [...new Set(CTA.GLOSSARY.map((g) => g.cat))].sort();
    const q = (r.q.q || '').toLowerCase(), c = r.q.c || '';
    el.innerHTML = `${CTA.pageHead('Glossary', `${CTA.GLOSSARY.length} essential terms. Dotted-underlined terms anywhere in the academy show these definitions on hover or focus.`)}
      <div class="card"><div class="row"><input id="gq" type="search" value="${esc(r.q.q || '')}" placeholder="Search terms and definitions…" style="max-width:340px" aria-label="Search glossary"><select id="gc" aria-label="Category" style="max-width:200px"><option value="">All categories</option>${cats.map((x) => `<option ${x === c ? 'selected' : ''}>${x}</option>`).join('')}</select><span class="muted" id="gn"></span></div></div><div id="gl"></div>`;
    const draw = () => { const qq = CTA.$('#gq', el).value.toLowerCase().trim(), cc = CTA.$('#gc', el).value;
      const L = CTA.GLOSSARY.filter((g) => (!cc || g.cat === cc) && (!qq || (g.term + ' ' + g.def + ' ' + g.alias.join(' ')).toLowerCase().includes(qq)));
      CTA.$('#gn', el).textContent = L.length + ' terms';
      const byL = {}; L.forEach((g) => { const k = g.term[0].toUpperCase(); (byL[k] = byL[k] || []).push(g); });
      CTA.$('#gl', el).innerHTML = L.length ? Object.keys(byL).sort().map((k) => `<div class="card"><h3>${k}</h3><dl>${byL[k].map((g) => `<dt style="font-weight:700;margin-top:8px">${esc(g.term)} <span class="badge">${esc(g.cat)}</span>${g.alias.length ? ` <small class="muted">also: ${esc(g.alias.join(', '))}</small>` : ''}</dt><dd style="margin:2px 0 0">${esc(g.def)}</dd>`).join('')}</dl></div>`).join('') : CTA.ui.empty('No terms found', 'Try a broader search.'); };
    CTA.$('#gq', el).oninput = draw; CTA.$('#gc', el).onchange = draw; draw();
  } });

  /* ================================================== Settings */
  CTA.route('settings', { title: 'Settings & Progress', desc: 'Preferences, FX, contract specs, backup, tests.', render(el) {
    const st = CTA.state, s = st.settings; const specs = CTA.MARKET.specs();
    el.innerHTML = `${CTA.pageHead('Settings & Progress', 'Preferences, simulated exchange rates, illustrative contract specifications, backup and restore, and calculation self-tests.')}
      <div class="grid c2"><div class="card"><h3>Profile & preferences</h3><div class="form c2">${CTA.ui.field({ id: 's-name', name: 'name', label: 'Your name (for greetings and the certificate)', type: 'text', value: st.user.name })}${CTA.ui.field({ id: 's-cur', name: 'currency', label: 'Default display currency', type: 'select', value: s.currency, options: Object.keys(s.fx) })}</div>
        <label class="check"><input type="checkbox" id="s-free" ${s.freeNav ? 'checked' : ''}> <span><b>Free navigation</b> — unlock all stages regardless of mastery (progress is still recorded)</span></label>
        <label class="check"><input type="checkbox" id="s-aj" ${s.autoJournal ? 'checked' : ''}> <span><b>Auto-journal</b> — log simulator results to the Trading Journal</span></label>
        <button class="btn primary" id="s-save1">Save preferences</button></div>
      <div class="card"><h3>Exchange rates ${CTA.SIM}</h3><p class="muted" style="font-size:.86rem">Units of currency per 1 USD. These are simulated, editable values used only for conversions inside the academy — not live rates.</p><div class="form">${Object.entries(s.fx).map(([k, v]) => CTA.ui.field({ id: 'fx-' + k, name: 'fx-' + k, label: k, value: v, disabled: k === 'USD' })).join('')}</div><button class="btn primary" id="s-savefx">Save rates</button></div></div>
      <div class="card"><h3>Contract specifications ${CTA.ILLU}</h3><p class="muted" style="font-size:.86rem">Illustrative values used by the futures simulator. Verify real specifications, margins and fees with the exchange and your broker.</p><div class="table-wrap"><table><thead><tr><th>Code</th><th>Contract</th><th>Point value (USD per 1.0)</th><th>Tick</th><th>Initial margin</th><th>Maint. margin</th><th>Fee/side</th><th>Spread (ticks)</th><th>Slippage (ticks)</th></tr></thead><tbody>${Object.entries(specs).map(([k, x]) => `<tr><td>${k}</td><td>${esc(x.name)}</td>${['pointValue', 'tick', 'im', 'mm', 'fee', 'spreadTicks', 'slipTicks'].map((p) => `<td><input type="number" step="any" min="0" data-spec="${k}" data-p="${p}" value="${x[p]}" style="width:90px" aria-label="${k} ${p}"></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="row"><button class="btn primary" id="s-savespec">Save specifications</button><button class="btn" id="s-resetspec">Restore defaults</button></div></div>
      <div class="grid c2"><div class="card"><h3>Backup & restore</h3><p>Your progress is stored in this browser (localStorage, key <code>cta_state_v1</code>). ${CTA.storageOK ? '<span class="badge ok">saving works</span>' : '<span class="badge bad">storage blocked</span>'}</p><div class="row"><button class="btn" id="s-exp">Export progress (JSON)</button><label class="btn" for="s-imp">Import progress</label><input id="s-imp" type="file" accept="application/json" class="sr"></div><hr><button class="btn danger" id="s-reset">Reset all progress</button></div>
      <div class="card"><h3>Calculation self-tests</h3><p>Runs the same ${window.CTA_TESTS ? window.CTA_TESTS.count : ''} hand-verified test cases as <code>node tests/calc.test.js</code>: units, landed cost, P&L, futures, margin, options, statistics, shipping, hedging.</p><button class="btn primary" id="s-test">Run tests</button><div id="s-tres"></div></div></div>
      <div class="card"><h3>About this platform & limitations</h3><ul><li>All prices, counterparties, events and companies are simulated or fictional unless labelled as historical facts or links to official sources. No live market data is connected.</li><li>Contract specifications, margins and many ratios are illustrative teaching values.</li><li>Option pricing uses Black-76 with constant volatility; risk models are simplified and stated with their assumptions.</li><li>Documents are educational samples, not valid legal, banking, customs or shipping documents; requirements vary by jurisdiction, bank, carrier, commodity and contract.</li><li>Completing the academy does not confer any professional licence or industry certification.</li></ul></div>`;
    CTA.$('#s-save1', el).onclick = () => { st.user.name = CTA.$('#s-name', el).value.trim(); s.currency = CTA.$('#s-cur', el).value; s.freeNav = CTA.$('#s-free', el).checked; s.autoJournal = CTA.$('#s-aj', el).checked; CTA.save(true); CTA.toast('Preferences saved.', 'ok'); };
    CTA.$('#s-savefx', el).onclick = () => { let bad = false; Object.keys(s.fx).forEach((k) => { if (k === 'USD') return; const v = CTA.num(CTA.$('#fx-' + k, el).value, NaN); if (!(v > 0)) bad = true; else s.fx[k] = v; }); CTA.save(true); CTA.toast(bad ? 'Some rates were invalid (must be > 0) and were not changed.' : 'Rates saved.', bad ? 'warn' : 'ok'); };
    CTA.$('#s-savespec', el).onclick = () => { const ov = {}; let bad = false; CTA.$$('[data-spec]', el).forEach((i) => { const v = CTA.num(i.value, NaN); if (!(v >= 0)) { bad = true; return; } (ov[i.dataset.spec] = ov[i.dataset.spec] || {})[i.dataset.p] = v; }); Object.entries(ov).forEach(([k, o]) => { if (o.mm > o.im) { o.mm = o.im; bad = true; } if (!(o.pointValue > 0) || !(o.tick > 0)) bad = true; }); if (bad) { CTA.toast('Invalid values: point value and tick must be > 0, maintenance ≤ initial margin.', 'bad'); return; } s.specs = ov; CTA.save(true); CTA.toast('Specifications saved. They apply to new orders and scenarios.', 'ok'); };
    CTA.$('#s-resetspec', el).onclick = () => { s.specs = {}; CTA.save(true); CTA.render(); };
    CTA.$('#s-exp', el).onclick = () => CTA.download('commodity-academy-progress-' + CTA.today() + '.json', JSON.stringify(st, null, 1));
    CTA.$('#s-imp', el).onchange = (e) => { const file = e.target.files[0]; if (!file) return; const rd = new FileReader(); rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o || o.v !== 1 || !o.settings) throw new Error('Not an academy progress file'); localStorage.setItem('cta_state_v1', JSON.stringify(o)); CTA.toast('Progress imported — reloading.', 'ok'); setTimeout(() => location.reload(), 700); } catch (err) { CTA.toast('Import failed: ' + esc(err.message), 'bad'); } }; rd.readAsText(file); };
    CTA.$('#s-reset', el).onclick = () => { if (!confirm('Erase ALL progress, simulations, journal and settings? This cannot be undone. Consider exporting first.')) return; CTA.resetState(); CTA.toast('Progress reset.', 'ok'); CTA.buildShell(); CTA.render(); };
    CTA.$('#s-test', el).onclick = () => { const res = window.CTA_TESTS.run(C); const fail = res.filter((x) => !x.pass); CTA.$('#s-tres', el).innerHTML = `<div class="note ${fail.length ? 'bad' : 'ok'}"><strong>${res.length - fail.length}/${res.length} passed</strong></div>` + CTA.table(['', 'Test', 'Expected', 'Got'], res.map((x) => [x.pass ? '✔' : '✘', esc(x.name), fmt.num(x.expected, 6), x.err ? esc(x.err) : fmt.num(x.got, 6)])); };
  } });
})();

</script>
<script>
/* js/views/exams.js */
/* Exams & Certifications — 11 subject exams (MCQ + numerical, drawn fresh per attempt), the full commodity trading
 * case exam (Physical Trading Simulator in exam mode), a practice bank, and an educational completion certificate.
 * Completion does NOT confer any professional licence or industry certification. */
(function () {
  const CTA = window.CTA, C = window.CALC, fmt = CTA.fmt, esc = CTA.esc;
  let timer = null;
  CTA.EXAMS = [
    { id: 'fundamentals', title: 'Commodity Trading Fundamentals', topics: ['foundations', 'accounting', 'markets'], mcq: 15, num: 3 },
    { id: 'gold', title: 'Gold Trading', topics: ['gold'], extra: ['pg1', 'pg2', 'pg3'], mcq: 12, num: 3 },
    { id: 'wheat', title: 'Wheat Trading', topics: ['wheat'], extra: ['pwh1', 'pwh2', 'dh1', 'dh4'], mcq: 12, num: 3 },
    { id: 'sugar', title: 'Sugar Trading', topics: ['sugar'], extra: ['ps1', 'ps2', 'ps3'], mcq: 10, num: 3 },
    { id: 'steel', title: 'Steel Trading', topics: ['steel'], extra: ['pst1', 'pst2'], mcq: 10, num: 3 },
    { id: 'physical', title: 'Physical Commodity Trading', topics: ['physical'], numTopics: ['foundations'], mcq: 12, num: 3 },
    { id: 'trade-finance', title: 'Trade Finance', topics: ['finance', 'incoterms', 'documents'], mcq: 15, num: 3 },
    { id: 'shipping', title: 'International Shipping', topics: ['logistics'], extra: ['ti1', 'ti2', 'ti3', 'fe4'], numTopics: ['logistics'], mcq: 8, num: 4 },
    { id: 'risk', title: 'Risk Management', topics: ['risk'], extra: ['dh3', 'ar1', 'ar2'], mcq: 10, num: 3 },
    { id: 'financial', title: 'Commodity Financial Markets', topics: ['derivatives', 'options', 'spreads'], mcq: 15, num: 4 },
    { id: 'quant', title: 'Quantitative Market Analysis', topics: ['quant', 'analysis'], mcq: 12, num: 3 },
    { id: 'final-case', title: 'Full Commodity Trading Case', final: true },
  ];
  const shuffle = (a, r) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  function record(id, score, extra) {
    const e = CTA.state.exams[id] || { best: 0, attempts: 0, passed: false };
    e.attempts++; e.best = Math.max(e.best, score); e.passed = e.passed || (extra && extra.passed != null ? extra.passed : score >= 70); e.last = Object.assign({ score, ts: Date.now() }, extra || {});
    CTA.state.exams[id] = e; CTA.save(true); CTA.log(`Exam "${(CTA.EXAMS.find((x) => x.id === id) || {}).title}": ${Math.round(score)}% ${e.passed ? '(passed)' : ''}`, 'exam'); CTA.updateTopStats();
  }

  function runExam(b, ex) {
    const r = C.rng(Date.now() % 1e9);
    const pool = CTA.QUESTIONS.filter((q) => ex.topics.includes(q.t) || (ex.extra || []).includes(q.id));
    const qs = shuffle(pool, r).slice(0, Math.min(ex.mcq, pool.length));
    const npool = CTA.EXERCISES.filter((e) => (ex.numTopics || ex.topics).includes(e.topic));
    const nums = shuffle(npool, r).slice(0, Math.min(ex.num, npool.length)).map((e) => ({ e, inst: e.gen(C.rng(Math.floor(r() * 1e9))) }));
    const total = qs.length + nums.length; let secs = total * 90;
    b.innerHTML = `<div class="card"><div class="row between"><h3 style="margin:0">${esc(ex.title)} — examination</h3><span class="badge warn" id="exT"></span></div><p class="muted">${qs.length} multiple-choice and ${nums.length} numerical questions · pass mark 70% · feedback after submission. Numerical answers accept reasonable rounding.</p>
      <div id="exq"></div><h3>Numerical questions</h3>${nums.map((n, i) => `<div class="exercise" data-n="${i}"><div class="ex-h"><span class="badge">${esc(CTA.TOPICS[n.e.topic])}</span><h4>${esc(n.e.title)}</h4></div><div class="ex-prompt">${CTA.rich(n.inst.prompt)}</div><div class="row"><input type="text" inputmode="decimal" style="max-width:200px" aria-label="Answer"><span class="muted">${esc(n.inst.unit || '')}</span></div><div class="fb"></div></div>`).join('')}
      <div class="row"><button class="btn primary" id="exSub">Submit examination</button><a class="btn ghost" href="#/exams">Abandon</a></div><div id="exRes"></div></div>`;
    let submitted = false;
    CTA.ui.quiz(CTA.$('#exq', b), qs.map((q) => q.id), { exam: true });
    const innerSubmit = CTA.$('#exq .submit', b); if (innerSubmit) innerSubmit.style.display = 'none';
    const tick = () => { const m = Math.floor(secs / 60), s = secs % 60; const el = CTA.$('#exT', b); if (!el) { clearInterval(timer); return; } el.textContent = `⏱ ${m}:${String(s).padStart(2, '0')}`; if (secs-- <= 0) { clearInterval(timer); CTA.toast('Time is up — submitting.', 'warn'); submit(true); } };
    clearInterval(timer); timer = setInterval(tick, 1000); tick(); CTA.cleanup = () => clearInterval(timer);
    const submit = (force) => {
      if (submitted) return;
      const unanswered = CTA.$$('#exq .q', b).filter((q) => !CTA.$('input:checked', q)).length + CTA.$$('[data-n] input', b).filter((i) => !i.value.trim()).length;
      if (!force && unanswered && !confirm(unanswered + ' question(s) unanswered — they count as wrong. Submit?')) return;
      submitted = true; clearInterval(timer);
      // grade MCQ via the quiz component (without its confirm dialog)
      CTA.$$('#exq .q', b).forEach((qEl) => { const q = CTA.Q_INDEX[qEl.dataset.q]; const sel = CTA.$('input:checked', qEl); const chosen = sel ? +sel.value : -1; const ok = chosen === q.a; CTA.record.answer(q.id, ok); CTA.$$('.opt', qEl).forEach((l) => { const i = +l.dataset.oi; l.classList.toggle('right', i === q.a); l.classList.toggle('wrong', i === chosen && !ok); CTA.$('input', l).disabled = true; }); CTA.$('.q-fb', qEl).innerHTML = `<div class="note ${ok ? 'ok' : 'bad'}"><strong>${ok ? 'Correct.' : 'Incorrect.'}</strong>${CTA.rich(q.e)}</div>`; qEl.dataset.ok = ok ? 1 : 0; });
      const byT = {}; const addT = (t, ok) => { byT[t] = byT[t] || [0, 0]; byT[t][1]++; if (ok) byT[t][0]++; };
      let correct = 0;
      CTA.$$('#exq .q', b).forEach((qEl) => { const ok = qEl.dataset.ok === '1'; if (ok) correct++; addT(CTA.Q_INDEX[qEl.dataset.q].t, ok); });
      nums.forEach((n, i) => { const box = CTA.$(`[data-n="${i}"]`, b); const v = CTA.num(CTA.$('input', box).value, NaN); const ok = !isNaN(v) && C.within(v, n.inst.answer, n.inst.tol, n.inst.tolRel); CTA.record.exercise(n.e.id, ok); if (ok) correct++; addT(n.e.topic, ok); CTA.$('input', box).disabled = true;
        CTA.$('.fb', box).innerHTML = `<div class="note ${ok ? 'ok' : 'bad'}"><strong>${ok ? 'Correct' : 'Incorrect'} — answer ${fmt.num(n.inst.answer, n.inst.dp == null ? 2 : n.inst.dp)} ${esc(n.inst.unit || '')}</strong>Formula: ${CTA.rich(n.inst.formula)}<ol style="margin:4px 0 0">${n.inst.steps.map((s) => `<li>${CTA.rich(s)}</li>`).join('')}</ol>${n.inst.mistakes ? `<p class="mistake" style="margin-top:4px">${CTA.rich(n.inst.mistakes)}</p>` : ''}</div>`; });
      const score = correct / total * 100; record(ex.id, score, { byTopic: byT });
      const weak = Object.entries(byT).filter(([, x]) => x[0] / x[1] < 0.7);
      CTA.$('#exSub', b).remove();
      CTA.$('#exRes', b).innerHTML = `<div class="note ${score >= 70 ? 'ok' : 'bad'}"><strong>Result: ${correct}/${total} = ${Math.round(score)}% — ${score >= 70 ? 'PASSED' : 'not passed (70% required)'}</strong></div>${CTA.table(['Subject', 'Score'], Object.entries(byT).map(([t, x]) => [CTA.TOPICS[t], `${x[0]}/${x[1]} (${Math.round(x[0] / x[1] * 100)}%)`]))}${weak.length ? `<p><b>Improve before retaking:</b> ${weak.map(([t]) => esc(CTA.TOPICS[t])).join(', ')} — review the related lessons and practise by topic.</p>` : ''}<div class="row"><a class="btn primary" href="#/exams/${ex.id}?r=${Date.now()}">Retake (new questions)</a><a class="btn" href="#/exams">All exams</a></div>`;
      CTA.$('#exRes', b).scrollIntoView({ behavior: 'smooth' });
    };
    CTA.$('#exSub', b).onclick = () => submit(false);
  }

  function finalCase(b) {
    const st = CTA.state.physical;
    const done = (rec) => {
      const passed = rec.score >= 70 && (rec.cats.risk == null || rec.cats.risk >= 60) && (rec.cats.financial == null || rec.cats.financial >= 50);
      record('final-case', rec.score, { passed, deal: rec.id, cats: rec.cats, pnl: rec.pnl });
      b.innerHTML = `<div class="note ${passed ? 'ok' : 'bad'}"><strong>${passed ? 'Final case PASSED' : 'Final case not passed'}</strong>Pass requires an overall decision score ≥ 70%, risk management ≥ 60% and financial accuracy ≥ 50%. Profit alone does not pass the exam.</div>${CTA.physicalReport(rec)}<div class="row"><a class="btn" href="#/exams">Back to exams</a></div>`;
    };
    if (st.active && st.active.exam) { CTA.physicalRunner(b, { onFinish: done, onAbandon: () => CTA.render() }); return; }
    if (st.active && !st.active.exam) { b.innerHTML = '<div class="note warn"><strong>A practice deal is in progress</strong>Finish or abandon it in the Physical Trading Simulator before starting the examination.</div><a class="btn" href="#/physical/workflow">Open simulator</a>'; return; }
    const e = CTA.state.exams['final-case'];
    b.innerHTML = `<div class="card"><h3>Full Commodity Trading Case — examination</h3><p>You will run a complete international transaction through all 25 steps: analyse the buyer's requirements, compare suppliers and quality, calculate landed cost, choose delivery terms, negotiate, assess financing, prepare documents, evaluate counterparties, decide whether to hedge, monitor shipment, handle an unexpected problem, and calculate the final P&L. <b>No feedback is shown until the end.</b></p>
      <p>Your decisions are evaluated throughout — commercial judgment, financial accuracy, market understanding, risk management, documentation, negotiation and operational execution. A risky deal that happens to make money does not receive a perfect score.</p>
      ${e ? `<p>Best so far: <b>${Math.round(e.best)}%</b> · attempts ${e.attempts} · ${e.passed ? '<span class="badge ok">passed</span>' : '<span class="badge warn">not yet passed</span>'}</p>` : ''}
      <div class="row"><label for="fcom">Commodity</label><select id="fcom" style="max-width:180px"><option value="wheat">Wheat (recommended)</option><option value="sugar">Sugar</option><option value="steel">Steel</option><option value="gold">Gold</option></select><button class="btn primary" id="fstart">Start the examination</button></div></div>`;
    CTA.$('#fstart', b).onclick = () => { st.active = CTA.physicalNewRun(CTA.$('#fcom', b).value, true); CTA.save(); CTA.render(); };
  }

  function practice(b, r) {
    const t = r.q.t || 'foundations';
    const qs = CTA.QUESTIONS.filter((q) => q.t === t), exs = CTA.EXERCISES.filter((e) => e.topic === t);
    b.innerHTML = `<div class="card"><div class="row">${Object.entries(CTA.TOPICS).map(([k, l]) => { const n = CTA.QUESTIONS.filter((q) => q.t === k).length + CTA.EXERCISES.filter((e) => e.topic === k).length; return n ? `<a class="btn sm ${k === t ? 'primary' : ''}" href="#/exams/practice?t=${k}">${l} (${n})</a>` : ''; }).join('')}</div></div>
      <div class="grid c2"><div><h3>Questions — ${esc(CTA.TOPICS[t])} (${qs.length})</h3><div id="pq"></div></div><div><h3>Numerical exercises (${exs.length})</h3><div id="pe"></div></div></div>
      <div class="card"><h3>Case studies and multi-stage simulations across the academy</h3>${CTA.table(['Collection', 'Count', 'Where'], [['Commodity practical cases', CTA.CASES.length, '<a href="#/gold/cases">Gold</a> · <a href="#/wheat/cases">Wheat</a> · <a href="#/sugar/cases">Sugar</a> · <a href="#/steel/cases">Steel</a>'], ['Spread & arbitrage exercises', (CTA.SPREAD_CASES || []).length, '<a href="#/analysis/spreads">Analysis Lab</a>'], ['Logistics disruption scenarios', (CTA.DISRUPTIONS || []).length, '<a href="#/logistics/disruptions">Logistics</a>'], ['LC discrepancy examinations', 3, '<a href="#/finance/lc">Trade Finance</a>'], ['Multi-stage simulations', '4 physical deals + 10 futures scenarios + company + 6 negotiations + final exam', '<a href="#/physical">Physical</a> · <a href="#/futures">Futures</a> · <a href="#/dealroom">Deal Room</a>']])}</div>`;
    if (qs.length) CTA.ui.quiz(CTA.$('#pq', b), qs.map((q) => q.id), {}); else CTA.$('#pq', b).innerHTML = '<p class="muted">No questions in this topic.</p>';
    const pe = CTA.$('#pe', b); if (!exs.length) pe.innerHTML = '<p class="muted">No numerical exercises in this topic.</p>';
    exs.forEach((e) => { const d = document.createElement('div'); pe.appendChild(d); CTA.ui.exercise(d, e, { seed: Math.floor(Math.random() * 1e9) }); });
  }

  function certificate(b) {
    const ex = CTA.EXAMS.map((e) => [e, CTA.state.exams[e.id]]); const all = ex.every(([, x]) => x && x.passed);
    const name = CTA.state.user.name || '(set your name in Settings)';
    b.innerHTML = all ? `<div class="cert"><p style="letter-spacing:.2em;font-size:.8rem">COMMODITY TRADING ACADEMY</p><h1 style="font-family:Georgia,serif">Certificate of Completion</h1><p>This educational certificate records that</p><h2 style="font-family:Georgia,serif">${esc(name)}</h2><p>completed the twelve examinations of the Commodity Trading Academy simulation programme on ${fmt.date(Date.now())}, including the full commodity trading case.</p>${CTA.table(['Examination', 'Best score'], ex.map(([e, x]) => [esc(e.title), Math.round(x.best) + '%']))}<p class="muted" style="font-size:.8rem">This is a self-study record from an educational simulation. It is not a professional licence, qualification or industry certification, and it does not attest to competence for regulated activities.</p><button class="btn primary" onclick="window.print()">Print</button></div>` :
      `<div class="card"><h3>Certificate of completion (educational)</h3><p>Pass all 12 examinations to unlock a printable completion record. It is not a professional licence or industry certification.</p>${CTA.table(['Examination', 'Status'], ex.map(([e, x]) => [esc(e.title), x ? (x.passed ? `<span class="badge ok">passed ${Math.round(x.best)}%</span>` : `<span class="badge warn">best ${Math.round(x.best)}%</span>`) : '<span class="badge">not attempted</span>']))}</div>`;
  }

  CTA.route('exams', { title: 'Exams & Certifications', desc: '12 examinations, practice bank, certificate.', render(el, r) {
    clearInterval(timer);
    const id = r.parts[0];
    const tabs = [['list', 'Examinations'], ['practice', 'Practice bank'], ['certificate', 'Certificate']];
    const ex = id && CTA.EXAMS.find((e) => e.id === id);
    el.innerHTML = `${CTA.pageHead('Exams & Certifications', 'Twelve examinations: eleven subject exams drawn fresh from the question and exercise banks, and a full commodity trading case evaluated on decision quality. Pass mark 70%.')}${CTA.tabs(tabs, ex ? 'list' : id || 'list', 'exams')}<div id="eb"></div>`;
    const b = CTA.$('#eb', el);
    if (id === 'practice') return practice(b, r);
    if (id === 'certificate') return certificate(b);
    if (ex) return ex.final ? finalCase(b) : runExam(b, ex);
    b.innerHTML = `<div class="grid c3">${CTA.EXAMS.map((e, i) => { const s = CTA.state.exams[e.id]; const pool = e.final ? null : CTA.QUESTIONS.filter((q) => e.topics.includes(q.t) || (e.extra || []).includes(q.id)).length;
      return `<div class="card"><div class="row between"><b>${i + 1}. ${esc(e.title)}</b>${s ? (s.passed ? '<span class="badge ok">passed</span>' : '<span class="badge warn">' + Math.round(s.best) + '%</span>') : ''}</div><p class="muted" style="font-size:.86rem">${e.final ? 'Complete 25-step international transaction in exam mode; graded on seven skills.' : `${Math.min(e.mcq, pool)} MCQ (pool ${pool}) + ${e.num} numerical · ~${Math.round((Math.min(e.mcq, pool) + e.num) * 1.5)} min`}</p>${s ? `<small>Attempts ${s.attempts} · best ${Math.round(s.best)}%</small><br>` : ''}<a class="btn ${e.final ? 'primary' : ''} sm" href="#/exams/${e.id}">${s ? 'Retake' : 'Start'}</a></div>`; }).join('')}</div>`;
  } });
})();

</script>
<script>
/* tests/calc.test.js */
/* Commodity Trading Academy — calculation tests
 * Run in Node:     node commodity_trading_academy/tests/calc.test.js
 * Run in browser:  Settings & Progress → "Run calculation self-tests" (same cases).
 * Expected values were worked out by hand; the working is in the comment next to each case.
 */
(function (root) {
  'use strict';
  const CASES = [
    /* ---------- units ---------- */
    ['1 kg = 32.1507 troy oz', (C) => C.convertMass(1, 'kg', 'ozt'), 32.1507466, 1e-6],
    ['1 troy oz = 31.1035 g', (C) => C.convertMass(1, 'ozt', 'g'), 31.1034768, 1e-9],
    ['1 troy oz = 1.09714 avoirdupois oz (they are different units)', (C) => C.convertMass(1, 'ozt', 'oz'), 1.0971428571, 1e-8],
    ['1 metric ton = 1.10231 short tons', (C) => C.convertMass(1, 't', 'st'), 1.10231131, 1e-7],

      const pass = !err && Math.abs(got - expected) <= tol + 1e-12;

    });

<script>
/* js/views/physical.js */
/* Physical Trading Simulator — 25-step deal workflow engine, Deal Calculator and deal history.
 * Every step requires a decision. Choices change the deal economics, the events that occur and the
 * multi-dimensional score. Outcomes are deterministic for a given run seed (reproducible), so a risky
 * choice may or may not be punished in a particular run — but it is always scored as risky. */
(function () {
  const CTA = window.CTA, C = window.CALC, fmt = CTA.fmt, esc = CTA.esc;
  const f = (n, d = 2) => fmt.num(n, d);
  const CATS = { commercial: 'Commercial judgment', financial: 'Financial accuracy', market: 'Market understanding', risk: 'Risk management', documentation: 'Documentation', negotiation: 'Negotiation', operational: 'Operational execution' };
  const WEIGHTS = { commercial: 15, financial: 15, market: 10, risk: 20, documentation: 15, negotiation: 10, operational: 15 };
  CTA.SIM_CATS = CATS;

  const STAGES = ['Receive buyer inquiry', 'Understand specifications', 'Identify potential suppliers', 'Evaluate supplier credibility', 'Request quotations', 'Compare offers', 'Calculate total acquisition cost', 'Determine destination market price', 'Calculate expected profit', 'Assess financing requirements', 'Evaluate logistics & delivery', 'Counterparty due diligence', 'Negotiate commercial terms', 'Draft the sales contract', 'Draft the purchase contract', 'Arrange financing & hedging', 'Arrange inspection', 'Arrange transportation', 'Prepare documents', 'Monitor shipment', 'Handle delays & unexpected events', 'Complete delivery', 'Receive payment', 'Reconcile the transaction', 'Final profit or loss'];
  CTA.SIM_STAGES = STAGES;

  /* ------------------------------------------------------------ deal model */
  function pick(arr, id, def) { return arr.find((x) => x.id === id) || arr.find((x) => x.id === def) || arr[0]; }
  function model(run, assume) {
    const sc = CTA.SIM_SCENARIOS[run.commodity], s = run.sel, a = assume || {};
    const sup = pick(sc.suppliers, a.sup || s.supplier, 'S2'), buyer = pick(sc.buyers, a.buyer || s.buyer, 'B'), route = pick(sc.routes, a.route || s.route, 'R1'), fin = pick(sc.finance, a.fin || s.finance, 'F1'), insp = pick(sc.inspection, a.insp || s.inspection, 'I1');
    const ev = run.ev || {};
    const qty = sc.qty, qtyDel = qty * (1 - (ev.shortPct || 0) / 100);
    const B0 = sc.benchmark.B0, buyPx = B0 + sup.diff;
    const value = qtyDel * buyPx;
    const perUnit = route.freight + sc.costs.perUnit.reduce((x, c) => x + c[1], 0);
    const pctCosts = sc.costs.pct.reduce((x, c) => x + c[1], 0);
    const lumps = sc.costs.lump.filter((c) => !/nspection/.test(c[0])).reduce((x, c) => x + c[1], 0) + insp.cost;
    const costs = qtyDel * perUnit + value * pctCosts / 100 + lumps;
    const neg = s.nego || {};
    const prem = buyer.prem - (neg.security === 'sblc' ? (sc.unit === 'oz' ? 0.3 : 1) : 0);
    const delayDays = (ev.delayDays || 0) + (ev.payDelay || 0);
    const days = (sc.unit === 'oz' ? 2 : 6) + route.days + buyer.payDays + delayDays;
    const financed = (value + costs) * fin.share / 100;
    const finCost = C.interest(financed, fin.rate, days);
    const equityCost = C.interest((value + costs) * (1 - fin.share / 100), fin.equityCost, days);
    const move = a.noMarket ? 0 : sc.market.movePct, B1 = B0 * (1 + move / 100);
    const salePx = B1 + prem;
    const revenue = qtyDel * salePx;
    const h = a.noMarket ? 0 : (s.hedge || 0) / 100;
    const hedge = -qty * B0 * sc.market.futMovePct / 100 * h;
    const hedgeCost = value * 0.00015 * h;
    const credIns = neg.security === 'insurance' ? revenue * 0.0035 : 0;
    const eventCosts = (ev.costs || []).reduce((x, c) => x + c[1], 0);
    const net = revenue - value - costs - finCost - hedgeCost - credIns - eventCosts + hedge;
    return { sc, sup, buyer, route, fin, insp, qty, qtyDel, B0, B1, buyPx, value, perUnit, pctCosts, lumps, costs, prem, days, financed, finCost, equityCost, salePx, revenue, hedge, hedgeCost, credIns, eventCosts, net, landedPerUnit: (value + costs) / qtyDel };
  }
  CTA.simModel = model;

  /* ------------------------------------------------------------ events (deterministic per seed) */
  function rollEvents(run) {
    const sc = CTA.SIM_SCENARIOS[run.commodity], s = run.sel, r = C.rng(run.seed);
    const sup = pick(sc.suppliers, s.supplier, 'S2'), route = pick(sc.routes, s.route, 'R1'), insp = pick(sc.inspection, s.inspection, 'I1'), buyer = pick(sc.buyers, s.buyer, 'B');
    const e = { list: [] };
    const u1 = r(), u2 = r(), u3 = r(), u4 = r(), u5 = r(), u6 = r();
    if (sup.reliability < 0.7) e.list.push('supplierShort'); else if (u1 > sup.reliability) e.list.push('loadDelay');
    if (u2 < route.delayRisk) e.list.push('routeDelay');
    if (u3 < route.damageRisk) e.list.push('damage');
    e.claim = u4 < insp.claimRisk * (sup.reliability < 0.7 ? 1.6 : 1) * ((s.nego || {}).quality === 'discharge' ? 1.5 : 1);
    e.default = buyer.security === 'none' && u5 < buyer.pd * 6;
    e.extension = buyer.security === 'none' && !e.default;
    e.discrepancy = /LC/.test(buyer.security) && (run.docScore == null || run.docScore < 0.85 || (buyer.security === 'unconfirmed LC' && u6 < 0.35));
    if (!e.list.length) e.list.push('none');
    return e;
  }

  /* ------------------------------------------------------------ scoring */
  function score(run, stage, cats, val, note) {
    run.scores = run.scores.filter((x) => x.stage !== stage);
    run.scores.push({ stage, cats: [].concat(cats), score: Math.max(0, Math.min(100, Math.round(val))), note });
  }
  function report(run) {
    const by = {}; Object.keys(CATS).forEach((k) => { by[k] = []; });
    run.scores.forEach((s) => s.cats.forEach((c) => by[c] && by[c].push(s.score)));
    const cat = {}; let wsum = 0, tot = 0;
    Object.keys(CATS).forEach((k) => { cat[k] = by[k].length ? by[k].reduce((a, b) => a + b, 0) / by[k].length : null; if (cat[k] != null) { tot += cat[k] * WEIGHTS[k]; wsum += WEIGHTS[k]; } });
    return { cat, overall: wsum ? tot / wsum : 0 };
  }
  const jaccard = (picked, truth) => { const P = new Set(picked), T = new Set(truth); const inter = [...P].filter((x) => T.has(x)).length; const uni = new Set([...P, ...T]).size; return uni ? inter / uni : 1; };

  /* ------------------------------------------------------------ stage definitions
   * each: render(run, m) → html ; read(run, root) → returns {ok:false,msg} or applies selections and returns {fb, score...} */
  let RSEED = 1;
  const hash = (t) => [...t].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  const radio = (name, opts, cur) => CTA.shuffleIdx(opts.length, RSEED + hash(name)).map((i) => opts[i]).map((o, i) => `<label class="choice ${cur === o.v ? 'sel' : ''}"><input type="radio" name="${name}" value="${esc(o.v)}" ${cur === o.v ? 'checked' : ''}><span class="ch-t">${o.t}</span>${o.d ? `<div class="ch-d">${o.d}</div>` : ''}</label>`).join('');
  const checks = (name, opts) => opts.map((o) => `<label class="check"><input type="checkbox" name="${name}" value="${esc(o.v)}"> <span>${o.t}</span></label>`).join('');
  const val = (root, name) => { const x = CTA.$(`input[name="${name}"]:checked`, root); return x ? x.value : null; };
  const vals = (root, name) => CTA.$$(`input[name="${name}"]:checked`, root).map((x) => x.value);
  const numIn = (id, unit) => `<div class="row"><input type="text" inputmode="decimal" id="${id}" style="max-width:220px" aria-label="Your answer"><span class="muted">${esc(unit)}</span></div>`;
  const numVal = (root, id) => CTA.num(CTA.$('#' + id, root).value, NaN);
  const supTable = (sc, ids) => CTA.table(['Supplier', 'Origin', 'Years', 'Rating', 'Differential', 'Payment asked', 'Notes'], sc.suppliers.filter((s) => !ids || ids.includes(s.id)).map((s) => [`<b>${esc(s.name)}</b> <span class="muted">(fictional)</span>`, esc(s.country), s.years, s.rating, (s.diff >= 0 ? '+' : '') + f(s.diff) + ' ' + esc(sc.priceUnit), esc(s.pay), esc(s.notes)]));

  const S = [];
  /* 1 */ S.push({ cats: ['commercial', 'risk'], render: (run) => { const sc = CTA.SIM_SCENARIOS[run.commodity]; return `<div class="doc" style="margin-bottom:10px"><div class="wm">FICTIONAL</div><b>INQUIRY</b><p>${esc(sc.inquiry)}</p></div><p>How do you qualify this inquiry before investing time?</p>${radio('q1', [{ v: 'kyc', t: 'Acknowledge, request company details for preliminary KYC and confirm the buyer\'s intended payment method before quoting', d: 'Qualifies the buyer and its credit early.' }, { v: 'quote', t: 'Send a firm price immediately to win the business' }, { v: 'ignore', t: 'Ignore it — unsolicited inquiries are always fake' }], run.sel.q1)}`; },
    read: (run, root) => { const v = val(root, 'q1'); if (!v) return { ok: false }; run.sel.q1 = v; const sc0 = { kyc: 100, quote: 30, ignore: 10 }[v]; score(run, 0, ['commercial', 'risk'], sc0); return { fb: v === 'kyc' ? 'Good: you qualify the counterparty and payment terms before committing price or time.' : v === 'quote' ? 'Quoting firm before knowing who the buyer is and how it pays exposes you to price and credit risk.' : 'Many inquiries are genuine; qualify rather than ignore.', s: sc0 }; } });
  /* 2 */ S.push({ cats: ['market', 'commercial'], render: (run) => { const sc = CTA.SIM_SCENARIOS[run.commodity]; return `<p>Which items must be confirmed and written into the specification before you source? (select all that apply)</p>${checks('q2', sc.specItems.map(([t], i) => ({ v: String(i), t: esc(t) })))}`; },
    read: (run, root) => { const sc = CTA.SIM_SCENARIOS[run.commodity]; const p = vals(root, 'q2'); const truth = sc.specItems.map((x, i) => (x[1] ? String(i) : null)).filter((x) => x != null); const j = jaccard(p, truth); run.sel.q2 = p; score(run, 1, ['market', 'commercial'], j * 100); return { fb: `You matched ${Math.round(j * 100)}% of the critical items. Critical: ${sc.specItems.filter((x) => x[1]).map((x) => x[0]).join('; ')}.`, s: j * 100 }; } });
  /* 3 */ S.push({ cats: ['commercial'], render: (run) => { const sc = CTA.SIM_SCENARIOS[run.commodity]; return `<p>Four suppliers respond to your market check. Which can actually meet the buyer's specification and timing? (select all that can)</p>${supTable(sc)}${checks('q3', sc.suppliers.map((s) => ({ v: s.id, t: esc(s.name) })))}`; },
    read: (run, root) => { const sc = CTA.SIM_SCENARIOS[run.commodity]; const p = vals(root, 'q3'); if (!p.length) return { ok: false, msg: 'Select at least one supplier.' }; const truth = sc.suppliers.filter((s) => s.canSupply).map((s) => s.id); const j = jaccard(p, truth); run.sel.shortlist = p.filter((x) => truth.includes(x)); if (!run.sel.shortlist.length) run.sel.shortlist = truth; score(run, 2, ['commercial'], j * 100); const bad = sc.suppliers.find((s) => !s.canSupply); return { fb: `${bad.name} cannot meet the requirement (${bad.notes}) The others can supply. Shortlist: ${truth.map((id) => sc.suppliers.find((s) => s.id === id).name).join(', ')}.`, s: j * 100 }; } });
  /* 4 */ S.push({ cats: ['risk'], render: (run) => { const sc = CTA.SIM_SCENARIOS[run.commodity]; const ids = run.sel.shortlist; return `<p>Rate the credibility risk of each shortlisted supplier.</p>${supTable(sc, ids)}${ids.map((id) => { const s = sc.suppliers.find((x) => x.id === id); return `<div class="row" style="margin:6px 0"><span style="min-width:220px"><b>${esc(s.name)}</b></span>${['Low', 'Medium', 'High'].map((lv) => `<label class="check"><input type="radio" name="r4-${id}" value="${lv}"> ${lv}</label>`).join('')}</div>`; }).join('')}`; },
    read: (run, root) => { const sc = CTA.SIM_SCENARIOS[run.commodity]; const ids = run.sel.shortlist; let ok = 0; const fbs = []; for (const id of ids) { const v = val(root, 'r4-' + id); if (!v) return { ok: false, msg: 'Rate every supplier.' }; const s = sc.suppliers.find((x) => x.id === id); if (v === s.risk) ok++; fbs.push(`${s.name}: you said ${v}, assessment ${s.risk}`); } const sc0 = ok / ids.length * 100; score(run, 3, ['risk'], sc0); return { fb: fbs.join('; ') + '. Signals: track record, audited financials, references, payment demands (advance to third parties is a red flag), willingness to accept inspection.', s: sc0 }; } });
  /* 5 */ S.push({ cats: ['commercial'], render: (run) => radio('q5', [{ v: 'same', t: 'Send each shortlisted supplier the same RFQ: same specification, quantity, delivery basis, shipment window, inspection and document requirements, and a firm-offer validity', d: 'Makes offers comparable.' }, { v: 'diff', t: 'Let each supplier quote on its own preferred basis to get the lowest headline prices' }, { v: 'one', t: 'Ask only the cheapest supplier to save time' }], run.sel.q5),

        <h4>Financing</h4><div class="form">${F('financeRatePct', 'Interest rate (% p.a.)')}${F('financeDays', 'Days financed (pay supplier → collect)')}${F('financedPct', 'Share of costs financed (%)')}${F('financeBase', 'Financing base', { type: 'select', options: [['all', 'All costs before financing'], ['goods', 'Goods value only']] })}${F('bankFundedPct', 'Working capital funded by bank (%)', { term: 'Advance rate' })}${F('buyerAdvancePct', 'Buyer advance (% of sale)')}${F('supplierCreditPct', 'Supplier credit (% of goods)')}</div>
        <h4>Sale</h4><div class="form">${F('qtySold', 'Quantity sold (t)')}${F('sellPrice', 'Selling price (/t)')}${F('commissionPct', 'Commission (% of sale)')}${F('discountPct', 'Discounts/allowances (%)')}${F('sellingPerT', 'Selling expenses (/t)')}${F('sellingLump', 'Selling expenses (lump sum)')}${F('extraFinancing', 'Other financing not included (lump)')}${F('otherDealExp', 'Other deal expenses (lump)')}</div>
        <h4>Timing</h4><div class="form">${F('shipDate', 'Shipment date', { type: 'date' })}${F('transitDays', 'Transit (days)')}${F('payDays', 'Buyer pays after arrival (days)')}</div>
        <h4>Stress scenario</h4><div class="form">${F('stressPricePct', 'Selling price falls (%)')}${F('stressFreightPct', 'Freight increase (%)')}${F('stressDelayDays', 'Delay (days)')}${F('demurragePerDay', 'Demurrage (/day, lump)')}${F('stressResaleDiscountPct', 'If buyer defaults: resale discount (%)')}</div>
      </div></div><div><div id="dc-out" style="position:sticky;top:64px"></div></div></div><div class="card"><h3>Sensitivity: change in net profit for ±10% in each input</h3><div id="dc-sens"></div></div>`;
    const out = CTA.$('#dc-out', el);
    const recompute = () => {
      Object.assign(d, CTA.ui.read(el)); CTA.save();
      const r = C.dealPnL(d); const lc = r.landed;
      const collect = d.shipDate ? new Date(new Date(d.shipDate + 'T00:00:00Z').getTime() + ((+d.transitDays || 0) + (+d.payDays || 0)) * 86400000).toISOString().slice(0, 10) : '—';
      const mo = (x) => fmt.money(x, cur, 0);
      out.innerHTML = `<div class="card"><h3>Results ${CTA.SIM}</h3>${CTA.ui.kpis([{ label: 'Net profit', value: mo(r.netProfit), cls: fmt.cls(r.netProfit) }, { label: 'Profit margin', value: fmt.pct(r.netMarginPct) }, { label: 'Gross margin', value: mo(r.grossMargin), sub: fmt.pct(r.grossMarginPct) }, { label: 'Total deal value', value: mo(r.grossRevenue) }, { label: 'Cost per t', value: f(lc.perT), sub: cur + '/t landed' }, { label: 'Selling price per t', value: f(r.perTSell) }, { label: 'Break-even price', value: f(r.breakEven), sub: cur + '/t' }, { label: 'Working capital', value: mo(r.workingCapital) }, { label: 'Return on equity', value: fmt.pct(r.roic * 100), sub: 'annualised ' + fmt.pct(r.roicAnnual * 100, 1) }, { label: 'Expected collection', value: collect }, { label: 'Max potential loss (stress)', value: mo(r.maxPotentialLoss), cls: r.maxPotentialLoss > 0 ? 'neg' : '' }])}
        <table><tbody><tr><td>Goods (${f(lc.qty, 0)} t × ${f(d.buyPrice)})</td><td class="r num">${f(lc.goods)}</td></tr>${C.COST_LINES.map(([k, l]) => `<tr class="${lc.included.includes(k) ? 'muted' : ''}"><td>${l}${lc.included.includes(k) ? ' <small>(in price)</small>' : ''}</td><td class="r num">${f(lc.lines[k])}</td></tr>`).join('')}<tr class="total"><td>Total landed cost</td><td class="r num">${f(lc.total)}</td></tr><tr><td>Net sales revenue</td><td class="r num">${f(r.netRevenue)}</td></tr><tr><td>− Selling expenses</td><td class="r num">${f(r.sellingExp)}</td></tr><tr><td>− Other financing / deal costs</td><td class="r num">${f(r.extraFin + r.other)}</td></tr><tr class="total"><td>Net transaction profit</td><td class="r num ${fmt.cls(r.netProfit)}">${f(r.netProfit)}</td></tr></tbody></table>
        <p class="muted" style="font-size:.8rem">Insured value ${f(lc.insuredValue, 0)} · customs value (${esc(d.dutyBase)}) ${f(lc.customsValue, 0)} · stressed profit ${f(r.stressProfit, 0)} · buyer-default loss ${f(r.maxLossBuyerDefault, 0)}. Financing appears once (in landed cost). Duty applies only if not DDP.</p></div>`;
      const keys = [['buyPrice', 'Purchase price'], ['sellPrice', 'Selling price'], ['freight', 'Freight'], ['financeRatePct', 'Interest rate'], ['financeDays', 'Financing days'], ['qty', 'Quantity (bought = sold)']];
      CTA.$('#dc-sens', el).innerHTML = CTA.table(['Input', '−10%', '+10%'], keys.map(([k, l]) => { const g = (m) => { const x = Object.assign({}, d); x[k] = d[k] * m; if (k === 'qty') x.qtySold = d.qtySold * m; return C.dealPnL(x).netProfit - r.netProfit; }; const a = g(0.9), b = g(1.1); return [l, `<span class="${fmt.cls(a)}">${f(a, 0)}</span>`, `<span class="${fmt.cls(b)}">${f(b, 0)}</span>`]; }));
    };
    el.oninput = (e) => { if (e.target.name === 'buyTerm' || e.target.name === 'currency') return; recompute(); };
    el.onchange = (e) => { if (e.target.name === 'buyTerm') { d.buyTerm = e.target.value; CTA.save(); calculator(el); } else if (e.target.name === 'currency') { d.currency = e.target.value; CTA.save(); calculator(el); } };
    CTA.$('[data-a=reset]', el).onclick = () => { st.dealCalc = Object.assign({}, DC_DEFAULT); CTA.save(); calculator(el); };
    CTA.$('[data-a=convert]', el).onclick = () => { const money = ['buyPrice', 'inlandOrigin', 'loading', 'exportCharges', 'freight', 'inspection', 'portCharges', 'unloading', 'inlandDest', 'otherCosts', 'sellPrice', 'sellingPerT', 'sellingLump', 'extraFinancing', 'otherDealExp', 'demurragePerDay']; money.forEach((k) => { d[k] = C.round(C.fx(d[k], 'USD', cur, fx), 4); }); CTA.save(); calculator(el); CTA.toast(`Money inputs converted USD → ${cur} at the simulated rate.`, 'ok'); };
    recompute();
  }

  /* ------------------------------------------------------------ route */
  CTA.route('physical', { title: 'Physical Trading Simulator', desc: '25-step deal workflow, deal calculator, trading company.', render(el, r) {
    const tab = r.parts[0] || 'workflow';
    el.innerHTML = `${CTA.pageHead('Physical Trading Simulator', 'Operate as a physical commodity trader: source, evaluate, negotiate, finance, ship, deliver and reconcile simulated deals. Profit is only one dimension — execution risk, liquidity and contractual exposure are scored too.', 'char')}
      ${CTA.tabs([['workflow', 'Deal workflow (25 steps)'], ['calculator', 'Deal calculator'], ['history', `Completed deals (${CTA.state.physical.completed.length})`], ['company', 'Trading company']], tab, 'physical')}<div id="pb"></div>`;
    const b = CTA.$('#pb', el);
    if (tab === 'calculator') return calculator(b);
    if (tab === 'company') return CTA.companyView(b);
    if (tab === 'history') {
      const list = CTA.state.physical.completed.slice().reverse(); const id = r.parts[1];
      if (id) { const rec = list.find((x) => x.id === id); b.innerHTML = rec ? CTA.physicalReport(rec) : CTA.ui.empty('Not found', ''); return; }
      b.innerHTML = list.length ? CTA.table(['Date', 'Commodity', 'Mode', 'P&L (USD)', 'Score', ''], list.map((x) => [fmt.date(x.date), `<span class="badge t-${x.commodity}">${x.commodity}</span>`, x.exam ? 'Exam' : 'Practice', `<span class="${fmt.cls(x.pnl)}">${f(x.pnl, 0)}</span>`, Math.round(x.score) + '%', `<a href="#/physical/history/${x.id}">Report</a>`])) : CTA.ui.empty('No completed deals yet', 'Run a deal in the workflow tab.', '<a class="btn primary" href="#/physical/workflow">Start a deal</a>');
      return;
    }
    const st = CTA.state.physical;
    if (st.active && st.active.exam) { b.innerHTML = `<div class="note warn"><strong>An examination deal is in progress</strong>Continue it in Exams & Certifications.</div><a class="btn primary" href="#/exams/final-case">Go to the exam</a>`; return; }
    if (st.active) { CTA.physicalRunner(b); return; }
    const pre = r.q.c;
    b.innerHTML = `<div class="card"><h3>Start a new physical deal</h3><p>Choose a commodity. Each scenario is a complete end-to-end transaction with fictional counterparties. The run seed changes each time, so events differ between runs.</p><div class="grid c4">${Object.entries(CTA.SIM_SCENARIOS).map(([k, s]) => `<div class="card ${pre === k ? 'soft' : ''}" style="margin:0;border-top:4px solid var(--${k})"><span class="badge t-${k}">${k}</span><p style="margin:6px 0"><b>${esc(s.title)}</b></p><p class="muted" style="font-size:.84rem">${esc(s.units.qtyLabel)} · ${esc(s.benchmark.name)}</p>${CTA.progress.simDone(k) ? '<span class="badge ok">completed before</span> ' : ''}<button class="btn primary sm" data-c="${k}">Start</button></div>`).join('')}</div></div>
      <div class="card soft"><h4>How the simulator works</h4><ul><li>25 steps from inquiry to final P&L; each needs a decision or calculation.</li><li>Choices change prices, costs, financing days, events (delays, damage, short shipment, claims, defaults) and payment outcomes.</li><li>Scores cover commercial judgment, financial accuracy, market understanding, risk, documentation, negotiation and operations. A risky deal that makes money does not get a perfect score.</li><li>Pricing model and event rules are documented in <code>js/data/sim-scenarios.js</code>.</li></ul></div>`;
    CTA.$$('[data-c]', b).forEach((btn) => { btn.onclick = () => { st.active = newRun(btn.dataset.c, false); CTA.save(); CTA.log(`Started a physical ${btn.dataset.c} deal`, 'deal'); CTA.render(); }; });
  } });
})();

</script>
<script>
/* js/views/company.js */
/* Commodity Trading Company Simulator — manage a fictional trading company month by month.
 * Extensible design: opportunities come from OPP_TEMPLATES (add a commodity by adding a template);
 * events come from EVENT_RULES (add a rule to add an event type). All values are SIMULATED.
 * Accounting: cash + receivables + inventory (at market) − facility debt − payables = equity.
 * Revenue/realised P&L is recognised on delivery; cash arrives when the buyer pays. */
(function () {
  const CTA = window.CTA, C = window.CALC, fmt = CTA.fmt, esc = CTA.esc;
  const f = (n, d = 0) => fmt.num(n, d);
  const OPP_TEMPLATES = {
    gold: { unitVal: [600000, 2500000], margin: [0.3, 1.2], dur: [1, 1], hedgeable: true, vol: 0.15, label: 'Gold kilobars' },
    wheat: { unitVal: [3000000, 9000000], margin: [1.5, 4.5], dur: [1, 3], hedgeable: true, vol: 0.3, label: 'Milling wheat cargo' },
    sugar: { unitVal: [2500000, 7000000], margin: [1.5, 5], dur: [1, 3], hedgeable: true, vol: 0.28, label: 'Sugar cargo' },
    steel: { unitVal: [1500000, 6000000], margin: [2, 6], dur: [1, 3], hedgeable: false, vol: 0.25, label: 'Steel parcel' },
  };
  const CREDIT = { A: { pd: 0.004, late: 0.03 }, B: { pd: 0.02, late: 0.12 }, C: { pd: 0.09, late: 0.35 } };
  const SUPPLIER = { A: { fail: 0.01, quality: 0.03 }, B: { fail: 0.04, quality: 0.07 }, C: { fail: 0.14, quality: 0.16 } };
  const VOLMULT = { low: 0.6, normal: 1, high: 1.7 };

  function defaults() { return { capital: 10000000, facility: 25000000, rate: 7, vol: 'normal', reservePct: 10, seed: Math.floor(Math.random() * 1e6), markets: ['gold', 'wheat', 'sugar', 'steel'] }; }
  function start(cfg) {
    return { cfg, month: 0, cash: cfg.capital, debt: 0, rate: cfg.rate, realized: 0, deals: [], receivables: [], history: [{ m: 0, cash: cfg.capital, equity: cfg.capital, debt: 0 }], log: [{ m: 0, t: `Company founded with ${fmt.money(cfg.capital, 'USD', 0)} equity and a ${fmt.money(cfg.facility, 'USD', 0)} trade-finance facility at ${cfg.rate}%.`, k: 'info' }], opps: [], status: 'active', prices: { gold: 1, wheat: 1, sugar: 1, steel: 1 }, stats: { defaults: 0, defaultLoss: 0, lateCount: 0, unhedgedPnL: 0, events: 0, forced: 0 } };
  }
  function rngFor(co) { return C.rng(co.cfg.seed * 977 + co.month * 131 + 7); }
  function genOpps(co) {
    const r = rngFor(co); const n = r.int(3, 5); const out = [];
    for (let i = 0; i < n; i++) {
      const com = r.pick(co.cfg.markets); const t = OPP_TEMPLATES[com];
      const cost = Math.round(r.range(t.unitVal[0], t.unitVal[1]) / 10000) * 10000;
      const sup = r.pick(['A', 'B', 'B', 'C']), buy = r.pick(['A', 'B', 'B', 'C', 'C']);
      const payTerms = buy === 'A' ? r.pick([0, 1]) : buy === 'B' ? r.pick([1, 1, 2]) : r.pick([2, 3]);
      const lc = buy !== 'C' && r() < 0.6;
      let m = r.range(t.margin[0], t.margin[1]); if (buy === 'C') m += 1.5; if (sup === 'C') m += 1;
      out.push({ id: CTA.uid('op'), com, label: t.label, cost, revenue: Math.round(cost * (1 + m / 100)), marginPct: m, dur: r.int(t.dur[0], t.dur[1]), sup, buy, payTerms, lc, hedgeable: t.hedgeable, take: false, hedge: t.hedgeable, tf: lc });
    }
    return out;
  }
  const equity = (co) => co.cash + co.receivables.reduce((s, x) => s + x.amount, 0) + co.deals.reduce((s, d) => s + d.mtm, 0) - co.debt;

  function advance(co) {
    const r = rngFor(co); co.month++; const m = co.month; const L = (t, k) => co.log.unshift({ m, t, k: k || 'info' });
    // 1. take selected opportunities: pay supplier
    co.opps.filter((o) => o.take).forEach((o) => {
      let tf = o.tf && o.lc ? o.cost * 0.8 : 0;
      if (co.debt + tf > co.cfg.facility) { tf = 0; L(`Trade finance unavailable for ${o.label}: facility limit reached — paid from cash.`, 'bad'); }
      co.cash -= o.cost - tf; co.debt += tf;
      co.deals.push({ id: o.id, com: o.com, label: o.label, cost: o.cost, revenue: o.revenue, deliver: m + o.dur, buy: o.buy, sup: o.sup, payTerms: o.payTerms, lc: o.lc, hedge: o.hedge && o.hedgeable, tf, mtm: o.cost, px0: co.prices[o.com] });
      L(`Committed ${o.label} (${o.com}): paid supplier ${fmt.money(o.cost, 'USD', 0)}${tf ? ', 80% funded by trade finance' : ''}${o.hedge && o.hedgeable ? ', hedged' : ', UNHEDGED'}.`);
    });
    co.opps = [];
    // 2. prices move (monthly GBM step with fat-tail shock)
    Object.keys(co.prices).forEach((k) => { const v = OPP_TEMPLATES[k].vol * VOLMULT[co.cfg.vol] / Math.sqrt(12); let z = r.normal(); if (r() < 0.05) z *= 2.5; co.prices[k] *= Math.exp(-0.5 * v * v + v * z); });
    // 3. interest-rate changes
    if (r() < 0.12) { const d = r.pick([-1, 1, 1]); co.rate = Math.max(1, co.rate + d); L(`Financing cost change: facility rate now ${co.rate}% (${d > 0 ? '+' : ''}${d}).`, d > 0 ? 'bad' : 'ok'); co.stats.events++; }
    // 4. events on open deals, deliveries
    co.deals.slice().forEach((d) => {
      const priceRel = co.prices[d.com] / d.px0;
      if (d.supFailChecked !== true) { d.supFailChecked = true; if (r() < SUPPLIER[d.sup].fail) { const rec = d.cost * 0.5; co.cash += rec; co.realized -= d.cost - rec; co.stats.events++; co.deals = co.deals.filter((x) => x !== d); L(`Supplier default (${d.sup}-rated) on ${d.label}: cargo never shipped; recovered 50% of the advance. Loss ${fmt.money(d.cost - rec, 'USD', 0)}.`, 'bad'); return; } }
      if (r() < 0.08) { const extra = d.cost * r.range(0.01, 0.025); co.cash -= extra; d.cost += extra; L(`Freight increase on ${d.label}: +${fmt.money(extra, 'USD', 0)}.`, 'bad'); co.stats.events++; }
      if (r() < 0.07 && d.deliver === m) { d.deliver++; L(`Shipment delay: ${d.label} slips one month (more financing, later collection).`, 'bad'); co.stats.events++; }
      if (r() < 0.04) { const extra = d.cost * 0.008; co.cash -= extra; d.cost += extra; L(`Unexpected customs/port expense on ${d.label}: ${fmt.money(extra, 'USD', 0)}.`, 'bad'); co.stats.events++; }
      const hedgeGain = d.hedge ? -(priceRel - 1) * d.cost : 0;
      d.mtm = d.cost * priceRel + hedgeGain;
      if (d.deliver <= m) {
        let rev = d.hedge ? d.revenue * (1 + r.range(-0.004, 0.004)) : d.revenue * priceRel;
        if (!d.hedge) co.stats.unhedgedPnL += d.revenue * (priceRel - 1);
        if (r() < SUPPLIER[d.sup].quality) { const cut = rev * r.range(0.01, 0.03); rev -= cut; L(`Quality dispute on ${d.label}: allowance ${fmt.money(cut, 'USD', 0)}.`, 'bad'); co.stats.events++; }
        const profit = rev - d.cost; co.realized += profit;
        let due = m + d.payTerms; let late = false;
        if (!d.lc && r() < CREDIT[d.buy].late) { due += 2; late = true; co.stats.lateCount++; L(`Buyer (${d.buy}-rated) asks for 2 extra months to pay for ${d.label}.`, 'bad'); }
        co.receivables.push({ id: d.id, label: d.label, amount: rev, due, buy: d.buy, lc: d.lc, tf: d.tf, late });
        co.deals = co.deals.filter((x) => x !== d);
        L(`Delivered ${d.label}: revenue ${fmt.money(rev, 'USD', 0)}, deal profit ${fmt.money(profit, 'USD', 0)}${d.hedge ? '' : ' (unhedged price effect ' + fmt.money(d.revenue * (priceRel - 1), 'USD', 0) + ')'}. Payment due month ${due}.`, profit >= 0 ? 'ok' : 'bad');
      }
    });
    // 5. collections & defaults
    co.receivables.slice().forEach((x) => {
      if (x.due > m) return;
      if (!x.lc && r() < CREDIT[x.buy].pd * (x.late ? 3 : 1)) { const loss = x.amount * 0.6; co.realized -= loss; co.cash += x.amount - loss; co.stats.defaults++; co.stats.defaultLoss += loss; L(`Buyer default (${x.buy}-rated) on ${x.label}: recovered 40%, loss ${fmt.money(loss, 'USD', 0)}.`, 'bad'); }
      else { co.cash += x.amount; L(`Collected ${fmt.money(x.amount, 'USD', 0)} for ${x.label}.`, 'ok'); }
      if (x.tf) { const rep = Math.min(x.tf, co.debt); co.debt -= rep; co.cash -= rep; }
      co.receivables = co.receivables.filter((y) => y !== x);
    });
    // 6. interest & overheads
    const interest = co.debt * co.rate / 100 / 12, over = co.cfg.capital * 0.004;
    co.cash -= interest + over; co.realized -= interest + over;
    // 7. liquidity: draw the facility as a revolver if cash is negative
    if (co.cash < 0) { const room = co.cfg.facility - co.debt; const draw = Math.min(room, -co.cash); co.debt += draw; co.cash += draw; if (draw > 0) L(`Drew ${fmt.money(draw, 'USD', 0)} on the facility to cover a cash shortfall.`, 'bad'); }
    if (co.cash < 0) {
      // forced liquidation of open positions at a 6% discount
      co.deals.slice().forEach((d) => { if (co.cash >= 0) return; const proceeds = d.mtm * 0.94; co.cash += proceeds; co.realized += proceeds - d.cost; co.stats.forced++; co.deals = co.deals.filter((x) => x !== d); L(`Forced sale of ${d.label} at a distressed price: ${fmt.money(proceeds, 'USD', 0)}.`, 'bad'); });
      if (co.cash < 0) { co.status = 'bankrupt'; L('LIQUIDITY CRISIS: the company cannot meet its payments. Banks call the facility.', 'bad'); }
      else { co.status = 'crisis'; L('Liquidity crisis averted only by forced sales.', 'bad'); }
    } else if (co.status === 'crisis') co.status = 'active';
    if (equity(co) <= 0 && co.status !== 'bankrupt') { co.status = 'bankrupt'; L('Equity wiped out: the company is insolvent.', 'bad'); }
    co.history.push({ m, cash: co.cash, equity: equity(co), debt: co.debt });
    if (co.status !== 'bankrupt') co.opps = genOpps(co);
    CTA.save();
  }
  function diagnosis(co) {
    const recv = co.receivables.reduce((s, x) => s + x.amount, 0), unsec = co.receivables.filter((x) => !x.lc).reduce((s, x) => s + x.amount, 0);
    const out = [];
    if (co.stats.defaultLoss > 0) out.push(`Buyer defaults cost ${fmt.money(co.stats.defaultLoss, 'USD', 0)} (${co.stats.defaults} defaults). Prevention: credit limits, LCs or credit insurance for weaker buyers.`);
    if (co.stats.lateCount) out.push(`${co.stats.lateCount} late payments stretched working capital. Prevention: shorter terms, security, interest on late payments.`);
    if (co.stats.unhedgedPnL < 0) out.push(`Unhedged price exposure lost ${fmt.money(-co.stats.unhedgedPnL, 'USD', 0)}. Prevention: hedge flat price where instruments exist; limit unhedged steel inventory.`);
    if (recv > 0 && unsec / recv > 0.5) out.push(`More than half of receivables (${fmt.pct(unsec / recv * 100, 0)}) are unsecured. Prevention: concentration and counterparty limits.`);
    if (co.stats.forced) out.push(`${co.stats.forced} forced sales at distressed prices — the classic consequence of insufficient liquidity reserves.`);
    const peakDebt = Math.max(...co.history.map((h) => h.debt)); if (peakDebt > co.cfg.facility * 0.9) out.push('The facility was almost fully drawn: growth outpaced funding. Prevention: keep a liquidity reserve and pace deal intake to available funding.');
    if (!out.length) out.push('No single dominant cause: losses came from accumulated small events and overheads. Review margins versus fixed costs.');
    return out;
  }

  CTA.companyView = function (el) {
    const st = CTA.state;
    if (!st.company) {
      const d = defaults();
      el.innerHTML = `<div class="card"><h3>Set up your trading company ${CTA.SIM}</h3><p>Choose initial conditions. You decide each month which deals to pursue, whether to hedge, and whether to use trade finance. Events — price moves, defaults, delays, disputes, freight and rate changes — follow published probabilities (see <code>js/views/company.js</code>).</p>
        <div class="form">${CTA.ui.field({ id: 'co-capital', name: 'capital', label: 'Starting equity (USD)', value: d.capital })}${CTA.ui.field({ id: 'co-facility', name: 'facility', label: 'Trade-finance facility limit (USD)', value: d.facility })}${CTA.ui.field({ id: 'co-rate', name: 'rate', label: 'Facility interest rate % p.a.', value: d.rate })}${CTA.ui.field({ id: 'co-vol', name: 'vol', label: 'Market volatility', type: 'select', value: 'normal', options: ['low', 'normal', 'high'] })}${CTA.ui.field({ id: 'co-res', name: 'reservePct', label: 'Liquidity reserve policy (% of equity)', value: d.reservePct })}${CTA.ui.field({ id: 'co-seed', name: 'seed', label: 'Scenario seed (repeatable)', value: d.seed })}</div>
        <p style="margin-top:8px"><b>Markets to enter:</b> ${['gold', 'wheat', 'sugar', 'steel'].map((k) => `<label class="check" style="display:inline-flex"><input type="checkbox" name="mk" value="${k}" checked> ${k}</label>`).join(' ')}</p><button class="btn primary" id="co-start">Found the company</button></div>`;
      CTA.$('#co-start', el).onclick = () => { const v = CTA.ui.read(el, ['capital', 'facility', 'rate', 'vol', 'reservePct', 'seed']); const mk = CTA.$$('input[name=mk]:checked', el).map((x) => x.value); if (!mk.length) { CTA.toast('Choose at least one market.', 'warn'); return; } if (v.capital <= 0) { CTA.toast('Capital must be positive.', 'warn'); return; } const co = start(Object.assign(d, v, { markets: mk })); co.opps = genOpps(co); st.company = co; CTA.save(); CTA.log('Founded the simulated trading company', 'company'); CTA.companyView(el); };
      return;
    }
    const co = st.company; const eq = equity(co);
    const recv = co.receivables.reduce((s, x) => s + x.amount, 0), inv = co.deals.reduce((s, d) => s + d.mtm, 0), invCost = co.deals.reduce((s, d) => s + d.cost, 0);
    const reserve = co.cfg.capital * co.cfg.reservePct / 100;
    const sel = co.opps.filter((o) => o.take); const needCash = sel.reduce((s, o) => s + o.cost - (o.tf && o.lc ? o.cost * 0.8 : 0), 0); const needDebt = sel.reduce((s, o) => s + (o.tf && o.lc ? o.cost * 0.8 : 0), 0);
    const byBuyer = {}; co.receivables.forEach((x) => { byBuyer[x.buy] = (byBuyer[x.buy] || 0) + x.amount; });
    el.innerHTML = `${co.status === 'bankrupt' ? `<div class="note bad"><strong>The company failed in month ${co.month}</strong>Why it happened and how it could have been prevented:<ul>${diagnosis(co).map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : co.status === 'crisis' ? '<div class="note bad"><strong>Liquidity crisis</strong>You survived only through forced sales. Reduce new commitments and rebuild cash.</div>' : ''}
      <div class="ws"><div class="row between"><h3 style="margin:0">Month ${co.month} ${CTA.SIM}</h3><div class="row"><button class="btn sm" id="co-restart">Restart with new conditions</button></div></div>
      ${CTA.ui.kpis([{ label: 'Equity', value: fmt.money(eq, 'USD', 0), cls: eq >= co.cfg.capital ? 'pos' : 'neg', sub: fmt.signed((eq / co.cfg.capital - 1) * 100) + '% vs start' }, { label: 'Cash', value: fmt.money(co.cash, 'USD', 0), cls: co.cash < reserve ? 'warn' : '', sub: 'Reserve policy ' + fmt.money(reserve, 'USD', 0) }, { label: 'Receivables', value: fmt.money(recv, 'USD', 0) }, { label: 'Inventory / in transit (MTM)', value: fmt.money(inv, 'USD', 0) }, { label: 'Facility drawn', value: fmt.money(co.debt, 'USD', 0), sub: 'of ' + fmt.money(co.cfg.facility, 'USD', 0) + ' at ' + co.rate + '%' }, { label: 'Realised P&L', value: fmt.money(co.realized, 'USD', 0), cls: fmt.cls(co.realized) }, { label: 'Unrealised P&L', value: fmt.money(inv - invCost, 'USD', 0), cls: fmt.cls(inv - invCost) }, { label: 'Working capital', value: fmt.money(recv + inv, 'USD', 0) }])}
      <div class="grid c2"><div class="card"><h4>Equity, cash and debt</h4><div id="co-chart"></div></div><div class="card"><h4>Balance sheet</h4><table><tbody><tr><td>Cash</td><td class="r">${f(co.cash)}</td></tr><tr><td>Receivables</td><td class="r">${f(recv)}</td></tr><tr><td>Inventory & goods in transit (MTM incl. hedges)</td><td class="r">${f(inv)}</td></tr><tr><td>Trade-finance facility</td><td class="r">(${f(co.debt)})</td></tr><tr class="total"><td>Equity</td><td class="r">${f(eq)}</td></tr></tbody></table>
        <h4>Counterparty exposure (receivables by buyer rating)</h4>${Object.keys(byBuyer).length ? Object.entries(byBuyer).map(([k, v]) => `<div class="row between"><span>Rating ${k}</span><span>${f(v)} (${fmt.pct(v / recv * 100, 0)})</span></div>`).join('') : '<p class="muted">None.</p>'}</div></div>
      <div class="card"><h4>Open contracts & positions</h4>${co.deals.length ? CTA.table(['Deal', 'Cost', 'MTM', 'Delivers', 'Buyer', 'Supplier', 'Hedged', 'TF'], co.deals.map((d) => [d.label + ' · ' + d.com, f(d.cost), `<span class="${fmt.cls(d.mtm - d.cost)}">${f(d.mtm)}</span>`, 'M' + d.deliver, d.buy, d.sup, d.hedge ? 'yes' : '<b class="neg">no</b>', d.tf ? f(d.tf) : '—'])) : '<p class="muted">No open deals.</p>'}
        ${co.receivables.length ? '<h4>Receivables</h4>' + CTA.table(['Deal', 'Amount', 'Due', 'Buyer', 'Security'], co.receivables.map((x) => [x.label, f(x.amount), 'M' + x.due + (x.late ? ' (late)' : ''), x.buy, x.lc ? 'LC' : 'open account'])) : ''}</div>
      ${co.status !== 'bankrupt' ? `<div class="card"><h4>This month's opportunities</h4><p class="muted" style="font-size:.84rem">Supplier/buyer ratings A (strong) – C (weak). Trade finance (80% of cost) is available only for LC-backed sales. Steel cannot be hedged in this simulation.</p>
        ${CTA.table(['Take', 'Deal', 'Cost', 'Expected revenue', 'Margin', 'Months', 'Supplier', 'Buyer', 'Pays after', 'Security', 'Hedge', 'Use TF'], co.opps.map((o, i) => [`<input type="checkbox" data-o="${i}" data-k="take" ${o.take ? 'checked' : ''} aria-label="Take deal">`, o.label + ' · ' + o.com, f(o.cost), f(o.revenue), fmt.pct(o.marginPct), o.dur, o.sup, o.buy, o.payTerms + ' mo', o.lc ? 'LC' : 'open acct.', o.hedgeable ? `<input type="checkbox" data-o="${i}" data-k="hedge" ${o.hedge ? 'checked' : ''} aria-label="Hedge">` : 'n/a', o.lc ? `<input type="checkbox" data-o="${i}" data-k="tf" ${o.tf ? 'checked' : ''} aria-label="Use trade finance">` : 'n/a']))}
        <div class="note ${co.cash - needCash < reserve ? 'warn' : ''}"><strong>Selected: ${sel.length} deal(s)</strong>Cash needed now ${fmt.money(needCash, 'USD', 0)}; trade finance ${fmt.money(needDebt, 'USD', 0)}. Cash after commitments: ${fmt.money(co.cash - needCash, 'USD', 0)}${co.cash - needCash < reserve ? ' — below your liquidity reserve policy!' : ''}${co.debt + needDebt > co.cfg.facility ? '. Facility limit would be exceeded — not all TF can be drawn.' : ''}.</div>
        <button class="btn ok" id="co-adv">Advance one month →</button></div>` : ''}
      <div class="card"><h4>Event log</h4><div class="news" style="max-height:300px">${co.log.slice(0, 60).map((l) => `<div><span class="d">M${l.m}</span><span class="${l.k === 'bad' ? 'neg' : l.k === 'ok' ? 'pos' : ''}">${esc(l.t)}</span></div>`).join('')}</div></div></div>`;
    CTA.chart(CTA.$('#co-chart', el), { height: 200, labels: co.history.map((h) => 'M' + h.m), series: [{ data: co.history.map((h) => h.equity), label: 'Equity', color: '#45d18a' }, { data: co.history.map((h) => h.cash), label: 'Cash', color: '#6aa5ef' }, { data: co.history.map((h) => h.debt), label: 'Debt', color: '#ff7b7b' }], zero: true, yFmt: (v) => fmt.num(v / 1e6, 1) + 'm' });
    CTA.$$('[data-o]', el).forEach((cb) => { cb.onchange = () => { co.opps[+cb.dataset.o][cb.dataset.k] = cb.checked; CTA.save(); CTA.companyView(el); }; });
    const adv = CTA.$('#co-adv', el);
    if (adv) adv.onclick = () => {
      advance(co); if (co.month >= 6) CTA.log('Operated the trading company for ' + co.month + ' months', 'company');
      if (co.status === 'bankrupt') CTA.journalAdd({ auto: true, type: 'company', title: 'Trading company failed in month ' + co.month, pnl: equity(co) - co.cfg.capital, lessons: diagnosis(co).join(' ') });
      CTA.companyView(el);
    };
    CTA.$('#co-restart', el).onclick = () => { if (!confirm('Restart the company? The current simulation will be closed.')) return; if (co.month) CTA.journalAdd({ auto: true, type: 'company', title: `Trading company closed after ${co.month} months`, pnl: equity(co) - co.cfg.capital, lessons: diagnosis(co).join(' ') }); st.company = null; CTA.save(); CTA.companyView(el); };
  };
  CTA.COMPANY = { OPP_TEMPLATES, CREDIT, SUPPLIER, equity, advance, start, genOpps };
})();

</script>
<script>
/* js/views/futures.js */
/* Futures, Options & Financial Trading Simulator.
 * Price model: CALC.simulateOHLC (GBM, 4 sub-steps per day for highs/lows) with the scenario's scheduled
 * drift/volatility regime changes and jumps — documented in js/data/markets.js. Same seed → same path.
 * Accounting: equity = cash + unrealised futures P&L + long option value − short option value.
 * Cash changes on fills (fees, option premiums) and on realised futures P&L. Margin: initial to open,
 * maintenance to keep; below maintenance → margin call (deposit or reduce); ignored → broker liquidation. */
(function () {
  const CTA = window.CTA, C = window.CALC, fmt = CTA.fmt, esc = CTA.esc;
  const f = (n, d = 2) => fmt.num(n, d);
  let timer = null;

  const scen = (id) => CTA.MARKET.SCENARIOS.find((s) => s.id === id);
  const pathCache = {};
  function path(F) { const k = F.scenarioId + ':' + F.seed; if (!pathCache[k]) { const s = scen(F.scenarioId), sp = CTA.MARKET.specs()[s.inst]; pathCache[k] = C.simulateOHLC({ start: sp.start, days: s.days + 1, drift: s.drift, vol: s.vol, seed: F.seed, events: s.events }); } return pathCache[k]; }
  const spec = (F) => CTA.MARKET.specs()[scen(F.scenarioId).inst];
  const roundTick = (p, tick) => Math.round(p / tick) * tick;
  function price(F, month, day) {
    const s = scen(F.scenarioId), p = path(F)[day == null ? F.day : day];
    const off = month === 'M2' ? (s.rollSpread || 0) : 0;
    return { o: p.o + off, h: p.h + off, l: p.l + off, c: p.c + off };
  }
  const activeMonth = (F) => { const s = scen(F.scenarioId); return s.expiryDay != null && F.day > s.expiryDay ? 'M2' : 'M1'; };
  const optUnder = (F, day) => price(F, activeMonth(F), day).c;
  const optT = (F) => Math.max(0, (scen(F.scenarioId).days - F.day) / 252);

  function newAccount(sid, capital, seedOverride) {
    const s = scen(sid);
    const F = { scenarioId: sid, seed: seedOverride || s.seed, day: 0, startCash: s.startCash || capital, cash: s.startCash || capital, deposits: 0, positions: [], history: [], equityHist: [], news: [], status: 'paused', marginCall: false, callIgnored: false, startedAt: Date.now() };
    (s.preload || []).forEach((p) => { const sp = spec(F); const px = path(F)[0].c; F.positions.push({ id: CTA.uid('p'), type: 'fut', side: p.side, qty: p.qty, entry: px, month: 'M1', stop: null, tp: null, openDay: 0 }); F.cash -= sp.fee * p.qty; });
    F.equityHist.push(equity(F)); F.news.push({ d: 0, t: `Scenario started: ${s.title}. ${s.objective}` });
    return F;
  }
  function optValue(F, p, day) { const sp = spec(F), s = scen(F.scenarioId); const T = day >= s.days ? 0 : (s.days - day) / 252; return C.black76(optUnder(F, day), p.strike, T, 0.04, s.iv, p.optType); }
  function unreal(F, p, day) {
    const sp = spec(F); day = day == null ? F.day : day;
    if (p.type === 'fut') return (p.side === 'long' ? 1 : -1) * (price(F, p.month, day).c - p.entry) * sp.pointValue * p.qty;
    return (p.side === 'long' ? 1 : -1) * optValue(F, p, day).price * sp.pointValue * p.qty; // option position value (asset or liability)
  }
  function equity(F, day) { return F.cash + F.positions.reduce((s, p) => s + unreal(F, p, day), 0); }
  function margins(F) {
    const sp = spec(F); let im = 0, mm = 0;
    F.positions.forEach((p) => { if (p.type === 'fut') { im += sp.im * p.qty; mm += sp.mm * p.qty; } else if (p.side === 'short') { im += sp.im * 0.75 * p.qty; mm += sp.mm * 0.75 * p.qty; } });
    return { im, mm };
  }
  function exposure(F) { const sp = spec(F); return F.positions.reduce((s, p) => s + (p.type === 'fut' ? price(F, p.month).c * sp.pointValue * p.qty : Math.abs(optValue(F, p, F.day).delta) * optUnder(F, F.day) * sp.pointValue * p.qty), 0); }

  function closePos(F, p, px, reason) {
    const sp = spec(F);
    let pnl;
    if (p.type === 'fut') { pnl = (p.side === 'long' ? 1 : -1) * (px - p.entry) * sp.pointValue * p.qty; F.cash += pnl - sp.fee * p.qty; }
    else { const val = px * sp.pointValue * p.qty; if (p.side === 'long') F.cash += val; else F.cash -= val; F.cash -= sp.fee * p.qty; pnl = (p.side === 'long' ? 1 : -1) * (px - p.entry) * sp.pointValue * p.qty; }
    F.positions = F.positions.filter((x) => x !== p);
    const rec = { id: p.id, type: p.type, label: p.type === 'fut' ? `${p.side} ${p.qty} ${scen(F.scenarioId).inst} ${p.month}` : `${p.side} ${p.qty} ${p.optType} K${f(p.strike, spec(F).dp)}`, entry: p.entry, exit: px, openDay: p.openDay, closeDay: F.day, pnl: pnl - sp.fee * p.qty * 2, reason };
    F.history.push(rec);
    F.news.push({ d: F.day, t: `Closed ${rec.label} at ${f(px, sp.dp)} (${reason}). P&L ${fmt.money(rec.pnl, 'USD', 0)}.` });
    CTA.journalAdd({ auto: true, type: 'futures', commodity: CTA.MARKET.specs()[scen(F.scenarioId).inst].commodity, title: `${rec.label} — ${reason}`, entry: p.entry, exit: px, pnl: rec.pnl, thesis: `Scenario: ${scen(F.scenarioId).title}`, lessons: '' });
  }
  function open(F, o) {
    const sp = spec(F), s = scen(F.scenarioId);
    if (F.status === 'finished') return 'Scenario finished.';
    if (!(o.qty > 0) || Math.floor(o.qty) !== o.qty) return 'Quantity must be a whole number of contracts.';
    if (o.type === 'fut') {
      const month = o.month || activeMonth(F);
      if (s.expiryDay != null && month === 'M1' && F.day >= s.expiryDay) return 'The front month has expired — trade the next month.';
      const mid = price(F, month).c; const fill = roundTick(C.fillPrice(mid, o.side === 'long' ? 'buy' : 'sell', sp.spreadTicks, sp.slipTicks, sp.tick), sp.tick);
      if (o.stop != null && o.stop !== '' && ((o.side === 'long' && o.stop >= fill) || (o.side === 'short' && o.stop <= fill))) return 'Stop-loss must be below the entry for longs and above for shorts.';
      if (o.tp != null && o.tp !== '' && ((o.side === 'long' && o.tp <= fill) || (o.side === 'short' && o.tp >= fill))) return 'Take-profit must be above the entry for longs and below for shorts.';
      const m = margins(F); const eq = equity(F);
      if (eq - sp.fee * o.qty < m.im + sp.im * o.qty) return `Insufficient margin: need ${fmt.money(m.im + sp.im * o.qty, 'USD', 0)} initial margin, equity ${fmt.money(eq, 'USD', 0)}.`;
      F.cash -= sp.fee * o.qty;
      F.positions.push({ id: CTA.uid('p'), type: 'fut', side: o.side, qty: o.qty, entry: fill, month, stop: o.stop === '' || o.stop == null ? null : +o.stop, tp: o.tp === '' || o.tp == null ? null : +o.tp, openDay: F.day });
      F.news.push({ d: F.day, t: `Filled ${o.side} ${o.qty} ${s.inst} ${month} at ${f(fill, sp.dp)} (mid ${f(mid, sp.dp)}; spread & slippage ${f(Math.abs(fill - mid), sp.dp)}).` });
    } else {
      const v = C.black76(optUnder(F, F.day), o.strike, optT(F), 0.04, s.iv, o.optType);
      if (optT(F) <= 0) return 'Options have expired.';
      const half = Math.max(sp.tick, v.price * 0.01); const fill = Math.max(sp.tick, v.price + (o.side === 'long' ? half : -half));
      const cost = fill * sp.pointValue * o.qty;
      const m = margins(F); const eq = equity(F);
      if (o.side === 'long' && F.cash - cost - sp.fee * o.qty < m.im) return 'Insufficient cash to pay the premium while keeping existing margin.';
      if (o.side === 'short' && eq < m.im + sp.im * 0.75 * o.qty) return 'Insufficient margin to write options.';
      F.cash += (o.side === 'long' ? -cost : cost) - sp.fee * o.qty;
      F.positions.push({ id: CTA.uid('o'), type: 'opt', side: o.side, qty: o.qty, optType: o.optType, strike: o.strike, entry: fill, openDay: F.day });
      F.news.push({ d: F.day, t: `${o.side === 'long' ? 'Bought' : 'Sold'} ${o.qty} ${o.optType}${o.qty > 1 ? 's' : ''} K ${f(o.strike, sp.dp)} at ${f(fill, sp.dp + 1)} (premium ${fmt.money(cost, 'USD', 0)}).` });
    }
    CTA.save(); return null;
  }
  function step(F) {
    const s = scen(F.scenarioId), sp = spec(F);
    if (F.status === 'finished') return;
    if (F.marginCall) { F.callIgnored = true; // broker liquidates the largest futures position
      const fut = F.positions.filter((p) => p.type === 'fut').sort((a, b) => b.qty - a.qty)[0] || F.positions[0];
      if (fut) { const px = fut.type === 'fut' ? roundTick(C.fillPrice(price(F, fut.month).c, fut.side === 'long' ? 'sell' : 'buy', sp.spreadTicks, sp.slipTicks * 3, sp.tick), sp.tick) : optValue(F, fut, F.day).price; closePos(F, fut, px, 'broker liquidation after unmet margin call'); }
      F.marginCall = false;
    }
    F.day++;
    const bar = path(F)[F.day];
    s.events.filter((e) => e.day === F.day && e.news).forEach((e) => F.news.push({ d: F.day, t: '📰 ' + e.news, big: true }));
    // stops & targets (stop assumed first if both are touched in one bar)
    F.positions.filter((p) => p.type === 'fut').slice().forEach((p) => {
      const b = price(F, p.month);
      if (p.side === 'long') { if (p.stop != null && b.l <= p.stop) closePos(F, p, roundTick(Math.min(b.o, p.stop) - sp.slipTicks * sp.tick, sp.tick), b.o < p.stop ? 'stop-loss (gap through stop)' : 'stop-loss'); else if (p.tp != null && b.h >= p.tp) closePos(F, p, Math.max(b.o, p.tp), 'take-profit'); }
      else { if (p.stop != null && b.h >= p.stop) closePos(F, p, roundTick(Math.max(b.o, p.stop) + sp.slipTicks * sp.tick, sp.tick), b.o > p.stop ? 'stop-loss (gap through stop)' : 'stop-loss'); else if (p.tp != null && b.l <= p.tp) closePos(F, p, Math.min(b.o, p.tp), 'take-profit'); }
    });
    // contract expiry
    if (s.expiryDay != null && F.day === s.expiryDay) F.positions.filter((p) => p.type === 'fut' && p.month === 'M1').slice().forEach((p) => closePos(F, p, price(F, 'M1').c, 'expired — closed at final settlement (not rolled)'));
    // scenario end: options expire at intrinsic, futures closed
    if (F.day >= s.days) {
      F.positions.slice().forEach((p) => { if (p.type === 'opt') closePos(F, p, optValue(F, p, F.day).intrinsic, 'option expiry (intrinsic value)'); else closePos(F, p, price(F, p.month).c, 'scenario end'); });
      F.status = 'finished'; F.news.push({ d: F.day, t: 'Scenario finished. Read the debrief below.', big: true });
      CTA.log(`Futures scenario "${s.title}" finished: equity ${fmt.money(equity(F), 'USD', 0)}`, 'futures');
    }
    const eq = equity(F); F.equityHist.push(eq);
    const m = margins(F);
    if (F.positions.length && eq < m.mm) { F.marginCall = true; F.status = 'paused'; F.news.push({ d: F.day, t: `⚠ MARGIN CALL: equity ${fmt.money(eq, 'USD', 0)} below maintenance ${fmt.money(m.mm, 'USD', 0)}. Deposit ${fmt.money(m.im - eq, 'USD', 0)} or reduce positions before the next day, or the broker will liquidate.`, big: true }); }
    CTA.save();
    return bar;
  }

  /* ------------------------------------------------------------ views */
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
  CTA.route('futures', { title: 'Futures & Derivatives', desc: 'Scenario-driven futures and options trading simulator.', render(el, r) {
    stopTimer(); CTA.cleanup = stopTimer;
    const tab = r.parts[0] || 'trade';
    el.innerHTML = `${CTA.pageHead('Futures & Derivatives Simulator', 'Trade simulated commodity futures and options through scenarios built on documented rules. Spread, slippage, fees, margin, leverage, stops, expiry and margin calls are all modelled.', 'char')}
      ${CTA.tabs([['trade', 'Trading desk'], ['options', 'Options'], ['history', 'Trade history'], ['learn', 'Mechanics & model']], tab, 'futures')}<div id="fb"></div>`;
    const b = CTA.$('#fb', el);
    if (tab === 'learn') return learn(b);
    if (tab === 'history') return historyView(b);
    const F = CTA.state.futures;
    if (!F) return chooser(b);
    if (tab === 'options') return optionsView(b, F);
    desk(b, F);
  } });

  function chooser(b) {
    b.innerHTML = `<div class="ws"><h3>Choose a scenario ${CTA.SIM}</h3><p class="muted">Each scenario follows defined rules (drift, volatility, jumps and news at set days). You can pause at any time, inspect information, decide and continue. Contract specifications are illustrative.</p>
      <div class="row" style="margin-bottom:10px"><label for="fcap">Starting capital (USD)</label><input id="fcap" type="number" value="100000" style="max-width:160px"></div>

  function learn(b) {
    b.innerHTML = `<div class="grid c2"><div class="card"><h3>How the desk works</h3><ul>
      <li><b>Fills</b>: buys at mid + half spread + slippage; sells at mid − half spread − slippage (in ticks). Fees per contract per side.</li>
      <li><b>P&L</b> = price change × point value × contracts. Point value converts quote units to USD (e.g. wheat 1 c/bu = USD 50 per contract).</li>
      <li><b>Margin</b>: initial margin to open; maintenance to keep. Below maintenance → margin call to restore initial margin.</li>
      <li><b>Stops</b> trigger when the day's range touches them; a gap opens beyond the stop and fills at the open (worse), plus slippage. If stop and target are both touched in one day, the stop is assumed first (conservative).</li>
      <li><b>Expiry</b> (expiry scenario): roll before the last trading day or the position is closed at final settlement. Physical delivery is not simulated.</li>
      <li><b>Options</b>: Black-76, constant implied volatility, European expiry at scenario end; long options pay premium, short options receive premium and post margin.</li></ul></div>
      <div class="card"><h3>Price model and scenario rules</h3><p>Daily OHLC from geometric Brownian motion with four intraday sub-steps. Each scenario defines a starting drift and volatility and dated events that change drift, volatility, or apply a one-off jump (percentage). News appears on those days. The same seed always reproduces the same path, so you can replay a scenario and compare decisions.</p>
      ${CTA.table(['Scenario', 'Instrument', 'Days', 'Rules'], CTA.MARKET.SCENARIOS.map((s) => [esc(s.title), s.inst, s.days, s.events.map((e) => `d${e.day}: ${e.drift != null ? 'drift ' + (e.drift * 100).toFixed(0) + '% ' : ''}${e.vol != null ? 'vol ' + (e.vol * 100).toFixed(0) + '% ' : ''}${e.jumpPct ? 'jump ' + e.jumpPct + '%' : ''}`).join('; ')]))}</div></div>
      <div data-widget="specTable"></div><div data-widget="optionPayoff"></div>`;
  }
  CTA.FUT = { newAccount, open, step, equity, margins, path, price };
})();

  /* ------------------------------------------------ technical lab */
  function technical(b, q) {
    const coms = { gold: ['Gold (USD/oz)', 2000, 0.15], wheat: ['Wheat (USD/t)', 230, 0.3], sugar: ['Raw sugar (c/lb)', 19.5, 0.28], steel: ['HRC (USD/t)', 640, 0.25] };
    const com = q.c || 'gold', seed = +(q.s || 5);
    const [lab, start, vol] = coms[com];
    const D = C.simulateOHLC({ start, days: 260, vol, seed, drift: 0, events: [{ day: 60, drift: 0.3 }, { day: 130, drift: -0.25, vol: vol * 1.3 }, { day: 200, drift: 0.05, vol }] });
    const cl = D.map((x) => x.c);
    const s20 = C.sma(cl, 20), s50 = C.sma(cl, 50), bb = C.bollinger(cl, 20, 2), rsi = C.rsi(cl, 14), mac = C.macd(cl);
    const n = cl.length - 1; const lr = C.logReturns(cl.slice(-21)); const v20 = C.annualizedVol(lr);
    const look = cl.slice(-60); const res = Math.max(...D.slice(-60, -5).map((x) => x.h)), sup = Math.min(...D.slice(-60, -5).map((x) => x.l));
    const trend = s20[n] > s50[n] ? (cl[n] > s20[n] ? 'Uptrend (price > SMA20 > SMA50)' : 'Uptrend weakening (price below SMA20)') : (cl[n] < s20[n] ? 'Downtrend (price < SMA20 < SMA50)' : 'Downtrend weakening');
    // honest backtest: SMA20/50 crossover, long/short, with costs
    let pos = 0, eq = 100, trades = 0; const curve = [100];
    for (let i = 51; i < cl.length; i++) { const sig = s20[i - 1] > s50[i - 1] ? 1 : -1; if (sig !== pos) { trades++; eq *= (1 - 0.0015); pos = sig; } eq *= 1 + pos * (cl[i] / cl[i - 1] - 1); curve.push(eq); }
    const bh = cl[n] / cl[51] * 100;
    const show = (k) => q[k] !== '0';
    b.innerHTML = `<div class="card"><div class="row"><label>Dataset</label><select id="tc">${Object.entries(coms).map(([k, v]) => `<option value="${k}" ${k === com ? 'selected' : ''}>${v[0]}</option>`).join('')}</select><label>Seed</label><input id="ts" type="number" value="${seed}" style="width:90px"><button class="btn sm" id="tnew">New random history</button>
      ${[['sma', 'SMA 20/50'], ['bb', 'Bollinger'], ['vol', 'Volume']].map(([k, l]) => `<label class="check" style="display:inline-flex"><input type="checkbox" data-t="${k}" ${show(k) ? 'checked' : ''}> ${l}</label>`).join('')}<span class="muted" style="font-size:.8rem">${CTA.SIM} simulated history — not market data</span></div>
      <div id="tch"></div><div id="tvol"></div><h4>RSI (14)</h4><div id="trsi"></div><h4>MACD (12, 26, 9)</h4><div id="tmacd"></div></div>
      <div class="grid c2"><div class="card"><h3>What the indicators describe now</h3>${CTA.table(['Indicator', 'Reading', 'Description (not a prediction)'], [['Trend', esc(trend), 'Moving averages summarise past direction; they lag.'], ['RSI', f(rsi[n], 1), rsi[n] > 70 ? 'Recent gains dominate ("overbought") — can persist in strong trends.' : rsi[n] < 30 ? 'Recent losses dominate ("oversold") — can persist in downtrends.' : 'Neutral momentum.'], ['MACD', f(mac.line[n], 3) + ' vs signal ' + f(mac.signal[n], 3), mac.line[n] > mac.signal[n] ? 'Short-term momentum above its average.' : 'Short-term momentum below its average.'], ['Volatility (20d, annualised)', fmt.pct(v20 * 100, 1), 'Size of recent daily swings scaled to a year.'], ['Resistance (60d high)', f(res), cl[n] > res ? 'Price above prior high: breakout — watch whether it holds (false breakouts are common).' : 'Price below prior high.'], ['Support (60d low)', f(sup), cl[n] < sup ? 'Breakdown below prior low.' : 'Price above prior low.']])}</div>
        <div class="card"><h3>Does the signal make money? An honest test</h3><p class="muted" style="font-size:.88rem">Rule: long when SMA20 > SMA50, short otherwise; 0.15% cost per switch. On simulated random-walk data with regime changes.</p>${CTA.ui.kpis([{ label: 'Strategy result', value: f(curve[curve.length - 1] - 100, 1) + '%', cls: fmt.cls(curve[curve.length - 1] - 100) }, { label: 'Buy & hold', value: f(bh - 100, 1) + '%', cls: fmt.cls(bh - 100) }, { label: 'Switches', value: trades }, { label: 'Max drawdown', value: fmt.pct(C.maxDrawdown(curve) * 100, 1) }])}<div id="tbt"></div><p class="muted" style="font-size:.84rem">Change the seed: the same rule wins on some histories and loses on others. Indicators are descriptive tools, not guarantees.</p></div></div>
      <div data-widget="rrCalc"></div>`;
    const labels = D.map((_, i) => 'D' + i);

    if (show('vol')) CTA.chart(CTA.$('#tvol', b), { height: 90, labels, series: [{ type: 'bars', data: D.map((x) => x.v), label: 'Volume (simulated)', color: '#9db1cc' }], yMin: 0 });
    CTA.chart(CTA.$('#trsi', b), { height: 110, labels, series: [{ data: rsi, label: 'RSI', color: 'var(--c3)' }], hlines: [{ y: 70, color: 'var(--neg)', label: '70' }, { y: 30, color: 'var(--pos)', label: '30' }], yMin: 0, yMax: 100 });
    CTA.chart(CTA.$('#tmacd', b), { height: 120, labels, zero: true, series: [{ type: 'bars', data: mac.hist, label: 'Histogram', colorFn: (v) => (v >= 0 ? 'var(--pos)' : 'var(--neg)') }, { data: mac.line, label: 'MACD', color: 'var(--c1)' }, { data: mac.signal, label: 'Signal', color: 'var(--c2)' }] });
    CTA.chart(CTA.$('#tbt', b), { height: 140, series: [{ data: curve, label: 'Strategy (index)', color: 'var(--c1)' }, { data: cl.slice(51).map((x) => x / cl[51] * 100), label: 'Buy & hold', color: 'var(--c6)', dash: '4 3' }] });
    const go = (o) => { const qq = Object.assign({}, q, o); CTA.go('analysis/technical?' + Object.entries(qq).map(([k, v]) => k + '=' + v).join('&')); };

        <div class="card"><h4>Your offer</h4>${S.outcome ? '' : `<div class="form c2">${CTA.ui.field({ id: 'n-price', name: 'price', label: 'Price — ' + pl, value: o.price, step: 'any' })}${Object.entries(ISSUES).map(([k, v]) => CTA.ui.field({ id: 'n-' + k, name: k, label: v.label, type: 'select', value: o[k], options: v.opts })).join('')}</div><div class="row" style="margin-top:10px"><button class="btn primary" data-a="send">Send offer</button><button class="btn" data-a="accept" ${S.lastCounter ? '' : 'disabled'}>Accept their last counter-offer</button><button class="btn ghost" data-a="walk">Walk away</button></div>`}<div id="rev"></div></div></div>`;
      const live = () => { const v = S.outcome ? S.offer : readOffer(); const rv = review(cp, v, S.round, 'agreed'); CTA.$('#live', el).innerHTML = `<p style="margin:0">Economic result at these terms: <b class="${fmt.cls(rv.econ.total)}">${fmt.money(rv.econ.total, 'USD', 0)}</b> (${f(rv.econ.perUnit)} per ${cp.commodity === 'gold' ? 'oz' : cp.unit}${you === 'seller' ? ', after funding of credit days' : ''})</p>`; };
      const readOffer = () => { const v = CTA.ui.read(el, ['price', ...Object.keys(ISSUES)]); v.price = CTA.num(v.price, o.price); return v; };
      if (!S.outcome) { el.oninput = live; el.onchange = live; } else { el.oninput = null; el.onchange = null; }
      live();
      const chat = CTA.$('#chat', el); chat.scrollTop = chat.scrollHeight;
      const finish = (outcome, terms) => {
        S.outcome = outcome; S.offer = terms || S.offer;
        const rv = review(cp, S.offer, S.round, outcome);
        CTA.state.negotiations.push({ ts: Date.now(), id: cp.id, name: cp.name, outcome, rounds: S.round, score: rv.overall, econ: outcome === 'agreed' ? rv.econ.total : 0, terms: S.offer });
        CTA.record.caseResult('nego-' + cp.id, rv.overall);
        CTA.journalAdd({ auto: true, type: 'negotiation', commodity: cp.commodity, title: `Negotiation with ${cp.name}: ${outcome}`, pnl: outcome === 'agreed' ? rv.econ.total : 0, lessons: rv.miss.join(' ') });
        CTA.log(`Negotiation with ${cp.name}: ${outcome} (score ${Math.round(rv.overall)}%)`, 'nego'); CTA.save();
        draw();
        const lab = { profit: 'Commercial profitability', risk: 'Risk allocation', cash: 'Cash-flow implications', clarity: 'Contractual clarity', credit: you === 'seller' ? 'Buyer creditworthiness handled' : 'Supplier reliability handled', feasible: 'Execution feasibility' };
        CTA.$('#rev', el).innerHTML = `<div class="note ${outcome === 'agreed' ? 'ok' : 'warn'}"><strong>${outcome === 'agreed' ? 'Agreement reached' : 'No agreement'} — overall ${Math.round(rv.overall)}%</strong>Final terms: ${f(S.offer.price)} · ${Object.keys(ISSUES).map((k) => optLabel(k, S.offer[k])).join(' · ')}</div>
          ${CTA.table(['Dimension', 'Score'], Object.entries(lab).map(([k, l]) => [l, Math.round(Math.max(0, Math.min(100, rv.pts[k]))) + '%']))}
          <h4>What you did well</h4><ul>${(rv.good.length ? rv.good : ['—']).map((x) => `<li>${esc(x)}</li>`).join('')}</ul><h4>What you missed</h4><ul>${(rv.miss.length ? rv.miss : ['Nothing major.']).map((x) => `<li>${esc(x)}</li>`).join('')}</ul><h4>How a professional might improve it</h4><ul>${rv.improve.map((x) => `<li>${esc(x)}</li>`).join('')}</ul><div class="row"><a class="btn primary" href="#/dealroom/${cp.id}?r=${Date.now()}">Negotiate again</a><a class="btn" href="#/dealroom">Other counterparties</a></div>`;
      };
      if (S.outcome) return;
      CTA.$('[data-a=send]', el).onclick = () => {
        const v = readOffer(); if (!(v.price > 0)) { CTA.toast('Enter a valid price.', 'warn'); return; }
        S.round++; S.offer = v;
        S.log.push({ who: 'me', t: `Price ${f(v.price)}; ${Object.keys(ISSUES).map((k) => optLabel(k, v[k])).join('; ')}.` });
        const u = util(cp, v), th = threshold(cp, S.round);
        const msg = STYLE_MSG[cp.style];
        if (u >= th) { S.log.push({ who: 'them', t: msg.accept }); finish('agreed', v); return; }
        if (S.round >= cp.patience) { S.log.push({ who: 'them', t: msg.walk }); finish('no deal'); return; }
        const { c, changed } = counter(cp, v, S.round);
        S.lastCounter = c;
        const reasons = changed.map((k) => `${ISSUES[k].label.toLowerCase()}: ${optLabel(k, c[k])}`).join('; ');
        S.log.push({ who: 'them', t: `${msg.counter}We propose price ${f(c.price)}${reasons ? '; ' + reasons : ''}.${cp.style === 'aggressive' ? ' Take it or leave it.' : ''}` });
        S.offer = Object.assign({}, c); draw();
      };
      CTA.$('[data-a=accept]', el).onclick = () => { if (!S.lastCounter) return; S.log.push({ who: 'me', t: 'We accept your last proposal.' }); S.log.push({ who: 'them', t: STYLE_MSG[cp.style].accept }); finish('agreed', S.lastCounter); };
      CTA.$('[data-a=walk]', el).onclick = () => { S.log.push({ who: 'me', t: 'We cannot agree on these terms. Thank you for your time.' }); finish('walked away'); };
    };
    draw();
  } });
  CTA.DEALROOM = { CP, util, threshold, counter, review };
})();

  function lcExercise(b, x) {

        if (v.pay === 'lc') add('Draft/bill of exchange (if called for) & LC-specific documents', 'Exactly as the credit requires', 'Beneficiary', 'Transaction-dependent');

  }

  /* ------------------------------------------------ library */
  function library(b, r) {
    const id = r.parts[1];
